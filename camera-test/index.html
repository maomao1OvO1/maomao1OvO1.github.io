<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📱 硬件测试大厅</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

h1{
    margin:20px 0 30px;
}

.test-list{
    width:100%;
    max-width:400px;
    margin:auto;
}

.test-list button{
    display:block;
    width:100%;
    padding:16px 20px;
    margin:14px 0;
    border:none;
    border-radius:18px;
    background:white;
    color:#222;
    box-shadow:0 4px 15px #0002;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

.test-list button:active{
    transform:scale(0.97);
}


/* ===== 深色模式 ===== */

body.dark-mode{
    background:#121212;
    color:#eee;
}

body.dark-mode .test-list button{
    background:#292929;
    color:#eee;
    box-shadow:0 4px 15px #0006;
}


/* ===== 返回主页 ===== */

.hardware-back{
    position:fixed;

    top:20px;
    right:20px;

    left:auto;
    bottom:auto;

    z-index:99999;

    width:auto;

    margin:0;
    padding:10px 16px;

    border:none;
    border-radius:14px;

    font-size:15px;

    background:rgb(228,219,254);
    color:rgb(124,92,191);

    box-shadow:0 4px 15px #0002;

    cursor:pointer;

    transition:0.2s;
}

.hardware-back:active{
    transform:scale(0.95);
}


/* ===== 深色模式返回主页 ===== */



</style>

<link rel="stylesheet" href="hardware.css">




<style id="index-back-final">

/* ===== 返回主页按钮 ===== */

body.dark-mode .hardware-back{
    background:rgb(228,219,254) !important;
    color:rgb(124,92,191) !important;
}

</style>
</head>

<body>

<h1>📱 硬件测试大厅</h1>

<div class="test-list">

    <button onclick="location.href='tests/camera.html'">
        📷 摄像头
    </button>

    <button onclick="location.href='tests/vibration.html'">
        📳 震动
    </button>

    <button onclick="location.href='tests/microphone.html'">
        🎤 麦克风
    </button>

    <button onclick="location.href='tests/gamepad.html'">
        🎮 手柄
    </button>

    <button onclick="location.href='tests/sensors.html'">
        🧭 手机传感器
    </button>

    <button onclick="location.href='tests/audio.html'">
        🔊 音频分析
    </button>

    <button onclick="location.href='tests/screen.html'">
        🖥️ 屏幕 / 全屏
    </button>

    <button onclick="location.href='tests/network.html'">
        🌐 网络测试
    </button>

    <button onclick="location.href='tests/battery.html'">
        🔋 电池检测
    </button>

    <button onclick="location.href='tests/touch.html'">
        📱 触摸屏测试
    </button>

    <button onclick="location.href='tests/input.html'">
        🖱️ 输入设备测试
    </button>

    <button onclick="location.href='tests/device.html'">
        📋 设备信息
    </button>

    <button onclick="location.href='tests/performance.html'">
        ⚡ 性能测试
    </button>

    <button onclick="location.href='tests/flashlight.html'">
        🔦 手电筒测试
    </button>

</div>

<button
    class="hardware-back"
    onclick="location.href='../index.html'">
    🏠 返回主页
</button>


<script>

function applyMainTheme(){

    const dark =
        localStorage.getItem("theme") === "dark";

    document.body.classList.toggle(
        "dark-mode",
        dark
    );

}

applyMainTheme();

</script>

</body>

</html>
