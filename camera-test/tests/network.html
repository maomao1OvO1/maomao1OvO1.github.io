<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🌐 网络测试</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin:20px 0 25px;
}

.card{
    max-width:420px;
    margin:15px auto;
    padding:22px;
    background:white;
    border-radius:22px;
    box-shadow:0 5px 20px #0002;
}

.item{
    margin:18px 0;
}

.label{
    color:#777;
    font-size:14px;
    margin-bottom:6px;
}

.value{
    font-size:25px;
    font-weight:bold;
}

button{
    width:90%;
    max-width:350px;
    padding:14px 20px;
    margin:9px;
    border:none;
    border-radius:15px;
    background:white;
    box-shadow:0 4px 12px #0002;
    font-size:17px;
}

button:active{
    transform:scale(.97);
}

#message{
    margin:15px;
    color:#666;
    min-height:20px;
}

</style>

</head>

<body>

<h1>🌐 网络测试</h1>


<div class="card">

    <div class="item">

        <div class="label">
            网络状态
        </div>

        <div
            id="online"
            class="value">
            检测中……
        </div>

    </div>


    <div class="item">

        <div class="label">
            连接方式
        </div>

        <div
            id="connection"
            class="value">
            检测中……
        </div>

    </div>

</div>


<div class="card">

    <div class="label">
        延迟
    </div>

    <div
        id="ping"
        class="value">
        --
    </div>

    <div id="pingText">
        点击下面开始测试
    </div>

</div>


<button onclick="runTest()">
    🚀 开始网络测试
</button>

<br>

<button onclick="location.href='../index.html'">
    ← 返回大厅
</button>


<div id="message"></div>


<script>

// ============================
// 获取网络信息
// ============================

function updateNetworkInfo(){

    // 在线 / 离线

    const online =
        document.getElementById("online");

    if(navigator.onLine){

        online.textContent =
            "🟢 在线";

    }else{

        online.textContent =
            "🔴 离线";

    }


    // 网络连接 API

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    if(!connection){

        document.getElementById(
            "connection"
        ).textContent =
            "❓ 浏览器不提供";

        return;

    }


    // Wi-Fi / 蜂窝网络

    let type =
        connection.type;


    if(type === "wifi"){

        document.getElementById(
            "connection"
        ).textContent =
            "📶 Wi-Fi";

    }else if(
        type === "cellular"
    ){

        document.getElementById(
            "connection"
        ).textContent =
            "📱 移动网络";

    }else if(type){

        document.getElementById(
            "connection"
        ).textContent =
            type;

    }else{

        document.getElementById(
            "connection"
        ).textContent =
            "❓ 未知";

    }

}


// ============================
// 延迟测试
// ============================

async function pingServer(){

    const ping =
        document.getElementById(
            "ping"
        );

    const text =
        document.getElementById(
            "pingText"
        );


    ping.textContent =
        "测试中…";

    text.textContent =
        "";


    try{

        const start =
            performance.now();


        /*
         * 测试当前网页服务器
         *
         * 如果你把这个页面放到 GitHub Pages，
         * 测出来的就是：
         *
         * 手机 → GitHub Pages
         */


        await fetch(
            "https://maomao1OvO1.github.io/?ping=" +
            Date.now(),
            {
                method:"HEAD",
                cache:"no-store",
                mode:"no-cors"
            }
        );


        const end =
            performance.now();


        const ms =
            Math.round(
                end - start
            );


        ping.textContent =
            ms + " ms";


        if(ms < 50){

            text.textContent =
                "🟢 非常快";

        }else if(ms < 100){

            text.textContent =
                "🟢 很快";

        }else if(ms < 200){

            text.textContent =
                "🟡 一般";

        }else if(ms < 500){

            text.textContent =
                "🟠 延迟较高";

        }else{

            text.textContent =
                "🔴 延迟很高";

        }

    }catch(error){

        ping.textContent =
            "失败";

        text.textContent =
            "❌ 无法连接测试服务器";

    }

}


// ============================
// 完整测试
// ============================

async function runTest(){

    document.getElementById(
        "message"
    ).textContent =
        "正在测试……";


    updateNetworkInfo();

    await pingServer();


    document.getElementById(
        "message"
    ).textContent =
        "✅ 测试完成";

}


// ============================
// 网络状态变化
// ============================

window.addEventListener(
    "online",
    updateNetworkInfo
);

window.addEventListener(
    "offline",
    updateNetworkInfo
);


// 初始检测

updateNetworkInfo();

</script>

</body>

</html>
