<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🔋 电池检测</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

h1{
    margin:20px 0 8px;
}

.desc{
    color:#777;
    margin-bottom:25px;
}

.card{
    max-width:460px;
    margin:15px auto;
    padding:24px 20px;
    background:white;
    border-radius:22px;
    box-shadow:0 5px 20px #0002;
}

.battery{
    width:180px;
    height:90px;
    border:5px solid #6543a4;
    border-radius:15px;
    margin:10px auto 30px;
    position:relative;
    overflow:visible;
}

.battery::after{
    content:"";
    position:absolute;
    right:-17px;
    top:25px;
    width:12px;
    height:30px;
    background:#6543a4;
    border-radius:0 5px 5px 0;
}

.level{
    position:absolute;
    left:0;
    bottom:0;
    width:0%;
    height:100%;
    background:#6543a4;
    border-radius:8px;
    transition:width .5s;
}

.percent{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.item{
    padding:15px 8px;
    background:#f3f3f3;
    border-radius:16px;
}

.label{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    font-size:19px;
    font-weight:bold;
}

.status{
    margin-top:18px;
    padding:12px;
    border-radius:14px;
    background:#eee;
    color:#666;
}

.note{
    margin-top:18px;
    font-size:13px;
    line-height:1.6;
    color:#888;
}

button{
    width:90%;
    max-width:350px;
    padding:14px 20px;
    margin:9px;
    border:none;
    border-radius:15px;
    background:white;
    color:#6543a4;
    box-shadow:0 4px 12px #0002;
    font-size:17px;
}

button:active{
    transform:scale(.97);
}

body.dark-mode{
    background:#121212;
    color:#eee;
}

body.dark-mode .card{
    background:#1e1e1e;
}

body.dark-mode .desc,
body.dark-mode .label,
body.dark-mode .note{
    color:#aaa;
}

body.dark-mode .item{
    background:#292929;
}

body.dark-mode .status{
    background:#292929;
}

body.dark-mode button{
    background:#333;
    color:#fff;
}

</style>







<link rel="stylesheet" href="../hardware.css">


<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}
body.dark-mode .card,
body.dark-mode .desc,
body.dark-mode .note,
body.dark-mode .item,
body.dark-mode .test-list button,
body.dark-mode button,
body.dark-mode input,
body.dark-mode select{
    background:#1e1e1e !important;
    color:#eeeeee !important;
    border-color:#333333 !important;
}
body.dark-mode .label,
body.dark-mode h1,body.dark-mode h2,body.dark-mode h3{
    color:#bb9cff !important;
}
body.dark-mode p,body.dark-mode li,body.dark-mode .desc p{
    color:#aaaaaa !important;
}
body.dark-mode .hardware-back{
    background:#222222 !important;
    color:#bb9cff !important;
}
</style>
</head>


<body>

<h1>🔋 电池检测</h1>

<p class="desc">
实时检测设备电池信息
</p>


<div class="card">

<div class="battery">

<div id="level"
class="level">
</div>

<div id="percent"
class="percent">
--%
</div>

</div>


<div class="grid">


<div class="item">

<div class="label">
电池电量
</div>

<div id="batteryLevel"
class="value">
--
</div>

</div>


<div class="item">

<div class="label">
充电状态
</div>

<div id="charging"
class="value">
--
</div>

</div>


<div class="item">

<div class="label">
电池电压
</div>

<div id="voltage"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电电流
</div>

<div id="current"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电功率
</div>

<div id="power"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
电池温度
</div>

<div id="temperature"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电协议
</div>

<div id="protocol"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
预计剩余时间
</div>

<div id="time"
class="value">
不可用
</div>

</div>


</div>


<div id="status"
class="status">
正在读取电池信息……
</div>


<div class="note">
网页无法直接读取 Android 的全部电源硬件数据。<br>
电压、电流、功率、温度和充电协议不会进行猜测。
</div>

</div>


<button onclick="updateBattery()">
🔄 刷新电池信息
</button>

<br>

<button onclick="location.href='../index.html'" class="hardware-back">
← 返回硬件大厅
</button>


<script>


// ============================
// 深色模式
// ============================

const dark =
    localStorage.getItem("darkMode") === "1" ||
    localStorage.getItem("theme") === "dark";

if(dark){
    document.body.classList.add("dark-mode");
}


// ============================
// 电池
// ============================

let battery = null;


// ============================
// 时间
// ============================

function formatTime(seconds){

    // 浏览器没有提供有效的预计时间
    if(
        !isFinite(seconds) ||
        seconds <= 60
    ){

        return "系统未提供";

    }

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    if(hours > 0){

        return (
            hours +
            " 小时 " +
            minutes +
            " 分钟"
        );

    }

    return minutes + " 分钟";

}


// ============================
// 更新
// ============================

function updateBattery(){

    if(!battery){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 浏览器不支持 Battery Status API";

        return;

    }


    const percent =
        Math.round(
            battery.level * 100
        );


    document.getElementById(
        "batteryLevel"
    ).textContent =
        percent + "%";


    document.getElementById(
        "percent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "level"
    ).style.width =
        percent + "%";


    if(
        battery.charging
    ){

        document.getElementById(
            "charging"
        ).textContent =
            "⚡ 正在充电";

        document.getElementById(
            "time"
        ).textContent =
            formatTime(
                battery.chargingTime
            );

    }else{

        document.getElementById(
            "charging"
        ).textContent =
            "🔋 正在放电";

        document.getElementById(
            "time"
        ).textContent =
            formatTime(
                battery.dischargingTime
            );

    }


    document.getElementById(
        "status"
    ).textContent =
        "🟢 电池基本信息读取成功";

}


// ============================
// 初始化
// ============================

async function init(){

    if(
        !navigator.getBattery
    ){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 当前浏览器没有提供电池 API";

        return;

    }


    try{

        battery =
            await navigator.getBattery();


        updateBattery();


        battery.addEventListener(
            "levelchange",
            updateBattery
        );


        battery.addEventListener(
            "chargingchange",
            updateBattery
        );


        battery.addEventListener(
            "chargingtimechange",
            updateBattery
        );


        battery.addEventListener(
            "dischargingtimechange",
            updateBattery
        );


    }catch(error){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 无法读取电池信息";

        console.error(error);

    }

}


init();

</script>

</body>

</html>
