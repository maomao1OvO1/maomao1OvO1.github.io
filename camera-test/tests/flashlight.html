<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>🔦 手电筒测试</title>

<link rel="stylesheet" href="../hardware.css">

<style>

body{
    margin:0;
    padding:30px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:430px;
    margin:auto;
}

h1{
    margin:20px 0 10px;
}

.subtitle{
    color:#777;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:24px;
    padding:25px 20px;
    margin:18px 0;
    box-shadow:0 5px 20px #0002;
}

.flashlight-icon{
    font-size:80px;
    margin:10px 0 20px;
    transition:.2s;
}

.flashlight-icon.on{
    filter:drop-shadow(0 0 25px #ffd84d);
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:0;
    border-radius:18px;
    font-size:18px;
    cursor:pointer;
}

#toggle{
    background:#6543a5;
    color:white;
}

#toggle.off{
    background:#ddd;
    color:#333;
}

button:active{
    transform:scale(.97);
}

.status{
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
}

.info{
    text-align:left;
    line-height:1.8;
    color:#555;
}

.warning{
    color:#d97706;
}

.success{
    color:#16803c;
}

.error{
    color:#c62828;
}



</style>











<style id="flashlight-dark-mode">

body.dark-mode{
    background:#17151c;
    color:#eee;
}

body.dark-mode .subtitle{
    color:#aaa;
}

body.dark-mode .card{
    background:#24212b;
    box-shadow:0 5px 20px #0006;
}

body.dark-mode .info{
    color:#ccc;
}

body.dark-mode .hardware-back{
    background:#2a2633;
    color:#d8c7ff;
    box-shadow:0 4px 15px #0006;
}

body.dark-mode #toggle.off{
    background:#3a3642;
    color:#eee;
}

body.dark-mode #message{
    color:#ddd;
}

</style>





<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}
body.dark-mode .card,
body.dark-mode .desc,
body.dark-mode .note,
body.dark-mode .item,
body.dark-mode .test-list button,
body.dark-mode button,
body.dark-mode input,
body.dark-mode select{
    background:#1e1e1e !important;
    color:#eeeeee !important;
    border-color:#333333 !important;
}
body.dark-mode .label,
body.dark-mode h1,body.dark-mode h2,body.dark-mode h3{
    color:#bb9cff !important;
}
body.dark-mode p,body.dark-mode li,body.dark-mode .desc p{
    color:#aaaaaa !important;
}
body.dark-mode .hardware-back{
    background:#222222 !important;
    color:#bb9cff !important;
}
</style>
</head>

<body>

<div class="container">

<h1>🔦 手电筒测试</h1>

<div class="subtitle">
测试设备摄像头闪光灯 / 手电筒控制能力
</div>


<div class="card">

<div id="icon"
class="flashlight-icon">
🔦
</div>

<div id="status"
class="status">
正在检测……
</div>

<button id="toggle">
检测中…
</button>

</div>


<div class="card">

<div class="info">

<div>
<strong>控制方式：</strong>
<span id="mode">检测中</span>
</div>

<div>
<strong>闪光灯：</strong>
<span id="flash">检测中</span>
</div>

<div>
<strong>设备支持：</strong>
<span id="support">检测中</span>
</div>

<div>
<strong>当前状态：</strong>
<span id="state">关闭</span>
</div>

</div>

</div>


<div id="message"
class="card">
请等待检测完成。
</div>


<button
class="hardware-back hardware-back"
onclick="location.href='../index.html'">
← 返回硬件大厅
</button>

</div>


<script>

let stream=null;

let track=null;

let torchSupported=false;

let torchOn=false;


/*
 * 获取后置摄像头。
 */

async function getCamera(){

    try{

        stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },

                audio:false

            });


        const tracks=
            stream.getVideoTracks();


        if(!tracks.length){

            throw new Error(
                "没有找到摄像头"
            );

        }


        track=tracks[0];


        return track;

    }catch(error){

        console.error(error);

        return null;

    }

}


/*
 * 检测手电筒能力。
 */

async function checkTorch(){

    const button=
        document.getElementById("toggle");

    const status=
        document.getElementById("status");

    const message=
        document.getElementById("message");


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        status.textContent=
            "当前浏览器不支持摄像头 API";

        status.className=
            "status error";

        button.textContent=
            "不可用";

        button.disabled=true;

        return;

    }


    const currentTrack=
        await getCamera();


    if(!currentTrack){

        status.textContent=
            "无法访问摄像头";

        status.className=
            "status warning";

        document.getElementById(
            "flash"
        ).textContent=
            "无法检测";


        document.getElementById(
            "support"
        ).textContent=
            "无法确认";


        button.textContent=
            "无法测试";

        button.disabled=true;


        message.innerHTML=
            "请允许浏览器使用摄像头权限。<br>" +
            "手电筒控制通常依赖后置摄像头的闪光灯。";


        return;

    }


    const capabilities=
        currentTrack.getCapabilities
        ? currentTrack.getCapabilities()
        : {};


    torchSupported=
        capabilities.torch === true;


    document.getElementById(
        "mode"
    ).textContent=
        "Camera Track";


    document.getElementById(
        "flash"
    ).textContent=
        torchSupported
        ? "支持"
        : "未检测到";


    document.getElementById(
        "support"
    ).textContent=
        torchSupported
        ? "支持手电筒控制"
        : "浏览器未提供控制接口";


    if(torchSupported){

        status.textContent=
            "手电筒可测试";

        status.className=
            "status success";


        button.textContent=
            "🔦 打开手电筒";


        message.innerHTML=
            "检测到浏览器提供的 Torch 控制接口。<br>" +
            "点击按钮测试实际闪光灯。";

    }else{

        status.textContent=
            "无法通过浏览器控制";

        status.className=
            "status warning";


        button.textContent=
            "不支持";


        button.disabled=true;


        message.innerHTML=
            "当前设备或浏览器没有提供 " +
            "<strong>torch</strong> 控制能力。<br><br>" +
            "这不一定代表手机没有手电筒，" +
            "可能只是浏览器禁止网页控制闪光灯。";

    }

}


/*
 * 开关手电筒。
 */

async function toggleTorch(){

    if(!track || !torchSupported){
        return;
    }


    const button=
        document.getElementById("toggle");


    const status=
        document.getElementById("status");


    const icon=
        document.getElementById("icon");


    try{

        torchOn=!torchOn;


        await track.applyConstraints({

            advanced:[
                {
                    torch:torchOn
                }
            ]

        });


        document.getElementById(
            "state"
        ).textContent=
            torchOn
            ? "开启"
            : "关闭";


        if(torchOn){

            icon.classList.add("on");

            status.textContent=
                "手电筒已开启";

            status.className=
                "status success";

            button.textContent=
                "🔆 关闭手电筒";

            button.classList.remove(
                "off"
            );

        }else{

            icon.classList.remove("on");

            status.textContent=
                "手电筒已关闭";

            status.className=
                "status";

            button.textContent=
                "🔦 打开手电筒";

            button.classList.add(
                "off"
            );

        }

    }catch(error){

        console.error(error);

        torchOn=false;


        status.textContent=
            "手电筒控制失败";

        status.className=
            "status error";


        document.getElementById(
            "message"
        ).innerHTML=
            "浏览器拒绝了手电筒控制请求。<br>" +
            "这通常是浏览器或设备权限限制。";


        button.textContent=
            "控制失败";

    }

}


/*
 * 页面离开时关闭摄像头。
 */

window.addEventListener(
    "pagehide",
    ()=>{

        if(track){

            try{

                track.applyConstraints({

                    advanced:[
                        {
                            torch:false
                        }
                    ]

                });

            }catch{}

        }


        if(stream){

            stream.getTracks()
                .forEach(
                    t=>t.stop()
                );

        }

    }
);


document.getElementById(
    "toggle"
).addEventListener(
    "click",
    toggleTorch
);


checkTorch();

</script>


<script>

function applyMainTheme(){

    const dark =
        localStorage.getItem("darkMode") === "1" ||
        localStorage.getItem("theme") === "dark";

    document.body.classList.toggle(
        "dark-mode",
        dark
    );

}

applyMainTheme();

</script>

</body>

</html>
