<!DOCTYPE html>
<!--
  ============================================================
  🎮 手柄测试页（hardware-lab/tests/gamepad.html）
  ------------------------------------------------------------
  【测试对象】游戏手柄（Gamepad）：连接检测、按键、摇杆、扳机、震动。
  【使用的浏览器 API（Gamepad API）】
    - navigator.getGamepads()                读取当前所有手柄
    - window "gamepadconnected"              手柄连接事件
    - window "gamepaddisconnected"           手柄断开事件
    - Gamepad.buttons[i].pressed / .value    按钮是否按下 / 扳机模拟量(0~1)
    - Gamepad.axes[i]                        摇杆轴数值(-1~1)
    - Gamepad.vibrationActuator.playEffect() 触发震动（双马达）
    - actuator.reset()                       停止震动
  【测试流程】
    ① 页面加载 → 注册 gamepadconnected / gamepaddisconnected 监听。
    ② 捕获到连接手柄后，用 getCurrentGamepad() 拿到当前手柄。
    ③ update() 主循环通过 requestAnimationFrame 每帧轮询手柄状态，
       刷新按钮高亮、左右摇杆圆点位置、左右扳机填充比例。
    ④ 震动区：读取输入的秒数，用 vibrationActuator.playEffect("dual-rumble")
       触发强/弱/双马达震动，或 reset() 停止。
  【PASS/FAIL 判定】
    能检测到手柄并实时反馈按键/摇杆/扳机 → 状态显示「手柄已连接」；
    手柄任何交互能在页面上高亮/移动 → 该项通过；否则显示「未检测到手柄」。
  ============================================================
-->
<html lang="zh-CN">

<head>
<script src="/device-check.js?v=15"></script>

<style>
/* ==== 浅色模式基础样式（默认外观） ==== */
/* 说明：按键/摇杆用 .pressed 或圆点位移做实时高亮；扳机用 width 模拟填充 */

body{

    padding:25px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin-bottom:10px;
}

#status{
    margin:15px;
    font-size:18px;
}

#device{
    color:#666;

}

.controller{
    max-width:500px;
    margin:25px auto;
    padding:25px;
    background:white;
    border-radius:25px;
    box-shadow:0 5px 20px #0002;
}

.row{
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin:20px 0;
}

.key{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    margin:5px;
    transition:0.05s;
}

.key.pressed{
    background:#555;
    color:white;
    transform:scale(1.12);
}

.trigger{
    width:110px;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.trigger-fill{
    width:0%;
    height:100%;
    background:#555;
}

.stick{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ddd;
    position:relative;
    margin:auto;
}

.stick-dot{
    width:25px;
    height:25px;
    border-radius:50%;
    background:#555;
    position:absolute;
    left:47px;
    top:47px;
}

.value{
    font-size:13px;
    margin-top:8px;
    color:#666;
}

button{
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input{
    padding:8px;
    width:70px;
}


/* 深色 */

body.dark-mode{
    background:#121212;
    color:#eee;
}

body.dark-mode .controller{

}

body.dark-mode .key{

    color:#eee;
}

    background:#333;
}

body.dark-mode .stick-dot{
    background:#aaa;
}

body.dark-mode .trigger{
    background:#333;
}

body.dark-mode #device{
    color:#aaa;
}

body.dark-mode input{
    background:#292929;
    color:white;
    border:1px solid #555;
}

</style>











<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */

    background:#121212 !important;
    color:#eeeeee !important;

<body>

<h1>🎮 手柄测试</h1>

<div id="status">
请连接手柄，然后按任意普通按键
</div>

<div id="device"></div>


<!-- 手柄控制器可视化区域：震动设置 + 按键/摇杆/扳机实时反馈 -->
<div class="controller">

<!-- ========== 震动控制区：左侧强马达 / 右侧弱马达 / 双马达 / 停止 ========== -->
<h2>📳 手柄震动</h2>

<p>

左 / 强震动：

<input
id="strongTime"
type="number"
min="0.1"
step="0.1"
value="1">

秒

</p>

<p>

右 / 弱震动：

<input
id="weakTime"
type="number"
min="0.1"
step="0.1"
value="1">

秒

</p>

<button onclick="vibrateStrong()">
左振动
</button>

<button onclick="vibrateWeak()">
右振动
</button>

<br>

<button onclick="vibrateBoth()">
左右同时振动
</button>

<button onclick="stopGamepadVibration()">
停止
</button>

</div>


<div class="row">

<div>

<b>LB</b>

<div id="b4" class="key">
LB
</div>

</div>


<div>

<b>RB</b>

<div id="b5" class="key">
RB
</div>

</div>

</div>


<div class="row">

<div>

<b>LT</b>

<div class="trigger">

<div id="lt"
class="trigger-fill">
</div>

</div>

<div id="ltValue"
class="value">
0%
</div>

</div>


<div>

<b>RT</b>

<div class="trigger">

<div id="rt"
class="trigger-fill">
</div>

</div>

<div id="rtValue"
class="value">
0%
</div>

</div>

</div>


<div class="row">

<div id="b2" class="key">
X
</div>

<div id="b3" class="key">
Y
</div>

<div id="b1" class="key">
B
</div>

<div id="b0" class="key">
A
</div>

</div>


<div class="row">

<div>

<h3>左摇杆</h3>

<div class="stick">

<div id="leftDot"
class="stick-dot">
</div>

</div>

<div id="leftValue"
class="value">

X 0.00<br>
Y 0.00

</div>

</div>


<div>

<h3>右摇杆</h3>

<div class="stick">

<div id="rightDot"
class="stick-dot">
</div>

</div>

<div id="rightValue"
class="value">

X 0.00<br>
Y 0.00

</div>

</div>

</div>


<h3>十字键</h3>

<div class="row">

<div id="b12" class="key">
↑
</div>

</div>

<div class="row">

<div id="b14" class="key">
←
</div>

<div id="b13" class="key">
↓
</div>

<div id="b15" class="key">
→
</div>

</div>


<div class="row">

<div id="b8" class="key">
☰
</div>

<div id="b9" class="key">
≡
</div>

</div>


<button
class="hardware-back hardware-back"
onclick="location.href='../index.html'">
← 返回硬件大厅
</button>


<script>

/* ============================
   主站深色模式
============================ */

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}


/* ============================
   手柄
============================ */

/* 全局手柄引用：连接成功后指向当前使用的 Gamepad 对象 */
let gamepad = null;


/* 手柄连接事件：保存 Gamepad 对象并更新「已连接」状态与设备名 */
window.addEventListener(
    "gamepadconnected",
    function(event){

        gamepad = event.gamepad;

        document.getElementById(
            "status"
        ).textContent =
            "🎮 手柄已连接";

        document.getElementById(
            "device"
        ).textContent =
            gamepad.id;

    }
);


/* 手柄断开事件：若断开的是当前手柄则清空引用，并重置状态文本 */
window.addEventListener(
    "gamepaddisconnected",
    function(event){

        if(
            gamepad &&
            event.gamepad.index === gamepad.index
        ){

            gamepad = null;

        }

        document.getElementById(
            "status"
        ).textContent =
            "手柄已断开";

        document.getElementById(
            "device"
        ).textContent = "";

    }
);


/* ============================
   获取当前手柄
   ------------------------------------------------------------------
   逻辑：优先返回 navigator.getGamepads()[gamepad.index]（已连接那只）；
   若为空则遍历 getGamepads() 找到第一个存在的 pad 作为当前手柄，
   顺带把状态/设备名更新为「手柄已连接」。找不到则返回 null。
============================ */

function getCurrentGamepad(){

    const pads =
        navigator.getGamepads();

    if(
        gamepad &&
        pads[gamepad.index]
    ){

        return pads[gamepad.index];

    }


    for(
        const pad of pads
    ){

        if(pad){

            gamepad = pad;

            document.getElementById(
                "status"
            ).textContent =
                "🎮 手柄已连接";

            document.getElementById(
                "device"
            ).textContent =
                pad.id;

            return pad;

        }

    }

    return null;

}


/* ============================
   震动（dual-rumble 双马达驱动）
   ------------------------------------------------------------------
   getVibrationActuator()：取当前手柄的震动执行器，
   未连接或手柄无 vibrationActuator 时弹窗提示并返回 null。
============================ */

function getVibrationActuator(){

    const pad =
        getCurrentGamepad();

    if(!pad){

        alert("请先连接手柄");

        return null;

    }

    if(!pad.vibrationActuator){

        alert(
            "这个手柄没有提供网页震动接口"
        );

        return null;

    }

    return pad.vibrationActuator;

}


/* 左/强震动：读取 strongTime 秒数，只驱动强马达（strongMagnitude=1，weak=0） */
function vibrateStrong(){

    const actuator =
        getVibrationActuator();

    if(!actuator) return;

    const seconds =
        Number(
            document.getElementById(
                "strongTime"
            ).value
        );

    actuator.playEffect(
        "dual-rumble",
        {
            duration:
                seconds * 1000,

            startDelay:0,

            strongMagnitude:1,

            weakMagnitude:0

        }
    );

}


/* 右/弱震动：读取 weakTime 秒数，只驱动弱马达（weakMagnitude=1，strong=0） */
function vibrateWeak(){

    const actuator =
        getVibrationActuator();

    if(!actuator) return;

    const seconds =
        Number(
            document.getElementById(
                "weakTime"
            ).value
        );

    actuator.playEffect(
        "dual-rumble",
        {
            duration:
                seconds * 1000,

            startDelay:0,

            strongMagnitude:0,

            weakMagnitude:1

        }
    );

}


/* 左右同时震动：两马达都满幅，时长取 strong/weak 输入中较大者 */
function vibrateBoth(){

    const actuator =
        getVibrationActuator();

    if(!actuator) return;

    const strong =
        Number(
            document.getElementById(
                "strongTime"
            ).value
        );

    const weak =
        Number(
            document.getElementById(
                "weakTime"
            ).value
        );

    actuator.playEffect(
        "dual-rumble",
        {
            duration:
                Math.max(
                    strong,
                    weak
                ) * 1000,

            startDelay:0,

            strongMagnitude:1,

            weakMagnitude:1

        }
    );

}


/* 停止震动：调用 actuator.reset() 立刻中止当前震动效果 */
function stopGamepadVibration(){

    const actuator =
        getVibrationActuator();

    if(!actuator) return;

    if(
        actuator.reset
    ){

        actuator.reset();

    }

}


/* ============================
   按钮
   ------------------------------------------------------------------
   updateButton()：根据 pad.buttons[i].pressed 给对应按键元素加/去
   "pressed" 类，实现按下高亮反馈。元素不存在（非显示按钮）则跳过。
============================ */

function updateButton(
    index,
    pad
){

    const element =
        document.getElementById(
            "b" + index
        );

    if(!element) return;

    const button =
        pad.buttons[index];

    if(
        button &&
        button.pressed
    ){

        element.classList.add(
            "pressed"
        );

    }else{

        element.classList.remove(
            "pressed"
        );

    }

}


/* ============================
   摇杆
   ------------------------------------------------------------------
   updateStick()：读 pad.axes[x/y]（-1~1），把圆点 dot 移到对应偏移，
   并在 valueId 里显示 X/Y 数值。x,y 为轴在 axes 数组里的下标。
============================ */

function updateStick(
    pad,
    x,
    y,
    dotId,
    valueId
){

    let px =
        pad.axes[x] || 0;

    let py =
        pad.axes[y] || 0;


    const dot =
        document.getElementById(
            dotId
        );


    dot.style.left =
        (47 + px * 45) + "px";

    dot.style.top =
        (47 + py * 45) + "px";


    document.getElementById(
        valueId
    ).innerHTML =
        "X " +
        px.toFixed(2) +
        "<br>Y " +
        py.toFixed(2);

}


/* ============================
   扳机
   ------------------------------------------------------------------
   updateTrigger()：读 pad.buttons[index].value（0~1 模拟量），
   用它设填充条 width 百分比，并显示对应百分比文本。
============================ */

function updateTrigger(
    pad,
    index,
    fillId,
    valueId
){

    const value =
        pad.buttons[index]?.value || 0;


    document.getElementById(
        fillId
    ).style.width =
        value * 100 + "%";


    document.getElementById(
        valueId
    ).textContent =
        Math.round(
            value * 100
        ) + "%";

}


/* ============================
   主循环（核心轮询逻辑）
   ------------------------------------------------------------------
   update()：用 requestAnimationFrame 每帧回调自身，形成连续轮询。
   每帧先 getCurrentGamepad() 拿到当前手柄，若有手柄则逐项刷新：
     ① 遍历按钮 → updateButton() 高亮按键；
     ② 左右摇杆 → updateStick() 移动圆点（轴 0/1 = 左摇杆，2/3 = 右摇杆）；
     ③ 左右扳机 → updateTrigger() 刷新填充（按钮 6 = LT，7 = RT）。
   手柄为空则不刷新。最后再次 requestAnimationFrame(update) 进入下一帧。
   【目的】浏览器不会自动推进手柄状态，必须主动轮询才能持续反映变化。
============================ */

function update(){

    const pad =
        getCurrentGamepad();


    if(pad){

        for(
            let i = 0;
            i < pad.buttons.length;
            i++
        ){

            updateButton(
                i,
                pad
            );

        }


        updateStick(
            pad,
            0,
            1,
            "leftDot",
            "leftValue"
        );


        updateStick(
            pad,
            2,
            3,
            "rightDot",
            "rightValue"
        );


        updateTrigger(
            pad,
            6,
            "lt",
            "ltValue"
        );


        updateTrigger(
            pad,
            7,
            "rt",
            "rtValue"
        );

    }


    requestAnimationFrame(
        update
    );

}


update();

</script>

</body>

</html>
