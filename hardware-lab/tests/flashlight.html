<!DOCTYPE html>
<!--
  ============================================================
  🔦 手电筒 / 闪光灯测试页（hardware-lab/tests/flashlight.html）
  ------------------------------------------------------------
  【测试对象】设备后置摄像头的闪光灯 / 手电筒（Torch）。
  【使用的浏览器 API】
    - navigator.mediaDevices.getUserMedia()   请求摄像头视频流（getUserMedia）
    - MediaStream.getVideoTracks()            从视频流中取视频轨
    - MediaStreamTrack.getCapabilities()      读取轨道能力（含 torch 字段）
    - MediaStreamTrack.applyConstraints()     通过 torch 开关手电筒
    - window "pagehide" 事件                  页面离开时做资源清理
  【测试流程】
    ① 页面加载 → 自动调用 checkTorch() 检测能力（见下方 JS）。
    ② getUserMedia 取后置(environment)摄像头 → 读视频轨 → 查 torch 支持。
    ③ 在「控制方式 / 闪光灯 / 设备支持 / 当前状态」区块展示检测结果。
    ④ torch 支持则解锁「打开手电筒」按钮，点击走 toggleTorch() 切换。
    ⑤ 页面离开（pagehide）时关闭手电筒并释放摄像头。
  【PASS/FAIL 判定】
    track.getCapabilities().torch === true → 显示「支持手电筒控制」并开放开关（PASS）；
    否则 → 显示「浏览器未提供控制接口」并禁用开关（FAIL）。
  ============================================================
-->
<html lang="zh-CN">

<head>
<script src="/device-check.js?v=2"></script>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>🔦 手电筒测试</title>

<link rel="stylesheet" href="../hardware.css">

<style>
/* ==== 浅色模式基础样式（页面默认外观） ==== */
/* 说明：手电筒图标发光效果靠 .flashlight-icon.on 的 drop-shadow 实现 */
/* 说明：按钮按下的缩放反馈由 button:active 的 transform 提供 */

body{
    margin:0;
    padding:30px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:430px;
    margin:auto;
}

h1{
    margin:20px 0 10px;
}

.subtitle{
    color:#777;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:24px;
    padding:25px 20px;
    margin:18px 0;
    box-shadow:0 5px 20px #0002;
}

.flashlight-icon{
    font-size:80px;
    margin:10px 0 20px;
    transition:.2s;
}

.flashlight-icon.on{
    filter:drop-shadow(0 0 25px #ffd84d);
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:0;
    border-radius:18px;
    font-size:18px;
    cursor:pointer;
}

#toggle{
    background:#6543a5;
    color:white;
}

#toggle.off{
    background:#ddd;
    color:#333;
}

button:active{
    transform:scale(.97);
}

.status{
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
}

.info{
    text-align:left;
    line-height:1.8;
    color:#555;
}

.warning{
    color:#d97706;
}

.success{
    color:#16803c;
}

.error{
    color:#c62828;
}



</style>











<style id="flashlight-dark-mode">
/* ==== 本页深色模式样式（由 applyMainTheme() 切换 body.dark-mode 时生效） ==== */
/* 说明：深色模式下调整背景/卡片/文字/返回按钮/关闭态按钮的配色 */

body.dark-mode{
    background:#17151c;
    color:#eee;
}

body.dark-mode .subtitle{

}

body.dark-mode .card{
    background:#24212b;
    box-shadow:0 5px 20px #0006;
}

body.dark-mode .info{
    color:#ccc;
}

body.dark-mode .hardware-back{
    background:#2a2633;
    color:#d8c7ff;
    box-shadow:0 4px 15px #0006;
}

body.dark-mode #toggle.off{
    background:#3a3642;
    color:#eee;
}

body.dark-mode #message{
    color:#ddd;
}

</style>





<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}

body.dark-mode .desc,
body.dark-mode .note,

body.dark-mode h1,body.dark-mode h2,body.dark-mode h3{

}

</style>
</head>

<body>

<!-- 页面主容器：手电筒测试卡片 -->
<div class="container">

<h1>🔦 手电筒测试</h1>

<div class="subtitle">
测试设备摄像头闪光灯 / 手电筒控制能力
</div>


<!-- 操作区卡片：图标 + 检测状态 + 开关按钮 -->
<div class="card">

<div id="icon"
class="flashlight-icon">
🔦
</div>

<div id="status"
class="status">
正在检测……
</div>

<button id="toggle">
检测中…
</button>

</div>


<div class="card">

<!-- 检测结果信息区：控制方式 / 闪光灯 / 设备支持 / 当前状态 -->
<div class="info">

<div>
<strong>控制方式：</strong>
<span id="mode">检测中</span>
</div>

<div>
<strong>闪光灯：</strong>
<span id="flash">检测中</span>
</div>

<div>
<strong>设备支持：</strong>
<span id="support">检测中</span>
</div>

<div>
<strong>当前状态：</strong>
<span id="state">关闭</span>
</div>

</div>

</div>


<!-- 提示信息卡片：显示检测结果 / 权限提示等说明文案 -->
<div id="message"
class="card">
请等待检测完成。
</div>


<!-- 返回硬件大厅按钮 -->
<button
class="hardware-back hardware-back"
onclick="location.href='../index.html'">
← 返回硬件大厅
</button>

</div>


<script>

/* ============================================================
 * 全局状态变量
 *   stream：当前拿到的人摄像头 MediaStream（用于页面离开时释放）
 *   track ：当前使用的视频轨 MediaStreamTrack（用于控制 torch）
 *   torchSupported：浏览器/设备是否暴露 torch 手电筒能力（PAYS/FAIL 依据）
 *   torchOn：手电筒当前是否点亮
 * ============================================================ */

let stream=null;

let track=null;

let torchSupported=false;

let torchOn=false;


/*
 * 获取后置摄像头。
 *
 * 【流程】
 *   - navigator.mediaDevices.getUserMedia() 申请摄像头视频流；
 *     facingMode 优先取 "environment"（后置镜头，手电筒通常挂在后置）。
 *   - audio 设为 false：只要视频，不额外占用麦克风。
 *   - 从流中 getVideoTracks() 取第一条视频轨存进全局 track。
 *   - 没有视频轨 → 抛错「没有找到摄像头」。
 *   - 成功返回该视频轨；失败 console.error 并返回 null（由调用方判定）。
 */

async function getCamera(){

    try{

        stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },

                audio:false

            });


        const tracks=
            stream.getVideoTracks();


        if(!tracks.length){

            throw new Error(
                "没有找到摄像头"
            );

        }


        track=tracks[0];


        return track;

    }catch(error){

        console.error(error);

        return null;

    }

}


/*
 * 检测手电筒能力。
 *
 * 【用途】页面加载后自动执行，判断当前设备/浏览器能否控制手电筒，
 *         并把结果写入界面（控制方式 / 闪光灯 / 设备支持 / 当前状态）。
 * 【流程】
 *   ① 浏览器不支持 getUserMedia → 提示「当前浏览器不支持摄像头 API」，禁用按钮，直接返回。
 *   ② 调 getCamera() 拿摄像头轨；拿不到（无摄像头/权限被拒）→ 提示无法访问并禁用。
 *   ③ 读 track.getCapabilities().torch，得到 torchSupported。
 *   ④ torchSupported === true → 状态「手电筒可测试」，解锁开关（PASS）。
 *      否则 → 状态「无法通过浏览器控制」，禁用开关（FAIL）。
 *   ⑤ 依据检测结果写 message 说明文案。
 * 【注意】torch 为 false 只代表浏览器未暴露控制接口，不代表手机物理上没有手电筒。
 */

async function checkTorch(){

    const button=
        document.getElementById("toggle");

    const status=
        document.getElementById("status");

    const message=
        document.getElementById("message");


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        status.textContent=
            "当前浏览器不支持摄像头 API";

        status.className=
            "status error";

        button.textContent=
            "不可用";

        button.disabled=true;

        return;

    }


    const currentTrack=
        await getCamera();


    if(!currentTrack){

        status.textContent=
            "无法访问摄像头";

        status.className=
            "status warning";

        document.getElementById(
            "flash"
        ).textContent=
            "无法检测";


        document.getElementById(
            "support"
        ).textContent=
            "无法确认";


        button.textContent=
            "无法测试";

        button.disabled=true;


        message.innerHTML=
            "请允许浏览器使用摄像头权限。<br>" +
            "手电筒控制通常依赖后置摄像头的闪光灯。";


        return;

    }


    const capabilities=
        currentTrack.getCapabilities
        ? currentTrack.getCapabilities()
        : {};


    torchSupported=
        capabilities.torch === true;


    document.getElementById(
        "mode"
    ).textContent=
        "Camera Track";


    document.getElementById(
        "flash"
    ).textContent=
        torchSupported
        ? "支持"
        : "未检测到";


    document.getElementById(
        "support"
    ).textContent=
        torchSupported
        ? "支持手电筒控制"
        : "浏览器未提供控制接口";


    if(torchSupported){

        status.textContent=
            "手电筒可测试";

        status.className=
            "status success";


        button.textContent=
            "🔦 打开手电筒";


        message.innerHTML=
            "检测到浏览器提供的 Torch 控制接口。<br>" +
            "点击按钮测试实际闪光灯。";

    }else{

        status.textContent=
            "无法通过浏览器控制";

        status.className=
            "status warning";


        button.textContent=
            "不支持";


        button.disabled=true;


        message.innerHTML=
            "当前设备或浏览器没有提供 " +
            "<strong>torch</strong> 控制能力。<br><br>" +
            "这不一定代表手机没有手电筒，" +
            "可能只是浏览器禁止网页控制闪光灯。";

    }

}


/*
 * 开关手电筒。
 *
 * 【流程】
 *   ① track 不存在或 torch 不支持 → 直接返回，不做任何操作。
 *   ② 反转 torchOn 状态（true↔false）。
 *   ③ 用 track.applyConstraints({advanced:[{torch:torchOn}]}) 真正点亮/熄灭闪光灯。
 *   ④ 更新「当前状态」文字、状态条、图标发光效果与按钮文案/样式。
 *   ⑤ 失败（浏览器/设备限制，如权限或硬件不支持）→ 重置 torchOn=false，
 *      提示「手电筒控制失败」并禁用操作。
 * 【结果判定】torchOn=true → 「手电筒已开启」；torchOn=false → 「手电筒已关闭」。
 */

async function toggleTorch(){

    if(!track || !torchSupported){
        return;
    }


    const button=
        document.getElementById("toggle");


    const status=
        document.getElementById("status");


    const icon=
        document.getElementById("icon");


    try{

        torchOn=!torchOn;


        await track.applyConstraints({

            advanced:[
                {
                    torch:torchOn
                }
            ]

        });


        document.getElementById(
            "state"
        ).textContent=
            torchOn
            ? "开启"
            : "关闭";


        if(torchOn){

            icon.classList.add("on");

            status.textContent=
                "手电筒已开启";

            status.className=
                "status success";

            button.textContent=
                "🔆 关闭手电筒";

            button.classList.remove(
                "off"
            );

        }else{

            icon.classList.remove("on");

            status.textContent=
                "手电筒已关闭";

            status.className=
                "status";

            button.textContent=
                "🔦 打开手电筒";

            button.classList.add(
                "off"
            );

        }

    }catch(error){

        console.error(error);

        torchOn=false;


        status.textContent=
            "手电筒控制失败";

        status.className=
            "status error";


        document.getElementById(
            "message"
        ).innerHTML=
            "浏览器拒绝了手电筒控制请求。<br>" +
            "这通常是浏览器或设备权限限制。";


        button.textContent=
            "控制失败";

    }

}


/*
 * 页面离开时关闭摄像头。
 *
 * 【用途】页面切走/关闭（pagehide）时释放资源，防止手电筒一直亮、
 *         摄像头被占用不释放。
 * 【流程】
 *   ① 若存在视频轨，先用 applyConstraints([{torch:false}]) 强制熄灭闪光灯。
 *   ② 再 stream.getTracks() 逐条 stop()，释放摄像头授权占用。
 */

window.addEventListener(
    "pagehide",
    ()=>{

        if(track){

            try{

                track.applyConstraints({

                    advanced:[
                        {
                            torch:false
                        }
                    ]

                });

            }catch{}

        }


        if(stream){

            stream.getTracks()
                .forEach(
                    t=>t.stop()
                );

        }

    }
);


/* 绑定「开关手电筒」按钮的点击事件 → toggleTorch() */
document.getElementById(
    "toggle"
).addEventListener(
    "click",
    toggleTorch
);


/* 页面加载后自动执行一次手电筒能力检测 */
checkTorch();

</script>


<script>

/* ============================================================
 * 深色模式处理（联动主站 localStorage 主题）
 * 读取 localStorage 的 darkMode / theme 标记，
 * 给 <body> 加/移除 "dark-mode" 类，控制整体配色。
 * ============================================================ */

function applyMainTheme(){

    const dark =
        localStorage.getItem("darkMode") === "1" ||
        localStorage.getItem("theme") === "dark";

    document.body.classList.toggle(
        "dark-mode",
        dark
    );

}

/* 页面加载即应用深色主题 */
applyMainTheme();

</script>

</body>

</html>
