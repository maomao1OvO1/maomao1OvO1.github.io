<!DOCTYPE html>
<html lang="zh-CN">

<!-- ============================================================
  【文件】camera.html —— 摄像头测试
  【硬件】设备的摄像头（前置 / 后置摄像头及其拍摄能力）
  【用途】验证相机能否打开、前后摄像头能否切换、能否正常关闭
  【浏览器 API】
    - navigator.mediaDevices.getUserMedia({video:{facingMode}})
        → 请求摄像头视频轨道（此处为核心 API）
    - MediaStream.getTracks() / MediaStreamTrack.stop()
        → 遍历并停止所有媒体轨道，释放相机
    - localStorage.getItem("theme")
        → 读取主站主题，跟随深色模式
  【测试流程】
    1. 点击「打开摄像头」openCamera() 请求摄像头权限并显示实时画面
       成功 = 看到实时画面；失败 = 弹窗 alert 提示无法打开
    2. 点击「切换摄像头」switchCamera() 在 user(前) / environment(后) 切换
    3. 点击「关闭摄像头」closeCamera() 停止全部轨道并隐藏画面
  【判定方式】无 PASS/FAIL 文字，以「能否看到实时视频画面」为本测试的通过标准。
============================================================ -->

<head>
<script src="/device-check.js?v=12"></script>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>摄像头测试</title>


<style>

/* 页面基础样式：内容水平居中 */
body{
    text-align:center;
    font-family:Arial;
}

/* 摄像头实时画面：默认隐藏(display:none)，打开后改为 block 显示 */
video{
    width:90%;
    max-width:500px;
    margin-top:20px;
    border-radius:15px;
    display:none;
}

/* 控制按钮（浅色主题）：圆角 + 底部阴影，白底紫字 */
button{
    padding:12px 20px;
    margin:8px;
    font-size:16px;
    border:none;
    border-radius:15px;
    background:white;
    color:#6543a4;
    box-shadow:0 4px 12px #0002;
    cursor:pointer;
}

/* 按下反馈：轻微的缩放效果 */
button:active{
    transform:scale(.97);
}

/* 深色模式：页面底色变深、文字变亮 */
body.dark-mode{
    background:#121212;
    color:#eee;
}

/* 深色模式：普通按钮改深色底、白字 */
body.dark-mode button:not(.hardware-back){
    background:#333;
    color:#fff;
    box-shadow:0 4px 12px #0006;
}

</style>


<link rel="stylesheet" href="../hardware.css">


<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}
body.dark-mode .card,
body.dark-mode .desc,
body.dark-mode .note,
body.dark-mode .item,
body.dark-mode .test-list button,
body.dark-mode button,
body.dark-mode input,
body.dark-mode select{
    background:#1e1e1e !important;
    color:#eeeeee !important;
    border-color:#333333 !important;
}
body.dark-mode .label,
body.dark-mode h1,body.dark-mode h2,body.dark-mode h3{
    color:#bb9cff !important;
}
body.dark-mode p,body.dark-mode li,body.dark-mode .desc p{
    color:#aaaaaa !important;
}
body.dark-mode .hardware-back{
    background:#222222 !important;
    color:#bb9cff !important;
}
</style>
</head>


<body>

<h1>📷 摄像头测试</h1>

<!-- 控制按钮组：打开 / 切换 / 关闭 摄像头（切换仅在已打开时有效） -->
<button onclick="openCamera()">
打开摄像头
</button>

<button onclick="switchCamera()">
切换摄像头
</button>

<button onclick="closeCamera()">
关闭摄像头
</button>


<br>

<!-- 摄像头实时画面容器：autoplay 自动播放；playsinline 让移动端内嵌播放（不进全屏） -->
<video
    id="camera"
    autoplay
    playsinline>
</video>


<script>

let stream = null;      // 当前摄像头媒体流对象（保存后用于切换/关闭）
let facingMode = "user"; // 期望的摄像头方向：user=前置(自拍)，environment=后置


// ============================
// 打开摄像头
// ============================

// 测试：请求用户允许访问摄像头，并把实时画面绑定到 <video>
// 结果判定：成功 → 画面显示出来；失败（拒绝权限/无摄像头）→ alert 弹出原因
async function openCamera(){

    closeCamera();  // 先关闭上一次的流，避免重复占用

    try{

        stream =
            await navigator.mediaDevices.getUserMedia({  // 核心API：按 facingMode 请求前置或后置摄像头

                video:{
                    facingMode:facingMode
                }

            });


        const video =
            document.getElementById("camera");


        video.srcObject =     // 把媒体流接到 <video> 上显示实时画面
            stream;


        video.style.display =
            "block";          // 显示视频元素


    }catch(error){

        alert(               // 失败提示（如用户拒绝权限、无摄像头硬件）
            "无法打开摄像头：" +
            error
        );

    }

}


// ============================
// 切换摄像头
// ============================

// 测试：在前置(user)与后置(environment)之间切换
// 结果判定：无数值，主要通过「画面是否切换」观察；未打开时提醒先打开
async function switchCamera(){

    if(!stream){

        alert("请先打开摄像头");

        return;

    }


    if(facingMode === "user"){

        facingMode =
            "environment";   // 当前是前置 → 切到后置

    }else{

        facingMode =
            "user";          // 当前是后置 → 切回前置

    }


    await openCamera();      // 用新的 facingMode 重新申请摄像头

}


// ============================
// 关闭摄像头
// ============================

// 测试：释放摄像头资源
// 结果判定：遍历停止所有媒体轨道、清空视频源并隐藏画面
function closeCamera(){

    if(stream){

        stream
            .getTracks()                          // 取出所有轨道（视频/音频）
            .forEach(track => {

                track.stop();                     // 终止轨道，真正关闭硬件

            });


        stream = null;

    }


    const video =
        document.getElementById("camera");


    video.srcObject =
        null;                                     // 与视频源解绑


    video.style.display =
        "none";                                   // 隐藏视频元素

}


// ============================
// 跟随主站深色模式
// ============================

// 功能：读取主站保存的主题，切换本页深色模式
function applyMainTheme(){

    const dark =
        localStorage.getItem("theme")   // 主站以 theme==="dark" 表示深色
        === "dark";


    document.body.classList.toggle(     // 根据 dark 值增删 dark-mode 类
        "dark-mode",
        dark
    );

}


applyMainTheme();  // 页面加载即应用主题

</script>


<button
    class="hardware-back"
    onclick="location.href='../index.html'">

    ← 返回硬件大厅

</button>


</body>

</html>
