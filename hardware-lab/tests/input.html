<!DOCTYPE html>
<!--
    ============================================================
    硬件实验室 · 输入设备测试页面  (input.html)
    ============================================================
    一、本页测试的硬件：
        1. 键盘  —— 监听 keydown / keyup，统计按下/释放次数，并显示最近按下的键名。
        2. 鼠标  —— 监听 pointermove / pointerdown / pointerup / wheel，
                    显示当前坐标(X, Y)，并记录按下/释放/滚轮事件。
        3. 触摸屏 —— 监听 touchstart / touchmove / touchend，
                    统计「触摸开始次数」「最大同时触摸点数」，并显示当前触摸点数。
        4. 手柄  —— 监听 gamepadconnected / gamepaddisconnected，
                    配合 requestAnimationFrame 轮询 navigator.getGamepads()，
                    读取按钮(buttons)与摇杆(axes)的状态变化。

    二、用到的浏览器 API：
        . localStorage          —— 读取深色模式主题(localStorage.getItem("theme"))
        . addEventListener      —— 在 window 上绑定各种输入事件
        . Pointer Events        —— pointermove/pointerdown/pointerup（鼠标/触摸/笔统一事件）
        . Touch Events          —— touchstart/touchmove/touchend（触摸屏）
        . Keyboard Events       —— keydown/keyup（键盘）
        . Wheel Event           —— wheel（鼠标滚轮）
        . Gamepad API           —— gamepadconnected/gamepaddisconnected/navigator.getGamepads()
        . DOM 操作              —— getElementById/createElement/prepend/textContent/innerHTML
        . requestAnimationFrame —— 手柄每帧轮询
        . Date.toLocaleTimeString—— 生成日志时间戳

    三、测试流程：
        1. 页面加载后先读取 localStorage，恢复深色/浅色主题。
        2. 分别对 键盘/鼠标/触摸/手柄 绑定对应的事件监听。
        3. 触发任意输入事件时，更新对应卡片里的状态文字、数值/坐标，
           并调用 addLog() 把事件追加到「事件记录」区（最多保留 50 条）。
        4. 手柄部分用 updateGamepadInfo() 读取当前手柄并轮询按钮/摇杆变化。
        5. 点击底部「清除统计与记录」按钮调用 resetAll()，重置所有统计与日志。
    ============================================================
-->

<script>

// ============================================================
// 脚本入口
// 分区顺序：深色模式 → 数据 → 事件记录 → 键盘 → 鼠标 → 触摸 → 手柄 → 清除
// ============================================================

// ============================
// 深色模式
// ============================

// 读取 localStorage 中保存的主题，若为 "dark" 则给 body 添加 dark-mode 类
if(
    localStorage.getItem("theme")
    === "dark"
){

    document.body.classList.add(
        "dark-mode"
    );

}


// ============================
// 数据
// 各输入设备的统计变量，初始化为 0 / 空数组 / null
// ============================

let keyDownCount=0;
let keyUpCount=0;

let touchStartCount=0;
let maxTouch=0;

let activeGamepad=null;

let previousButtons=[];

let previousAxes=[];


// ============================
// 事件记录
// addLog(): 把一条输入事件追加到「事件记录」列表
//   参数 type      : 事件类型标题（如 "⌨️ 键盘按下"）
//   参数 text      : 事件的具体内容
//   参数 className : 决定日志左侧色条（区分键盘/鼠标/触摸/手柄）
// ============================

function addLog(
    type,
    text,
    className
){

    // 找到事件记录容器
    const log =
        document.getElementById(
            "eventLog"
        );


    // 新建一条日志的 DOM 节点
    const item =
        document.createElement(
            "div"
        );


    // 附加通用类名 .log 与设备专用类名（决定左侧色条颜色）
    item.className =
        "log " +
        className;


    // 取当前时间作为日志时间戳
    const now =
        new Date();


    const time =
        now.toLocaleTimeString();


    // 用 HTML 字符串填充日志内容：时间 + 类型 + 内容
    item.innerHTML =
        '<div class="log-time">' +
        time +
        '</div>' +
        '<b>' +
        type +
        '</b>　' +
        text;


    // 新日志插入到列表最前面（最新的在最上方）
    log.prepend(
        item
    );


    // 限制日志最多保留 50 条，超出则删除最旧的一条
    while(
        log.children.length > 50
    ){

        log.removeChild(
            log.lastChild
        );

    }

}


// ============================
// 键盘
// 监听 window 上的 keydown / keyup
// ============================

// 按下任意键：按下计数 +1，显示键名，更新状态，追加日志
window.addEventListener(
    "keydown",
    function(event){

        // 按下次数 +1
        keyDownCount++;


        // 更新「按下次数」显示
        document.getElementById(
            "keyDownCount"
        ).textContent =
            keyDownCount;


        // 显示最近按下的键名
        document.getElementById(
            "keyValue"
        ).textContent =
            event.key;


        // 更新键盘状态为「已检测到输入」
        document.getElementById(
            "keyboardStatus"
        ).textContent =
            "🟢 检测到键盘输入";


        // 追加「键盘按下」日志（记录键名）
        addLog(
            "⌨️ 键盘按下",
            event.key,
            "log-keyboard"
        );

    }
);


// 释放任意键：释放计数 +1，更新显示，追加日志
window.addEventListener(
    "keyup",
    function(event){

        // 释放次数 +1
        keyUpCount++;


        // 更新「释放次数」显示
        document.getElementById(
            "keyUpCount"
        ).textContent =
            keyUpCount;


        // 追加「键盘释放」日志（记录键名）
        addLog(
            "⌨️ 键盘释放",
            event.key,
            "log-keyboard"
        );

    }
);


// ============================
// 鼠标
// 监听 pointermove / pointerdown / pointerup / wheel
// 只处理 pointerType 为 "mouse" 的事件，排除触摸/笔等其他指针
// ============================

// 鼠标移动：更新坐标并标记「检测到鼠标」
window.addEventListener(
    "pointermove",
    function(event){

        // 仅处理鼠标事件，其他指针类型直接忽略
        if(
            event.pointerType !==
            "mouse"
        ){

            return;

        }


        // 显示鼠标当前坐标(X, Y)，四舍五入取整
        document.getElementById(
            "mouseValue"
        ).textContent =
            Math.round(
                event.clientX
            ) +
            " , " +
            Math.round(
                event.clientY
            );


        // 更新鼠标状态为「已检测到」
        document.getElementById(
            "mouseStatus"
        ).textContent =
            "🟢 检测到鼠标";

    }
);


// 鼠标按下：更新状态并追加日志
window.addEventListener(
    "pointerdown",
    function(event){

        // 仅处理鼠标事件
        if(
            event.pointerType !==
            "mouse"
        ){

            return;

        }


        // 更新鼠标状态为「已按下」
        document.getElementById(
            "mouseStatus"
        ).textContent =
            "🟢 鼠标按下";


        // 追加「鼠标按下」日志（显示按钮编号）
        addLog(
            "🖱️ 鼠标按下",
            "按钮 " +
            event.button,
            "log-mouse"
        );

    }
);


// 鼠标释放：追加日志（仅鼠标事件）
window.addEventListener(
    "pointerup",
    function(event){

        // 仅处理鼠标事件
        if(
            event.pointerType !==
            "mouse"
        ){

            return;

        }


        // 追加「鼠标释放」日志（显示按钮编号）
        addLog(
            "🖱️ 鼠标释放",
            "按钮 " +
            event.button,
            "log-mouse"
        );

    }
);


// 鼠标滚轮：根据滚动方向追加日志
window.addEventListener(
    "wheel",
    function(event){

        // 根据 deltaY 正负判断滚动方向（向下/向上）
        addLog(
            "🖱️ 鼠标滚轮",
            event.deltaY > 0
            ? "向下"
            : "向上",
            "log-mouse"
        );

    }
);


// ============================
// 触摸
// 监听 touchstart / touchmove / touchend
// 各监听均使用 passive:true，避免影响页面滚动性能
// ============================

// 触摸开始：统计开始次数与当前点数，并记录最大同时点数
window.addEventListener(
    "touchstart",
    function(event){

        // 当前同时触摸的点数
        const count =
            event.touches.length;


        // 触摸开始计数 +1
        touchStartCount++;


        // 更新「触摸开始」次数显示
        document.getElementById(
            "touchStartCount"
        ).textContent =
            touchStartCount;


        // 显示当前触摸点数
        document.getElementById(
            "touchValue"
        ).textContent =
            count;


        // 若本次点数超过历史最大值，则更新最大值并显示
        if(
            count > maxTouch
        ){

            maxTouch =
                count;


            document.getElementById(
                "maxTouch"
            ).textContent =
                maxTouch;

        }


        // 更新触摸状态为「已检测到」
        document.getElementById(
            "touchStatus"
        ).textContent =
            "🟢 检测到触摸";


        // 追加「触摸开始」日志（记录点数）
        addLog(
            "👆 触摸开始",
            count +
            " 个触摸点",
            "log-touch"
        );

    },
    {
        passive:true
    }
);


// 触摸移动：只更新当前点数，不写日志（避免高频刷屏）
window.addEventListener(
    "touchmove",
    function(event){

        // 当前同时触摸的点数
        const count =
            event.touches.length;


        // 实时更新当前触摸点数显示
        document.getElementById(
            "touchValue"
        ).textContent =
            count;


        /*
         * 移动事件可能非常频繁，
         * 所以不把每一帧都塞进日志。
         */

    },
    {
        passive:true
    }
);


// 触摸结束：显示剩余点数并追加日志
window.addEventListener(
    "touchend",
    function(event){

        // 剩余触摸点数
        const count =
            event.touches.length;


        // 更新剩余触摸点数显示
        document.getElementById(
            "touchValue"
        ).textContent =
            count;


        // 追加「触摸结束」日志（记录剩余点数）
        addLog(
            "👆 触摸结束",
            "剩余 " +
            count +
            " 个触摸点",
            "log-touch"
        );

    },
    {
        passive:true
    }
);


// ============================
// 手柄连接
// 监听「手柄接入」与「手柄拔出」事件
// ============================

// 手柄接入：保存手柄对象并更新界面与日志
window.addEventListener(
    "gamepadconnected",
    function(event){

        // 保存当前使用的手柄对象
        activeGamepad =
            event.gamepad;


        // 清空上一次的按钮/摇杆快照，重新开始对比
        previousButtons =
            [];


        previousAxes =
            [];


        // 更新手柄状态为「已连接」
        document.getElementById(
            "gamepadStatus"
        ).textContent =
            "🟢 手柄已连接";


        // 追加「手柄连接」日志（显示手柄 id）
        addLog(
            "🎮 手柄连接",
            event.gamepad.id,
            "log-gamepad"
        );


        // 立即刷新一次手柄信息
        updateGamepadInfo();

    }
);


// 手柄拔出：清空对应手柄引用并重置显示
window.addEventListener(
    "gamepaddisconnected",
    function(event){

        // 仅当拔出的是当前正在使用的手柄时才清空引用
        if(
            activeGamepad &&
            activeGamepad.index ===
            event.gamepad.index
        ){

            activeGamepad =
                null;

        }


        // 更新手柄状态为「未检测到」
        document.getElementById(
            "gamepadStatus"
        ).textContent =
            "未检测到手柄";


        // 重置手柄信息显示
        document.getElementById(
            "gamepadValue"
        ).textContent =
            "--";


        // 重置按钮数量显示
        document.getElementById(
            "buttonCount"
        ).textContent =
            "--";


        // 重置摇杆数量显示
        document.getElementById(
            "axisCount"
        ).textContent =
            "--";


        // 追加「手柄断开」日志（显示手柄 id）
        addLog(
            "🎮 手柄断开",
            event.gamepad.id,
            "log-gamepad"
        );

    }
);


// ============================
// 手柄轮询
// updateGamepadInfo(): 读取当前手柄信息，并对比按钮/摇杆的状态变化
// ============================

function updateGamepadInfo(){

    // 获取当前所有已连接手柄（API 不存在时用空数组兜底）
    const pads =
        navigator.getGamepads
        ? navigator.getGamepads()
        : [];


    let pad=null;


    // 优先取上一次记录的手柄（通过 index 定位）
    if(activeGamepad){

        pad =
            pads[
                activeGamepad.index
            ];

    }


    // 若取不到，则遍历所有手柄，找一个可用的作为当前手柄
    if(!pad){

        for(
            const p of pads
        ){

            if(p){

                pad=p;

                activeGamepad=p;

                break;

            }

        }

    }


    // 仍然没有任何手柄则直接返回
    if(!pad){

        return;

    }


    // 更新手柄状态与基本信息
    document.getElementById(
        "gamepadStatus"
    ).textContent =
        "🟢 手柄已连接";


    // 显示手柄 id
    document.getElementById(
        "gamepadValue"
    ).textContent =
        pad.id;


    // 显示按钮数量
    document.getElementById(
        "buttonCount"
    ).textContent =
        pad.buttons.length;


    // 显示摇杆数量（每个摇杆占用 2 根轴，故除以 2 向下取整）
    document.getElementById(
        "axisCount"
    ).textContent =
        Math.floor(
            pad.axes.length / 2
        );


    // ========================
    // 手柄按钮变化
    // 逐一对比每个按钮「上次按压状态」，只有状态发生变化时才记录
    // ========================

    for(
        let i=0;
        i<pad.buttons.length;
        i++
    ){

        // 当前按钮是否被按下
        const pressed =
            pad.buttons[i].pressed;


        // 上次该按钮的按压状态（无记录则视为未按下）
        const old =
            previousButtons[i] ||
            false;


        // 若本次与上次状态不同，则追加日志
        if(
            pressed !== old
        ){

            // 追加「手柄按钮」日志（按下/释放）
            addLog(
                "🎮 手柄按钮",
                "按钮 " +
                (i+1) +
                (pressed
                    ? " 按下"
                    : " 释放"),
                "log-gamepad"
            );

        }


        // 保存本次按压状态，供下一帧对比
        previousButtons[i]=pressed;

    }


    // ========================
    // 摇杆变化
    // 逐一对比每根轴「上次数值」，变化超过 0.15 才记日志
    // ========================

    for(
        let i=0;
        i<pad.axes.length;
        i++
    ){

        // 当前轴的值（范围约 -1 ~ 1）
        const value =
            pad.axes[i];


        // 上次该轴的数值（无记录则视为 0）
        const old =
            previousAxes[i] ||
            0;


        /*
         * 只有变化超过 0.15
         * 才记录，避免摇杆微小抖动
         * 刷爆日志。
         */

        // 若变化超过 0.15 则追加日志
        if(
            Math.abs(
                value-old
            ) > 0.15
        ){

            // 追加「手柄摇杆」日志（记录轴编号与数值）
            addLog(
                "🎮 手柄摇杆",
                "轴 " +
                i +
                " = " +
                value.toFixed(2),
                "log-gamepad"
            );

        }


        // 保存本次轴数值，供下一帧对比
        previousAxes[i]=value;

    }

}


// 手柄轮询主循环：每帧调用 updateGamepadInfo() 检查一次，
// 随后通过 requestAnimationFrame 安排下一帧，实现持续轮询。
function gamepadLoop(){

    updateGamepadInfo();

    requestAnimationFrame(
        gamepadLoop
    );

}


// 启动手柄轮询
gamepadLoop();


// ============================
// 清除
// resetAll(): 重置所有统计数值与界面显示，并清空事件记录
// ============================

function resetAll(){

    // 重置所有统计变量为初始值
    keyDownCount=0;
    keyUpCount=0;

    touchStartCount=0;
    maxTouch=0;

    previousButtons=[];
    previousAxes=[];


    // 重置键盘相关显示
    document.getElementById(
        "keyDownCount"
    ).textContent="0";


    document.getElementById(
        "keyUpCount"
    ).textContent="0";


    document.getElementById(
        "keyValue"
    ).textContent="--";


    document.getElementById(
        "keyboardStatus"
    ).textContent=
        "等待键盘输入";


    // 重置触摸相关显示
    document.getElementById(
        "touchStartCount"
    ).textContent="0";


    document.getElementById(
        "maxTouch"
    ).textContent="0";


    document.getElementById(
        "touchValue"
    ).textContent="0";


    document.getElementById(
        "touchStatus"
    ).textContent=
        "等待触摸";


    // 重置鼠标相关显示
    document.getElementById(
        "mouseValue"
    ).textContent="--";


    document.getElementById(
        "mouseStatus"
    ).textContent=
        "等待鼠标输入";


    // 清空事件记录区
    document.getElementById(
        "eventLog"
    ).innerHTML="";

}

</script>
