<!DOCTYPE html>
<!--
文件：hardware-lab/tests/audio.html
用途：实时麦克风音频分析测试页。打开页面后点击「开始音频分析」即可申请麦克风
      权限，并实时展示音量(dB)、实时波形、频谱柱状图、低/中/高频段能量，
      以及当前峰值/平均音量统计，用于验证设备麦克风与浏览器 Web Audio API。
核心逻辑：
  1) audioContext + analyser 负责采集麦克风数据（时域/频域）；
  2) 用 requestAnimationFrame 驱动的 draw() 主循环，每帧渲染波形与频谱，
     并计算 RMS(均方根) 换算成 dB 音量；
  3) 频段能量按频率阈值(250Hz / 4000Hz)划分低中高三个区间做平均；
  4) 页面同时引用 ../hardware.css，并提供深色模式(黑调覆盖层)。
引用的资源：浏览器原生 Web Audio API；样式表 ../hardware.css；
            按钮 onclick 调用的 startAudio / stopAudio；返回 ../index.html。
-->
<html lang="zh-CN">

<head>
<script src="/device-check.js?v=12"></script>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🔊 音频分析</title>

<style>

/* 全局盒模型：统一 border-box，避免 padding 撑大元素宽度 */
*{
    box-sizing:border-box;
}

/* 页面主体：居中排版 + 浅色底灰字 */
body{
    margin:0;
    padding:25px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* 一级标题 */
h1{
    margin:20px 0 10px;
}

/* 描述段落：灰色辅助文字 */
.desc{
    color:#777;
    margin-bottom:25px;
}

/* 卡片容器：承装每个测试分区，白底圆角 + 投影 */
.card{
    max-width:500px;
    margin:15px auto;
    padding:22px;
    background:white;
    border-radius:22px;
    box-shadow:0 5px 20px #0002;
}

/* 大号数值(常用于显示 dB) */
.value{
    font-size:28px;
    font-weight:bold;
    margin:10px;
}

/* 字段小标签 */
.label{
    color:#777;
    font-size:14px;
    margin-bottom:8px;
}

button{
    width:90%;
    max-width:350px;
    padding:14px 20px;
    margin:9px;
    border:none;
    border-radius:15px;
    background:white;
    color:#6543a4;
    box-shadow:0 4px 12px #0002;
    font-size:17px;
}

/* 按钮按下时轻微缩放，模拟按压反馈 */
button:active{
    transform:scale(.97);
}

/* 波形 / 频谱画布：固定高度 + 深色底 */
canvas{
    width:100%;
    height:160px;
    border-radius:15px;
    background:#111;
    display:block;
}

/* 音量进度条外槽 */
.bar{
    width:100%;
    height:22px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

/* 音量进度条填充(随音量为 0%~100%) */
.bar-fill{
    width:0%;
    height:100%;
    border-radius:20px;
    background:#6543a4;
    transition:width .05s linear;
}

/* 低/中/高三个频段文字列：横排等宽 */
.freq{
    display:flex;
    justify-content:space-around;
    gap:8px;
}

/* 每个频段的底块 */
.freq div{
    flex:1;
    padding:14px 5px;
    border-radius:15px;
    background:#eee;
}

/* 频段数值(低频/中频/高频的 0~255 能量) */
.freq-value{
    font-size:20px;
    font-weight:bold;
    margin-top:6px;
}

/* 页脚状态提示文字 */
#status{
    color:#777;
    min-height:22px;
}


/* ===== 深色模式 ===== */

body.dark-mode{
    background:#121212;
    color:#eee;
}

body.dark-mode .card{
    background:#1e1e1e;
}

body.dark-mode .label,
body.dark-mode .desc,
body.dark-mode #status{
    color:#aaa;
}

body.dark-mode button{
    background:#333;
    color:#fff;
    box-shadow:0 4px 12px #0006;
}

body.dark-mode .bar{
    background:#444;
}

body.dark-mode .freq div{
    background:#292929;
}

</style>







<link rel="stylesheet" href="../hardware.css">


<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}
body.dark-mode .card,
body.dark-mode .desc,
body.dark-mode .note,
body.dark-mode .item,
body.dark-mode .test-list button,
body.dark-mode button,
body.dark-mode input,
body.dark-mode select{
    background:#1e1e1e !important;
    color:#eeeeee !important;
    border-color:#333333 !important;
}
body.dark-mode .label,
body.dark-mode h1,body.dark-mode h2,body.dark-mode h3{
    color:#bb9cff !important;
}
body.dark-mode p,body.dark-mode li,body.dark-mode .desc p{
    color:#aaaaaa !important;
}
body.dark-mode .hardware-back{
    background:#222222 !important;
    color:#bb9cff !important;
}
</style>
</head>


<body>

<h1>🔊 音频分析</h1>

<p class="desc">
实时分析麦克风声音
</p>


<div class="card">

<h2>🎤 实时音量</h2>

<div class="value"
id="volume">
-- dB
</div>

<!-- 音量进度条：内嵌填充条 #volumeBar 由 JS 按音量百分比设置宽度 -->
<div class="bar">

<div class="bar-fill"
id="volumeBar">
</div>

</div>

<div id="status">
点击下面开始分析
</div>

</div>


<div class="card">

<h2>📈 实时波形</h2>

<canvas
id="waveCanvas"
width="600"
height="200">
</canvas>

</div>


<div class="card">

<h2>🎵 频谱分析</h2>

<canvas
id="spectrumCanvas"
width="600"
height="200">
</canvas>

</div>


<div class="card">

<h2>🎚️ 频段能量</h2>

<div class="freq">

<div>

<div class="label">
低频
</div>

<div class="freq-value"
id="low">
--
</div>

</div>


<div>

<div class="label">
中频
</div>

<div class="freq-value"
id="mid">
--
</div>

</div>


<div>

<div class="label">
高频
</div>

<div class="freq-value"
id="high">
--
</div>

</div>

</div>

</div>


<div class="card">

<h2>📊 音量统计</h2>

<div class="label">
当前峰值
</div>

<div class="value"
id="peak">
-- dB
</div>

<div class="label">
平均音量
</div>

<div class="value"
id="average">
-- dB
</div>

</div>


<button onclick="startAudio()">
🎤 开始音频分析
</button>

<br>

<button onclick="stopAudio()">
⏹️ 停止分析
</button>

<br>

<button onclick="location.href='../index.html'" class="hardware-back">
← 返回硬件大厅
</button>


<script>


// ============================
// 深色模式
// ============================

// 读取 main 站写入的 localStorage「theme」，若为 dark 就给 body 加 dark-mode 类，
// 交由上方 CSS 覆盖层切到深色外观。
if(
    localStorage.getItem("theme")
    === "dark"
){

    document.body.classList.add(
        "dark-mode"
    );

}


// ============================
// 全局变量
// ============================

// 以下均为跨函数共享的运行时状态，一次性声明便于集中管理。
let audioContext = null;   // Web Audio 音频上下文(整条音频链的宿主)

let analyser = null;       // 分析节点：负责把时域数据转换成频域数据

let microphone = null;     // 麦克风音源节点(把 MediaStream 接入音频图)

let stream = null;         // getUserMedia 返回的媒体流(用于释放占用)

let animationId = null;    // requestAnimationFrame 的句柄(用于停止)

let peakValue = -Infinity; // 采样期间的历史最大音量(dB)

let totalVolume = 0;       // 累计音量，用于算平均值

let volumeSamples = 0;     // 采样次数，与 totalVolume 一起求平均


// ============================
// Canvas
// ============================

// 取两个 <canvas> 的 2D 绘图上下文，供波形 / 频谱绘制使用。
const waveCanvas =
    document.getElementById(
        "waveCanvas"
    );

const waveCtx =
    waveCanvas.getContext("2d");


const spectrumCanvas =
    document.getElementById(
        "spectrumCanvas"
    );

const spectrumCtx =
    spectrumCanvas.getContext("2d");


// ============================
// 开始
// ============================

// 申请麦克风权限并搭建「麦克风 → 分析节点」的音频链路。
async function startAudio(){

    // 若上下文已存在：只处理「被系统挂起」的情况(如从后台切回)，
    // 恢复后直接返回，避免重复申请麦克风。
    if(
        audioContext
    ){

        if(
            audioContext.state ===
            "suspended"
        ){

            await audioContext.resume();

        }

        return;

    }


    try{

        // 1) 申请麦克风媒体流(仅音频)
        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true

                });


        // 2) 创建音频上下文(兼容 WebKit 前缀)
        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        // 3) 创建分析节点：负责输出频域数据
        analyser =
            audioContext.createAnalyser();


        // fftSize=2048 表示用 2048 个采样点做 FFT，
        // 频率分辨率 = 采样率 / fftSize，点数越多频域越精细。
        analyser.fftSize =
            2048;


        // 平滑系数：0~1，越大频谱时间上越"拖尾"，画面越稳、跟手越慢。
        analyser.smoothingTimeConstant =
            0.75;


        // 4) 把麦克风流接入分析节点
        microphone =
            audioContext.createMediaStreamSource(
                stream
            );


        microphone.connect(
            analyser
        );


        // 5) 重置统计计数
        peakValue =
            -Infinity;

        totalVolume =
            0;

        volumeSamples =
            0;


        // 6) 更新状态提示并启动主循环
        document.getElementById(
            "status"
        ).textContent =
            "🟢 麦克风已开启，正在分析";


        draw();


    }catch(error){

        // 权限被拒或环境不支持时的兜底提示
        document.getElementById(
            "status"
        ).textContent =
            "❌ 无法获取麦克风权限";

        console.error(error);

    }

}


// ============================
// 停止
// ============================

// 释放麦克风与音频资源：
// 先停掉流轨道，再取消动画帧，最后关闭音频上下文。
function stopAudio(){

    // 停掉所有媒体轨道，真正释放麦克风占用
    if(stream){

        stream.getTracks()
            .forEach(
                track => track.stop()
            );

    }


    // 取消正在运行的 requestAnimationFrame 主循环
    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

    }


    // 清空资源引用
    stream =
        null;

    microphone =
        null;

    analyser =
        null;


    if(audioContext){

        audioContext.close();

    }


    audioContext =
        null;


    document.getElementById(
        "status"
    ).textContent =
        "⏹️ 音频分析已停止";

}


// ============================
// 主循环
// ============================

// 用 requestAnimationFrame 每帧驱动所有刷新逻辑。
function draw(){

    // 停止后 analyser 被清空，提前返回防止空指针
    if(!analyser) return;


    // 先注册下一帧(保持循环)，本帧再绘制
    animationId =
        requestAnimationFrame(
            draw
        );


    drawWave();

    drawSpectrum();

    updateVolume();

}


// ============================
// 波形
// ============================

// 读取时域采样并画成一条折线，直观显示声音的瞬时波形。
function drawWave(){

    // 时域数据是 fftSize 个 0~255 的字节(128 表示静音)
    const data =
        new Uint8Array(
            analyser.fftSize
        );


    analyser.getByteTimeDomainData(
        data
    );


    const width =
        waveCanvas.width;

    const height =
        waveCanvas.height;


    waveCtx.clearRect(
        0,
        0,
        width,
        height
    );


    waveCtx.beginPath();


    // 逐点连线：x 按索引均摊到宽，y 按采样值(0~255)映射到高
    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const x =
            i /
            (data.length - 1) *
            width;


        const y =
            data[i] /
            255 *
            height;


        if(i === 0){

            waveCtx.moveTo(
                x,
                y
            );

        }else{

            waveCtx.lineTo(
                x,
                y
            );

        }

    }


    // 用主色描边完成波形折线
    waveCtx.strokeStyle =
        "#6543a4";

    waveCtx.lineWidth =
        2;

    waveCtx.stroke();

}


// ============================
// 频谱
// ============================

function drawSpectrum(){

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    analyser.getByteFrequencyData(
        data
    );


    const width =
        spectrumCanvas.width;

    const height =
        spectrumCanvas.height;


    spectrumCtx.clearRect(
        0,
        0,
        width,
        height
    );


    const barWidth =
        width /
        data.length;


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const value =
            data[i] / 255;


        const barHeight =
            value * height;


        spectrumCtx.fillStyle =
            "#6543a4";


        spectrumCtx.fillRect(

            i * barWidth,

            height - barHeight,

            Math.max(
                1,
                barWidth
            ),

            barHeight

        );

    }

}


// ============================
// 音量
// ============================

function updateVolume(){

    const data =
        new Uint8Array(
            analyser.fftSize
        );


    analyser.getByteTimeDomainData(
        data
    );


    let sum = 0;


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const value =
            (data[i] - 128) /
            128;


        sum +=
            value * value;

    }


    const rms =
        Math.sqrt(
            sum / data.length
        );


    let db;


    if(rms > 0){

        db =
            20 *
            Math.log10(
                rms
            );

    }else{

        db =
            -100;

    }


    db =
        Math.max(
            -100,
            Math.min(
                0,
                db
            )
        );


    totalVolume += db;

    volumeSamples++;


    if(
        db > peakValue
    ){

        peakValue =
            db;

    }


    document.getElementById(
        "volume"
    ).textContent =
        db.toFixed(1) +
        " dB";


    document.getElementById(
        "peak"
    ).textContent =
        peakValue.toFixed(1) +
        " dB";


    document.getElementById(
        "average"
    ).textContent =
        (
            totalVolume /
            volumeSamples
        ).toFixed(1) +
        " dB";


    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (db + 60) /
                60 *
                100
            )
        );


    document.getElementById(
        "volumeBar"
    ).style.width =
        percent + "%";


    updateFrequencyBands();

}


// ============================
// 频段
// ============================

function updateFrequencyBands(){

    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    analyser.getByteFrequencyData(
        data
    );


    const sampleRate =
        audioContext.sampleRate;


    const nyquist =
        sampleRate / 2;


    let low = 0;

    let mid = 0;

    let high = 0;


    let lowCount = 0;

    let midCount = 0;

    let highCount = 0;


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const freq =
            i /
            data.length *
            nyquist;


        const value =
            data[i];


        if(freq < 250){

            low += value;

            lowCount++;

        }else if(
            freq < 4000
        ){

            mid += value;

            midCount++;

        }else{

            high += value;

            highCount++;

        }

    }


    low =
        lowCount
        ? low / lowCount
        : 0;


    mid =
        midCount
        ? mid / midCount
        : 0;


    high =
        highCount
        ? high / highCount
        : 0;


    document.getElementById(
        "low"
    ).textContent =
        low.toFixed(0);


    document.getElementById(
        "mid"
    ).textContent =
        mid.toFixed(0);


    document.getElementById(
        "high"
    ).textContent =
        high.toFixed(0);

}

</script>

</body>

</html>
