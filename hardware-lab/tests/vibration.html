<style>
/* ==== 深色模式·黑调覆盖层(主站深色体系) ==== */
body.dark-mode{
    background:#121212 !important;
    color:#eeeeee !important;
}
body.dark-mode .card,
body.dark-mode .desc,
body.dark-mode .note,
body.dark-mode .item,
body.dark-mode .test-list button,
body.dark-mode button,
body.dark-mode input,

}

    background:#222222 !important;

}
</style>
</head>

<body>

<h1>📳 手机震动测试</h1>

<p>输入震动时间（秒）</p>

<input id="time" type="number" min="0.1" step="0.1" value="1">

<br>

<button onclick="vibrate()">开始震动</button>

<button onclick="stopVibrate()">停止震动</button>

<br>



<script>

function vibrate() {

    const seconds = Number(document.getElementById("time").value);

    if (seconds <= 0) {
        alert("请输入大于 0 的数字");
        return;
    }

    const milliseconds = seconds * 1000;

    if ("vibrate" in navigator) {

        navigator.vibrate(milliseconds);

    } else {

        alert("你的浏览器不支持网页震动");

    }
}


// 停止震动
function stopVibrate() {

    navigator.vibrate(0);

}

</script>














<script>

function applyMainTheme(){

    /*
     * 读取主站保存的主题
     *
     * 这里同时兼容常见的 darkMode
     * 和 theme 两种保存方式
     */

    const dark =
        localStorage.getItem("darkMode") === "1" ||
        localStorage.getItem("theme") === "dark";

    document.body.classList.toggle(
        "dark-mode",
        dark
    );

}

applyMainTheme();

</script>


<button
class="hardware-back"
onclick="location.href='../index.html'">
← 返回硬件大厅
</button>
