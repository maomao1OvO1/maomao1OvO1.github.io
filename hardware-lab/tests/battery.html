<!DOCTYPE html>
<html lang="zh-CN">

<!-- ============================================================
  【文件】battery.html —— 电池检测
  【硬件】设备的电池（电量百分比、充电状态、预计剩余时间）
  【用途】读取并实时显示电池基本信息
  【浏览器 API】
    - navigator.getBattery()                       → 核心API：获取 BatteryManager 对象
    - battery.level / charging / chargingTime / dischargingTime
        → 电量(0~1)、是否充电、充/放电预计剩余秒数
    - battery 上的 levelchange / chargingchange /
      chargingtimechange / dischargingtimechange   → 事件监听，数据变化时刷新
    - localStorage.getItem("darkMode"/"theme")     → 跟随主站深色模式
  【测试流程】
    1. init() 检查浏览器是否支持 getBattery，支持则异步获取电池对象
    2. updateBattery() 把电量、充电状态、剩余时间写入页面
    3. 监听 4 个电池事件，任一生效即重新调 updateBattery() 实时刷新
  【判定方式】
    - 支持：显示电量% + ⚡正在充电 / 🔋正在放电 + 预计时间
    - 不支持：状态栏显示 ❌ 浏览器不支持 Battery Status API
    - 电压/电流/功率/温度/协议 网页无法读取，固定显示“系统未提供”（不做猜测）
============================================================ -->

<head>
<script src="/device-check.js?v=18"></script>
    <script src="/anti-bot.js?v=4"></script>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🔋 电池检测</title>

<style>

/* 统一盒模型：宽高含内边距与边框 */
*{
    box-sizing:border-box;
}

/* 页面基础：浅色底、居中 */
body{
    margin:0;
    padding:25px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* 标题 */
h1{
    margin:20px 0 8px;
}

/* 副标题说明文字 */
.desc{
    color:#777;
    margin-bottom:25px;
}

/* 卡片容器：承载电池信息 */
.card{
    max-width:460px;
    margin:15px auto;
    padding:24px 20px;
    background:white;
    border-radius:22px;
    box-shadow:0 5px 20px #0002;
}

/* 电池图形主体：外框 */
.battery{
    width:180px;
    height:90px;
    border:5px solid #6543a4;
    border-radius:15px;
    margin:10px auto 30px;
    position:relative;
    overflow:visible;
}

/* 电池正极的凸起小头 */
.battery::after{
    content:"";
    position:absolute;
    right:-17px;
    top:25px;
    width:12px;
    height:30px;
    background:#6543a4;
    border-radius:0 5px 5px 0;
}

/* 电量填充块：底部起，宽度随电量%变化 */
.level{
    position:absolute;
    left:0;
    bottom:0;
    width:0%;
    height:100%;
    background:#6543a4;
    border-radius:8px;
    transition:width .5s;
}

/* 电池内的百分比文字 */
.percent{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

/* 两列网格布局：容纳各项电池数据 */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

/* 单个数据卡片 */
.item{
    padding:15px 8px;
    background:#f3f3f3;
    border-radius:16px;
}

/* 数据项标题（如“电池电量”） */
.label{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

/* 数据项数值（电量%、充电状态等） */
.value{
    font-size:19px;
    font-weight:bold;
}

/* 底部状态条：显示读取结果或错误 */
.status{
    margin-top:18px;
    padding:12px;
    border-radius:14px;
    background:#eee;
    color:#666;
}

/* 说明文字：解释网页无法读取的电源数据 */
.note{
    margin-top:18px;
    font-size:13px;
    line-height:1.6;
    color:#888;
}

/* 刷新 / 返回按钮 */
button{
    width:90%;
    max-width:350px;
    padding:14px 20px;
    margin:9px;
    border:none;
    border-radius:15px;
    background:white;
    color:#6543a4;
    box-shadow:0 4px 12px #0002;
    font-size:17px;
}

/* 按钮按下反馈 */
button:active{
    transform:scale(.97);
}

/* 深色模式：页面底与文字 */
body.dark-mode{
    background:#121212;
    color:#eee;
}

/* 深色模式：卡片 */
body.dark-mode .card{
    background:#1e1e1e;
}

/* 深色模式：辅助文字 */
body.dark-mode .desc,
body.dark-mode .label,
body.dark-mode .note{
    color:#aaa;
}

/* 深色模式：数据卡片 */
body.dark-mode .item{
    background:#292929;
}

/* 深色模式：状态条 */
body.dark-mode .status{
    background:#292929;
}

/* 深色模式：按钮 */
body.dark-mode button{
    background:#333;
    color:#fff;
}

</style>







<link rel="stylesheet" href="../hardware.css">


<style>

<body>

<h1>🔋 电池检测</h1>

<p class="desc">
实时检测设备电池信息
</p>


<div class="card">

<!-- 电池图形：内层 #level 是电量填充，#percent 是百分比文字 -->
<div class="battery">

<div id="level"
class="level">
</div>

<div id="percent"
class="percent">
--%
</div>

</div>


<div class="grid">

<!-- 电量、充电状态、电压、电流、功率、温度、协议、预计时间 8 项数据 -->
<!-- 其中电压/电流/功率/温度/协议网页无法读取，固定文案“系统未提供” -->
<div class="item">

<div class="label">
电池电量
</div>

<div id="batteryLevel"
class="value">
--
</div>

</div>


<div class="item">

<div class="label">
充电状态
</div>

<div id="charging"
class="value">
--
</div>

</div>


<div class="item">

<div class="label">
电池电压
</div>

<div id="voltage"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电电流
</div>

<div id="current"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电功率
</div>

<div id="power"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
电池温度
</div>

<div id="temperature"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
充电协议
</div>

<div id="protocol"
class="value">
系统未提供
</div>

</div>


<div class="item">

<div class="label">
预计剩余时间
</div>

<div id="time"
class="value">
不可用
</div>

</div>


</div>


<div id="status"
class="status">
正在读取电池信息……
</div>


<div class="note">
网页无法直接读取 Android 的全部电源硬件数据。<br>
电压、电流、功率、温度和充电协议不会进行猜测。
</div>

</div>


<button onclick="updateBattery()">
🔄 刷新电池信息
</button>

<br>

<button onclick="location.href='../index.html'" class="hardware-back">
← 返回硬件大厅
</button>


<script>


// ============================
// 深色模式
// ============================

// 兼容主站的 darkMode / theme 两种保存方式，深色时加 dark-mode 类
const dark =
    localStorage.getItem("darkMode") === "1" ||
    localStorage.getItem("theme") === "dark";

if(dark){
    document.body.classList.add("dark-mode");
}


// ============================
// 电池
// ============================

let battery = null;   // 保存 BatteryManager 对象（getBattery() 返回）


// ============================
// 时间
// ============================

// 把秒数格式化为“x 小时 y 分钟”；无效或过快时提示“系统未提供”
function formatTime(seconds){

    // 浏览器没有提供有效的预计时间
    if(
        !isFinite(seconds) ||
        seconds <= 60
    ){

        return "系统未提供";

    }

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    if(hours > 0){

        return (
            hours +
            " 小时 " +
            minutes +
            " 分钟"
        );

    }

    return minutes + " 分钟";   // 不足 1 小时只显示分钟

}


// ============================
// 更新
// ============================

// 读取一次电池信息并刷新页面上的电量、充电状态、剩余时间与状态条
function updateBattery(){

    if(!battery){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 浏览器不支持 Battery Status API";   // 未拿到电池对象

        return;

    }


    const percent =
        Math.round(
            battery.level * 100    // level 为 0~1，换算成百分比
        );


    document.getElementById(
        "batteryLevel"
    ).textContent =
        percent + "%";                              // 数据卡片：电量


    document.getElementById(
        "percent"
    ).textContent =
        percent + "%";                              // 电池图形内文字


    document.getElementById(
        "level"
    ).style.width =
        percent + "%";                              // 电池图形填充宽度


    if(
        battery.charging                            // 是否在充电
    ){

        document.getElementById(
            "charging"
        ).textContent =
            "⚡ 正在充电";

        document.getElementById(
            "time"
        ).textContent =
            formatTime(
                battery.chargingTime                // 充满还需的秒数
            );

    }else{

        document.getElementById(
            "charging"
        ).textContent =
            "🔋 正在放电";

        document.getElementById(
            "time"
        ).textContent =
            formatTime(
                battery.dischargingTime             // 用到没电还剩的秒数
            );

    }


    document.getElementById(
        "status"
    ).textContent =
        "🟢 电池基本信息读取成功";

}


// ============================
// 初始化
// ============================

// 页面加载：检查支持 → 获取电池对象 → 监听电池事件实时刷新
async function init(){

    if(
        !navigator.getBattery                      // 不支持电池 API
    ){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 当前浏览器没有提供电池 API";

        return;

    }


    try{

        battery =
            await navigator.getBattery();          // 核心API：获取电池对象


        updateBattery();                            // 先显示一次


        // 电量变化时刷新
        battery.addEventListener(
            "levelchange",
            updateBattery
        );


        // 充电状态变化时刷新
        battery.addEventListener(
            "chargingchange",
            updateBattery
        );


        // 预计充满时间变化时刷新
        battery.addEventListener(
            "chargingtimechange",
            updateBattery
        );


        // 预计放电时间变化时刷新
        battery.addEventListener(
            "dischargingtimechange",
            updateBattery
        );


    }catch(error){

        document.getElementById(
            "status"
        ).textContent =
            "❌ 无法读取电池信息";

        console.error(error);

    }

}


init();   // 页面加载即启动

</script>

</body>

</html>
