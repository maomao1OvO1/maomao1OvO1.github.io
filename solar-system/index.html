<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<meta name="description" content="3D 太阳系：行星公转自转、可缩放细看、时间加速、轨道显示，附带每颗行星的科普资料。">
<title>太阳系 · 3D 可探索模型</title>
<link rel="icon" href="../icon.png">
<style>
/* ══════════════════════════════════════════════════════════════════════
 * 太阳系 · 3D 可探索模型（solar-system.html）
 *
 * 干什么：把八大行星按真实相对关系（距离/大小经过可视化夸张）摆出来，让它们真的在转。
 * 能干什么：拖拽转视角 · 双指缩放凑近看 · 点行星跟随并看科普 · 时间加速看轨道跑 · 开关轨道与标签。
 * 怎么实现的：纯 Canvas 2D 手写 3D —— 旋转矩阵 + 透视投影；球体用「逐列采样纹理」画出弧面与自转，
 *            光照按太阳方向算，所以亮面永远朝着太阳（这是它看起来像真的关键）。
 * ══════════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#03040c;color:#dfe8ff;
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* 顶部控制条 */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top .pill{background:rgba(14,18,36,.66);border:1px solid rgba(120,150,255,.2);border-radius:11px;
  padding:6px 10px;font-size:12.5px;backdrop-filter:blur(12px)}
#top .title{font-weight:600;color:#a9c2ff;letter-spacing:.4px}
#top .spacer{flex:1}
#top .btn{pointer-events:auto;cursor:pointer;background:rgba(14,18,36,.66);
  border:1px solid rgba(120,150,255,.2);border-radius:11px;padding:6px 10px;font-size:12.5px;
  backdrop-filter:blur(12px);color:#c8d4f5}
#top .btn.on{color:#7deae0;border-color:rgba(125,234,224,.45);background:rgba(20,40,44,.6)}
#top .btn:active{transform:scale(.96)}

/* 底部提示 */
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);text-align:center;
  font-size:12px;color:#7b88ad;pointer-events:none;transition:opacity .4s}

/* 科普卡片 */
#card{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);
  max-height:58vh;overflow-y:auto;background:rgba(12,16,32,.9);border:1px solid rgba(120,150,255,.24);
  border-radius:18px;padding:16px 16px 18px;backdrop-filter:blur(18px);display:none;
  box-shadow:0 18px 60px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch}
#card.show{display:block;animation:up .26s ease}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
#card h2{font-size:18px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
#card h2 .en{font-size:11.5px;color:#7b88ad;font-weight:400;letter-spacing:.6px}
#card .type{font-size:12px;color:#8ea4d8;margin-bottom:10px}
#card table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
#card td{padding:5px 0;border-bottom:1px solid rgba(120,150,255,.1);vertical-align:top}
#card td:first-child{color:#8b9ac4;width:38%}
#card td:last-child{color:#e2eaff}
#card p{font-size:13px;line-height:1.85;color:#b9c6ea}
#card .close{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;
  background:rgba(40,50,80,.7);border:1px solid rgba(120,150,255,.24);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:15px;color:#c8d4f5}
#card .focus{margin-top:12px;display:flex;gap:8px}
#card .focus button{flex:1;padding:10px;border-radius:11px;border:1px solid rgba(120,150,255,.25);
  background:rgba(30,38,70,.6);color:#dfe8ff;font-size:13px;cursor:pointer;font-family:inherit}
#card .focus button.primary{background:linear-gradient(135deg,#3b5bdb,#7048e8);border-color:transparent;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div class="pill title">☀️ 太阳系</div>
  <div class="btn" id="bPause">⏸</div>
  <div class="btn" id="bSpeed">×1 天/秒</div>
  <div class="spacer"></div>
  <div class="btn on" id="bOrbit">轨道</div>
  <div class="btn on" id="bLabel">名称</div>
  <div class="btn" id="bFollow" style="display:none">跟拍中 ✕</div>
  <div class="btn" id="bReset">复位</div>
</div>

<div id="hint">单指拖动转视角 · 双指拖动平移 · 双指捏合缩放 · 点天体看资料</div>

<div id="card">
  <div class="close" id="cardClose">✕</div>
  <h2><span id="cName">地球</span><span class="en" id="cEn">Earth</span></h2>
  <div class="type" id="cType"></div>
  <table id="cTable"></table>
  <p id="cDesc"></p>
  <div class="focus">
    <button id="cFollow">跟拍这颗</button>
    <button id="cFree">自由视角</button>
  </div>
</div>

    facts:[['直径','51,118 km'],['距日','19.2 AU'],['公转','84 年'],['自转','17 小时 14 分（逆向）'],

    desc:'小行星带里的「老大」，占了整条带约三分之一的质量。它圆得像个行星，因此被归为矮行星。黎明号发现它表面有亮斑 —— 那是盐类沉积，暗示地下可能有过水。' },

  { id:'pluto', name:'冥王星', en:'Pluto', type:'矮行星（柯伊伯带）', color:'#c9b6a2', glow:'#e8d8c8',

      ['轨道倾角','17.16°（明显偏离黄道）'],['卫星','5 颗，最大的是卡戎'],['身份','2006 年被重新归类为矮行星']],
    desc:'曾经的「第九大行星」。2006 年国际天文联合会把它重新划为矮行星 —— 因为柯伊伯带里发现了越来越多和它体量相当的天体。它的轨道又扁又斜，有时比海王星还靠近太阳。新视野号在 2015 年飞掠，人类才第一次看清它长什么样。' },

/* ══════════════════════════════════════════════════════════════════════
 * 二、全局状态
 * ══════════════════════════════════════════════════════════════════════ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;

var S = {
  days: 0,               // 模拟时间（地球日）
  speed: 1,              // 每天多少秒（1 = 1 天/秒）
  paused: false,
  rotX: 0.42, rotY: 0.0, // 相机俯仰/水平角
  zoom: 1,               // 缩放
  camZ: 900,             // 相机到原点的距离（视觉单位）
  showOrbit: true, showLabel: true,
  selected: null,        // 选中的天体
  follow: false,         // 是否跟拍
  t: 0,                  // 真实时间（做动画用）
  spin: 0,               // 自转计时器：独立于「暂停」，暂停时依然在转（方便细看球面）
  pinch: 0, pinchMid: null,          // 双指捏合的距离与中点（中点用于平移）
  panX: 0, panY: 0, panZ: 0,         // 视角中心的世界偏移 —— 「自由视角」靠它才能真正离开太阳
};

/* ══════════════════════════════════════════════════════════════════════
 * 三、程序生成行星表面纹理
 *   为什么要纹理：没有纹理的球体自转看不出来 —— 有了条纹/大陆，转起来才有「活」的感觉。
 *   做法：离屏 canvas 画一张宽图（横向 = 经度），渲染时逐列采样并叠加光照。
 * ══════════════════════════════════════════════════════════════════════ */
var TEXW = 256, TEXH = 8;
function makeTexture(b) {
  var c = document.createElement('canvas');
  c.width = TEXW; c.height = TEXH;
  var g = c.getContext('2d');
  g.fillStyle = b.color; g.fillRect(0, 0, TEXW, TEXH);

  function band(y, h, col, alpha) { g.globalAlpha = alpha; g.fillStyle = col; g.fillRect(0, y, TEXW, h); g.globalAlpha = 1; }
  function spots(n, col, size, alpha) {
    g.globalAlpha = alpha; g.fillStyle = col;
    for (var i = 0; i < n; i++) {
      g.beginPath();
      g.ellipse(Math.random() * TEXW, Math.random() * TEXH, size * (0.6 + Math.random()), size * 0.8, 0, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  if (b.tex === 'bands') {                      // 木星/土星：横向条纹
    var cols = b.id === 'jupiter' ? ['#c9a37a', '#e8d5b0', '#a8763f', '#f0e2c6', '#8b5a2b'] : ['#e3d3a3', '#cfbc86', '#f2e8c9'];
    for (var y = 0; y < TEXH; y++) {
      band(y, 1, cols[Math.floor((Math.abs(Math.sin(y * 1.3 + b.rOrbit) * cols.length)) % cols.length)], 0.75);
    }
    spots(6, '#e8d5b0', 10, 0.5);
    if (b.id === 'jupiter') { g.globalAlpha = .85; g.fillStyle = '#c1442e'; g.beginPath(); g.ellipse(TEXW * .68, TEXH * .62, 13, 4.5, 0, 0, 6.283); g.fill(); g.globalAlpha = 1; }
  } else if (b.tex === 'earth') {               // 地球：海洋 + 大陆 + 极冠
    g.fillStyle = '#1b4f9c'; g.fillRect(0, 0, TEXW, TEXH);
    spots(18, '#2f7d3a', 9, 0.95); spots(10, '#7d6a35', 6, 0.8); spots(5, '#3b8c46', 7, 0.7);
    band(0, 1.2, '#f2f6ff', 0.95); band(TEXH - 1.2, 1.2, '#f2f6ff', 0.95);
  } else if (b.tex === 'mars') {                // 火星：铁锈色 + 暗斑 + 极冠
    spots(24, '#8f3410', 8, 0.55); spots(14, '#e07a4a', 6, 0.5);
    band(0, 1, '#f6efe6', 0.9); band(TEXH - 1, '#f6efe6', 0.8);
  } else if (b.tex === 'crater') {              // 水星：灰色 + 陨石坑
    spots(40, '#6f6761', 4, 0.6); spots(22, '#c4b9ae', 2.5, 0.6);
  } else if (b.tex === 'cloud') {               // 金星：厚云层
    spots(26, '#fff0cf', 11, 0.6); spots(16, '#d8b477', 8, 0.5);
  } else {                                      // 天王星/海王星：细腻的淡斑
    spots(10, '#ffffff', 7, 0.14);
  }
  var img = g.getImageData(0, 0, TEXW, TEXH).data;
  var cols2 = [];                                // 预提取每一列的代表色（渲染时直接用，省掉重复取像素）
  for (var x = 0; x < TEXW; x++) {
    var r = 0, gg = 0, bb = 0;
    for (var yy = 0; yy < TEXH; yy++) {
      var k = (yy * TEXW + x) * 4;

/* ══════════════════════════════════════════════════════════════════════
 * 四、3D：旋转 + 透视投影
 *   相机固定看向原点，靠旋转世界来转视角 —— 比搬相机简单，效果一样。
 * ══════════════════════════════════════════════════════════════════════ */
function project(x, y, z) {
  var cy = Math.cos(S.rotY), sy = Math.sin(S.rotY);
  var x1 = x * cy - z * sy;
  var z1 = x * sy + z * cy;
  var cx = Math.cos(S.rotX), sx = Math.sin(S.rotX);
  var y1 = y * cx - z1 * sx;
  var z2 = y * sx + z1 * cx;
  var sc = 900 / (900 + z2 + S.camZ) * S.zoom;
  return { x: W / 2 + x1 * sc, y: H / 2 + y1 * sc, s: sc, z: z2 };
}

/**
 * 视图中心：自由视角时是原点；跟拍某颗行星时，中心跟着那颗行星走。
 * 注意：太阳**永远在原点** —— 跟随只是平移「观察中心」，不能把太阳也搬走（搬走光照方向就全错）。
 */
function viewCenter() {
  if (S.follow && S.selected) { var w = worldOf(S.selected); if (w) return w; }
  // 自愈：跟拍开着却没有目标（比如卡片被关掉时顺手清空了选中）→ 退回全景，
  // 否则相机距离还是贴近值、中心却回到原点(太阳)，就会出现「跟拍跑到太阳去」的现象。
  if (S.follow && !S.selected) { S.follow = false; S.camZ = 900; setFollowUI(false); }
  // 自由视角 = 相机中心可以停在空间的任何地方（原来固定返回原点，所以只能绕着太阳转）
  return { x: S.panX, y: S.panY, z: S.panZ };
}

/**
 * 某天体在给定时刻的 3D 位置 —— 用真实轨道要素算，不是正圆：
 *   · 椭圆：r = a(1−e²)/(1+e·cosθ)，θ 由平近点角一阶近似（够看，也够科普）
 *   · 倾角：轨道平面相对黄道倾斜真实角度（水星 7°、金星 3.39°…），所以从侧面看不是一张纸
 *   · 近快远慢：一阶近似里带上了 2e·sinθ 项，近日点附近确实会走得快一点
 */
/**
 * 卫星的世界坐标：绕母星的小圆（半径与周期按真实关系压缩过）
 */
function moonWorld(p, m) {
  var a = (S.days / m.period) * 6.28318530718 - 1.6;
  return { x: p.x + Math.cos(a) * m.rOrbit, y: p.y + Math.sin(a) * m.rOrbit * 0.35, z: p.z + Math.sin(a) * m.rOrbit };
}

/** 统一天体列表：主天体 + 它们各自的卫星（一起参与深度排序，远近才对） */
function allBodies() {
  var list = [];
  for (var i = 0; i < BODIES.length; i++) {
    var b = BODIES[i], wp = posOf(b);
    list.push({ b: b, wp: wp });
    var ms = b.moons || [];
    for (var j = 0; j < ms.length; j++) list.push({ b: ms[j], wp: moonWorld(wp, ms[j]), parent: b });
  }
  return list;
}

/** 某选中天体的世界坐标（卫星要先算母星位置） */
function worldOf(sel) {
  if (!sel) return null;
  if (sel.parentId) {
    for (var i = 0; i < BODIES.length; i++) {
      if (BODIES[i].id === sel.parentId) return moonWorld(posOf(BODIES[i]), sel);
    }
    return null;
  }
  return posOf(sel);
}


function posOf(b) {
  if (!b.rOrbit) return { x: 0, y: 0, z: 0 };
  var e = b.e || 0;
  var M = (S.days / b.period) * 6.28318530718 - 1.6;
  var th = M + 2 * e * Math.sin(M);
  var a = b.rOrbit;
  var r = a * (1 - e * e) / (1 + e * Math.cos(th));
  var x = Math.cos(th) * r;
  var z = Math.sin(th) * r;
  var inc = (b.inc || 0) * Math.PI / 180;
  var y = z * Math.sin(inc);
  z = z * Math.cos(inc);
  return { x: x, y: y, z: z };
}

/* ══════════════════════════════════════════════════════════════════════
 * 五、渲染
 * ══════════════════════════════════════════════════════════════════════ */
var STARS = [];
for (var i = 0; i < 220; i++) STARS.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + .25, a: Math.random() * .5 + .15, p: Math.random() * 6.28 });

function drawStars() {
  for (var i = 0; i < STARS.length; i++) {
    var s = STARS[i];
    ctx.globalAlpha = s.a * (.75 + .25 * Math.sin(S.t * 1.2 + s.p));
    ctx.fillStyle = '#cfe0ff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** 轨道线：把圆按同一投影摊成椭圆 */
function drawOrbit(b, center) {
  var e = b.e || 0, a = b.rOrbit, inc = (b.inc || 0) * Math.PI / 180;
  ctx.beginPath();
  var N = 110;
  for (var i = 0; i <= N; i++) {
    var th = i / N * 6.2832;
    var r = a * (1 - e * e) / (1 + e * Math.cos(th));     // 真实椭圆轨道
    var x = Math.cos(th) * r, z = Math.sin(th) * r;
    var y = z * Math.sin(inc); z = z * Math.cos(inc);
    var p = project(x - center.x, y - center.y, z - center.z);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(120,150,255,.18)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/** 球体：逐列采样纹理 + 按太阳方向打光 —— 自转与弧面全靠这一步 */
function drawSphere(cx, cy, r, body, screenSun, spin) {
  if (r < 0.6) { ctx.fillStyle = body.color; ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, r), 0, 6.283); ctx.fill(); return; }
  var img = IMGS[body.id];                       // 真实贴图（2K 原图，逐列贴到球面）
  var cols = TEXCACHE[body.id];
  if (!cols || !cols.length) cols = [[170, 176, 190]];   // 极端兜底：宁可画成灰球，也绝不让整体渲染崩掉
  var texW = cols.length;
  var N = Math.max(16, Math.min(192, Math.round(r * 2.4)));   // 列数翻倍（上限 192）：2K 贴图的细节才保得住

  var lx = screenSun.x - cx, ly = screenSun.y - cy;      // 光方向：从行星指向太阳
  var ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;

  var halo = ctx.createRadialGradient(cx, cy, r * .9, cx, cy, r * 2.1);
  halo.addColorStop(0, hexA(body.glow || body.color, .22));
  halo.addColorStop(1, hexA(body.glow || body.color, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx, cy, r * 2.1, 0, 6.283); ctx.fill();

  for (var i = 0; i < N; i++) {
    var u = (i + .5) / N;                        // 0..1 横跨可见半球
    var ang = (u - .5) * Math.PI;                // → −90°..90° 经度
    var px = Math.sin(ang), pz = Math.cos(ang);
    var wpx = 2 * r / N + 1;
    var dx = cx + px * r - wpx / 2, dy = cy - pz * r, dh = 2 * pz * r;

    if (img && img.naturalWidth) {
      // 有真实贴图：从原图取一条竖带贴到球面这一列（不读像素，file:// 下允许）
      var sx = ((u + spin) % 1 + 1) % 1 * img.naturalWidth;
      var sw = Math.max(1, img.naturalWidth / N);
      if (sx + sw > img.naturalWidth) sw = img.naturalWidth - sx;
      if (sw > 0) ctx.drawImage(img, sx, 0, sw, img.naturalHeight, dx, dy, wpx, dh);
    } else {
      // 没贴图：用程序生成的列色
      var col = cols[Math.floor(((u + spin) % 1 + 1) % 1 * texW)];
      ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
      ctx.fillRect(dx, dy, wpx, dh);
    }
  }

  // ── 光照：一次整体径向渐变（2026-09-15 改）──
  // 原来是逐列压暗，列与列之间会有硬边、看着假；改成整球一次渐变 —— 平滑，
  // 而且自然带出「受光面亮、边缘与背面暗」的立体感（limb darkening），真实星球就是这样。
  var ox = cx + lx * r * .55, oy = cy + ly * r * .55;   // 亮点朝太阳那侧偏移
  var lit = ctx.createRadialGradient(ox, oy, r * .05, cx, cy, r * 1.02);
  lit.addColorStop(0, 'rgba(255,252,244,.20)');
  lit.addColorStop(.42, 'rgba(255,255,255,0)');
  lit.addColorStop(.78, 'rgba(3,5,14,.34)');
  lit.addColorStop(1, 'rgba(2,3,9,.88)');
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283);
  ctx.fillStyle = lit; ctx.fill();
}

function hexA(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

/** 土星环：后半 → 球 → 前半（这样环才会「套」在星球上） */
function drawRing(cx, cy, r, front) {
  // 三道环（C 环内 / B 环主体 / A 环外）+ 卡西尼缝，比单一粗环像样得多
  var bands = [
    { i: 1.22, o: 1.42, a: .22 },   // C 环（暗、内侧）
    { i: 1.46, o: 1.86, a: .52 },   // B 环（最亮最宽）
    { i: 1.96, o: 2.22, a: .34 }    // A 环（外侧，与 B 环之间留出卡西尼缝）
  ];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, Math.max(.14, Math.abs(Math.sin(S.rotX)) * .5 + .1));
  for (var k = 0; k < bands.length; k++) {
    var bd = bands[k];
    ctx.beginPath();
    ctx.arc(0, 0, r * (bd.i + bd.o) / 2, front ? 0 : Math.PI, front ? Math.PI : 0);
    ctx.strokeStyle = 'rgba(232,220,178,' + (bd.a * (front ? 1 : .55)) + ')';
    ctx.lineWidth = Math.max(1, r * (bd.o - bd.i));
    ctx.stroke();
  }
  ctx.restore();
}

/* 小行星带：主带在火星与木星之间（约 2.1~3.3 AU），用一批小点表示，自己也缓慢公转 */
var BELT = [];
(function () {
  for (var i = 0; i < 320; i++) {
    BELT.push({
      a: 190 + Math.random() * 46,          // 视觉半径落在火星(168)与木星(250)之间
      th: Math.random() * 6.2832,
      inc: (Math.random() - .5) * 0.22,     // 上下略微散开，形成一条「带」
      sp: 0.55 + Math.random() * 0.25,      // 各自的公转速度略有差别
      sz: Math.random() * 1.1 + .4
    });
  }
})();
function drawBelt(center) {
  ctx.fillStyle = 'rgba(190,190,205,.5)';
  for (var i = 0; i < BELT.length; i++) {
    var o = BELT[i];
    var th = o.th + S.days * 0.0022 * o.sp;
    var x = Math.cos(th) * o.a, z = Math.sin(th) * o.a;
    var p = project(x - center.x, z * o.inc - center.y, z - center.z);
    if (p.s <= 0) continue;
    var r = Math.max(.5, o.sz * p.s * 1.1);
    ctx.fillRect(p.x, p.y, r, r);
  }
}

/* ══════════════════════════════════════════════════════════════════════
 * 六、主循环
 * ══════════════════════════════════════════════════════════════════════ */
var last = 0;
function loop(ts) {
  var dt = Math.min(.06, (ts - last) / 1000 || 0);
  last = ts; S.t += dt;
  if (!S.paused) S.days += dt * S.speed;
  S.spin += dt * 0.55;      // 自转永远在走：暂停/跟拍时也能看出球面在转

  // 视角中心（跟拍时跟着行星走）；太阳固定在原点，相对中心就是 -center
  var center = viewCenter();
  // 跟拍 = 相机真正凑近：目标距离按行星大小算（大行星站远点、小行星贴近看）
  var camTarget = (S.follow && S.selected) ? Math.max(26, S.selected.rPlanet * 7.5) : 900;
  S.camZ += (camTarget - S.camZ) * Math.min(1, dt * 2.6);
  var screenSun = project(-center.x, -center.y, -center.z);

  ctx.fillStyle = '#03040c'; ctx.fillRect(0, 0, W, H);
  drawStars();

  // 收集所有要画的东西（含深度），远的先画
  var items = [];
  allBodies().forEach(function (it) {
    var wp = it.wp;
    var rel = { x: wp.x - center.x, y: wp.y - center.y, z: wp.z - center.z };
    var p = project(rel.x, rel.y, rel.z);
    items.push({ b: it.b, p: p, rel: rel, parent: it.parent });
  });

  if (S.showOrbit) {
    BODIES.forEach(function (b) {
      if (b.rOrbit) drawOrbit(b, center);
    });
  }
  drawBelt(center);

  items.sort(function (a, c) { return c.p.z - a.p.z; });    // 深度排序：远的先画

  items.forEach(function (it) {
    var b = it.b, p = it.p;
    var r = b.rPlanet * p.s * 1.15;
    var spinDeg = S.spin * 24 / Math.abs(b.spin || 24);    // 自转圈数（用独立计时器）
    var spin = spinDeg - Math.floor(spinDeg);
    if (b.ring) drawRing(p.x, p.y, r, false);
    if (b.id === 'sun') {
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.4);
      g.addColorStop(0, 'rgba(255,238,180,.95)');
      g.addColorStop(.28, 'rgba(255,186,80,.55)');
      g.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.4, 0, 6.283); ctx.fill();
      drawSphere(p.x, p.y, r, b, { x: p.x, y: p.y }, 0.5);
    } else {
      drawSphere(p.x, p.y, r, b, screenSun, spin);
    }
    if (b.ring) drawRing(p.x, p.y, r, true);
    if (S.showLabel) {
      ctx.font = (it.parent ? '10px ' : '11px ') + '-apple-system,"PingFang SC",sans-serif';
      ctx.fillStyle = S.selected && S.selected.id === b.id ? 'rgba(125,234,224,.95)' : 'rgba(180,196,230,.7)';
      ctx.textAlign = 'center';
      ctx.fillText(b.name, p.x, p.y - r - 6);
    }
  });

  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════════════════════
 * 七、交互
 * ══════════════════════════════════════════════════════════════════════ */
var pts = {};              // pointerId → 当前坐标（每个手指各记各的，不再用全局 lastX）
var down = null;           // 本次按下信息（用于区分「拖视角」和「点行星」）
var moved = 0;             // 本次手势累计位移

cv.addEventListener('pointerdown', function (e) {
  pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (Object.keys(pts).length === 1) { down = { x: e.clientX, y: e.clientY, t: Date.now() }; moved = 0; }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});

cv.addEventListener('pointermove', function (e) {
  var p = pts[e.pointerId];
  if (!p) return;
  var ids = Object.keys(pts);
  if (ids.length >= 2) {                       // 双指：捏合缩放 + 拖动平移
    p.x = e.clientX; p.y = e.clientY;
    var a = pts[ids[0]], b = pts[ids[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    if (S.pinch) S.zoom = Math.max(.25, Math.min(16, S.zoom * (d / S.pinch)));
    S.pinch = d;
    // ── 双指中点移动 → 平移视角（这才是「真的自由视角」）──
    var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (S.pinchMid) {
      var ddx = mid.x - S.pinchMid.x, ddy = mid.y - S.pinchMid.y;
      if (Math.abs(ddx) + Math.abs(ddy) > 0.5) {
        // 屏幕位移 → 世界位移：按当前缩放折算，并按水平/俯仰角把方向转回世界坐标系
        // 换算：投影里 屏幕 = 世界 × 900/(900+camZ) × zoom ⇒ 1 像素 = (900+camZ)/(900×zoom) 世界单位
        var k = (900 + S.camZ) / (900 * S.zoom);
        var cy0 = Math.cos(S.rotY), sy0 = Math.sin(S.rotY);
        var cx0 = Math.cos(S.rotX), sx0 = Math.sin(S.rotX);
        S.panX += (-ddx * cy0 + ddy * sy0 * sx0) * k;
        S.panZ += ( ddx * sy0 + ddy * cy0 * sx0) * k;
        S.panY += (-ddy * cx0) * k;
        if (S.follow) { S.follow = false; setFollowUI(false); }   // 平移即脱离跟拍，避免两套中心打架
      }
    }
    S.pinchMid = mid;
    moved = 999;                               // 缩放过的手势一律不算点击
    return;
  }
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  S.rotY += dx * .006;
  S.rotX = Math.max(-1.45, Math.min(1.45, S.rotX + dy * .006));
});

function endPointer(e) {
  delete pts[e.pointerId];
  if (Object.keys(pts).length < 2) { S.pinch = 0; S.pinchMid = null; }
  if (Object.keys(pts).length > 0) return;
  // 只有「几乎没动 + 按得短」才算点击 —— 这样拖完视角抬手就不会误弹卡片
  if (down && moved < 12 && Date.now() - down.t < 350) pickAt(down.x, down.y);
  down = null; moved = 0;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

/** 点选：屏幕距离最近且在命中范围内的天体 */
function pickAt(cx, cy) {
  var center = viewCenter();
  var hit = null, best = 1e9;
  allBodies().forEach(function (it) {           // 卫星也是可点选天体
    var b = it.b, wp = it.wp;
    var p = project(wp.x - center.x, wp.y - center.y, wp.z - center.z);
    var r = Math.max(26, b.rPlanet * p.s * 2.4); // 小天体给点宽容度，否则手指点不中卫星
    var d = Math.hypot(p.x - cx, p.y - cy);
    if (d < r && d < best) { best = d; hit = b; }
  });
  if (hit) selectBody(hit); else hideCard();
}

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  S.zoom = Math.max(.25, Math.min(14, S.zoom * (e.deltaY > 0 ? .92 : 1.08)));
}, { passive: false });

/* ══════════════════════════════════════════════════════════════════════
 * 八、科普卡片
 * ══════════════════════════════════════════════════════════════════════ */
function setFollowUI(on) {
  var el = document.getElementById('bFollow');
  if (!el) return;
  el.style.display = on ? '' : 'none';
  if (on && S.selected) el.textContent = '跟拍：' + S.selected.name + ' ✕';
}

function exitFollow() {
  S.follow = false;
  S.camZ = 900;
  setFollowUI(false);
  document.getElementById('hint').textContent = '单指拖动转视角 · 双指拖动平移 · 双指捏合缩放 · 点天体看资料';
}

function selectBody(b) {
  S.selected = b;
  document.getElementById('cName').textContent = b.name;
  document.getElementById('cEn').textContent = b.en;
  document.getElementById('cType').textContent = b.type;
  var rows = '';
  b.facts.forEach(function (f) { rows += '<tr><td>' + f[0] + '</td><td>' + f[1] + '</td></tr>'; });
  document.getElementById('cTable').innerHTML = rows;
  document.getElementById('cDesc').textContent = b.desc;
  document.getElementById('card').classList.add('show');
  document.getElementById('hint').style.opacity = 0;
}
function hideCard() {
  document.getElementById('card').classList.remove('show');
  // 关掉卡片**不等于**取消跟拍：正在跟拍时保留选中，否则相机会掉回太阳（这是之前的 bug）
  if (!S.follow) S.selected = null;
  document.getElementById('hint').style.opacity = 1;
}
document.getElementById('cardClose').addEventListener('click', hideCard);
document.getElementById('cFollow').addEventListener('click', function () {
  S.follow = true;
  S.zoom = 1;                       // 缩放交给相机距离去做，避免双重放大过头
  setFollowUI(true);
  document.getElementById('hint').textContent = '跟拍中：相机已贴近，可继续加速看它绕太阳走';
});
document.getElementById('cFree').addEventListener('click', exitFollow);
document.getElementById('bFollow').addEventListener('click', exitFollow);   // 点顶部标签也能退出跟拍

/* ══════════════════════════════════════════════════════════════════════
 * 九、控制条
 * ══════════════════════════════════════════════════════════════════════ */
var SPEEDS = [1, 5, 20, 100, 500];
document.getElementById('bPause').addEventListener('click', function () {
  S.paused = !S.paused; this.textContent = S.paused ? '▶' : '⏸';
  this.classList.toggle('on', S.paused);
});
document.getElementById('bSpeed').addEventListener('click', function () {
  var i = SPEEDS.indexOf(S.speed);
  S.speed = SPEEDS[(i + 1) % SPEEDS.length];
  this.textContent = '×' + (S.speed >= 1 ? S.speed + ' 天/秒' : S.speed);
});
document.getElementById('bOrbit').addEventListener('click', function () {
  S.showOrbit = !S.showOrbit; this.classList.toggle('on', S.showOrbit);
});
document.getElementById('bLabel').addEventListener('click', function () {
  S.showLabel = !S.showLabel; this.classList.toggle('on', S.showLabel);
});
document.getElementById('bReset').addEventListener('click', function () {
  S.rotX = .42; S.rotY = 0; S.zoom = 1; S.camZ = 900;
  S.panX = 0; S.panY = 0; S.panZ = 0;          // 平移也归零，回到全景
  S.follow = false; setFollowUI(false); hideCard();
  document.getElementById('hint').textContent = '单指拖动转视角 · 双指拖动平移 · 双指捏合缩放 · 点天体看资料';
});

/* ══════════════════════════════════════════════════════════════════════
 * 十、启动
 * ══════════════════════════════════════════════════════════════════════ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 260); });
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
