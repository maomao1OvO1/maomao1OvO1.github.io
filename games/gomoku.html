<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>五子棋小游戏</title>


<style>

body {

    text-align: center;

    font-family: Arial;

}



/* ===== 返回小游戏按钮 ===== */

.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}



#board {

    width:360px;

    height:360px;

    box-sizing:border-box;

    margin:30px auto;

    display:grid;

    grid-template-columns:repeat(15,1fr);

    grid-template-rows:repeat(15,1fr);

    background:#deb887;

    border-radius:15px;

    padding:5px;

}



.cell {

    width:100%;

    height:100%;

    border:1px solid #555;

    box-sizing:border-box;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:18px;

    cursor:pointer;

    overflow:hidden;

}



.black {

    color: black;

}



.white {

    color: white;

    text-shadow: 0 0 2px black;

}



button {

    padding: 10px 20px;

    margin: 5px;

    border-radius: 20px;

    border: none;

    cursor: pointer;

    font-size: 16px;

}

/* ===== 深色模式 ===== */

body.dark-mode{

    background:#121212;

    color:white;

}


.dark-mode button{

    background:#333;

    color:white;

}

</style>


</head>


<body>

<script>

// ===== 读取深色模式 =====

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<a href="../games.html" class="back-home">

🎮 返回小游戏

</a>



<h1>⚫ 五子棋</h1>


<p id="mode">

当前模式：双人

</p>



<button onclick="setMode('player')">

双人模式

</button>


<button onclick="setMode('ai')">

AI模式

</button>

<button onclick="setMode('pro')">

职业AI

</button>

<button onclick="toggleAIFirst()">

AI先手：关闭

</button>


<p id="info">

黑棋先手

</p>



<div id="board"></div>



<button onclick="restart()">

重新开始

</button>

<script src="proAI.js"></script>

<script>


let board = [];

let turn = 1; // 1黑棋 2白棋

let mode = "player";

let aiFirst = false;

let aiStartTime = 0;

let aiTimeout = 10000;

// ===== 创建棋盘 =====

function createBoard(){


    board=[];


    let box=document.getElementById("board");

    box.innerHTML="";


    for(let i=0;i<15;i++){

        board[i]=[];

        for(let j=0;j<15;j++){


            board[i][j]=0;


            let cell=document.createElement("div");


            cell.className="cell";


            cell.onclick=function(){

                play(i,j);

            };


            box.appendChild(cell);


        }

    }


}




// ===== 下棋 =====

function play(x,y){


    if(gameEnd) return;


    if(board[x][y]!=0) return;



    board[x][y]=turn;


    update();



    if(checkWin(x,y,turn)){


        alert(

            turn==1 ?

            "⚫ 黑棋胜利！"

            :

            "⚪ 白棋胜利！"

        );


        gameEnd=true;

        return;

    }



    turn=turn==1?2:1;



    document.getElementById("info").innerHTML=

    turn==1 ?

    "轮到黑棋"

    :

    "轮到白棋";



    // AI回合

    if(mode=="ai" && turn==2){

     document.getElementById("info").innerHTML =
    "🤖 普通AI思考中...";

        setTimeout(aiMove,500);


    }
   if(mode=="pro" && turn==2){

    document.getElementById("info").innerHTML =
    "🔥 职业AI思考中...";

    setTimeout(proAIMove,500);

}

}




// ===== 刷新棋盘 =====

function update(){


    let cells=document.querySelectorAll(".cell");


    let index=0;



    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){


            cells[index].innerHTML="";


            if(board[i][j]==1){

                cells[index].innerHTML="●";

                cells[index].className="cell black";

            }


            if(board[i][j]==2){

                cells[index].innerHTML="○";

                cells[index].className="cell white";

            }


            index++;


        }

    }


}

// ===== Minimax搜索 =====

function searchBestMove(){

aiStartTime = Date.now();

    let bestScore = -999999;
    let bestMove = null;

    if(board[7][7]==0 && getCandidateMoves().length==1){
    return [7,7];
}

    for(let i=0;i<15;i++){

    for(let j=0;j<15;j++){


        if(Date.now()-aiStartTime > aiTimeout){

            return bestMove;

        }


        if(board[i][j]==0 && nearChess(i,j)){


                // 模拟AI下棋
                board[i][j]=2;


                let score = minimax(5,false,-999999,999999);


                // 恢复
                board[i][j]=0;



                if(score > bestScore){

                    bestScore=score;

                    bestMove=[i,j];

                }

            }

        }

    }


    return bestMove;

}

// ===== 获取搜索候选点 =====

function getCandidateMoves(){

    let moves=[];

    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){

            if(board[i][j]==0 && nearChess(i,j)){

                moves.push([i,j]);

            }

        }

    }


    // 开局没有棋子

    if(moves.length==0){

        return [[7,7]];

    }


    return moves;

}

// ===== 深度搜索 =====

function minimax(depth,isAI,alpha,beta){

    if(Date.now()-aiStartTime > aiTimeout){

        return evaluateBoard();

    }


    if(depth==0){

        return evaluateBoard();

    }


    let best = isAI ? -999999 : 999999;


    let moves=getCandidateMoves();


    for(let m of moves){

        let i=m[0];
        let j=m[1];


        board[i][j]=isAI?2:1;


        let score=minimax(depth-1,!isAI,alpha,beta);


        board[i][j]=0;


        if(isAI){

            best=Math.max(best,score);

            alpha=Math.max(alpha,best);

        }
        else{

            best=Math.min(best,score);

            beta=Math.min(beta,best);

        }


        // ===== 剪枝 =====

        if(beta<=alpha){

            break;

        }

    }


    return best;

}

// ===== 评估整个棋盘 =====

function evaluateBoard(){

    let score=0;


    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){


            if(board[i][j]==2){

                score+=evaluatePoint(i,j,2);

            }


            if(board[i][j]==1){

                score-=evaluatePoint(i,j,1);

            }


        }

    }


    return score;

}

// ===== 寻找强制进攻点 =====

function findThreatSearch(){

    let best=null;

    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){

            if(board[i][j]==0){

                board[i][j]=2;


                let score=evaluatePoint(i,j,2);


                board[i][j]=0;


                if(score>=10000){

                    best=[i,j];

                }

            }

        }

    }


    return best;

}

// ===== AI =====

function aiMove(){

    if(gameEnd)return;


    // ===== 1. AI可以赢，直接赢 =====

    let move=findBestMove(2);


    if(move){

        play(move[0],move[1]);

        return;

    }

// ===== AI威胁搜索 =====

let threatMove=findThreatSearch();

if(threatMove){

    play(threatMove[0],threatMove[1]);

    return;

}

    // ===== 2. 玩家要赢，优先堵住 =====

    move=findBestMove(1);


    if(move){

        play(move[0],move[1]);

        return;

    }

// ===== 防止玩家双三 =====

move=findDoubleThreatMove(1);

if(move){

    play(move[0],move[1]);

    return;

}

// ===== 防止玩家活四 =====

move=findThreatMove(1);

if(move){

    play(move[0],move[1]);

    return;

}

    // ===== 4. 没有危险，选择附近位置 =====

let moves=[];


for(let i=0;i<15;i++){

    for(let j=0;j<15;j++){


        if(board[i][j]==0 && nearChess(i,j)){


            moves.push([i,j]);


        }

    }

}

// ===== 搜索选择 =====

let searchMove = searchBestMove();

if(searchMove){

    play(searchMove[0],searchMove[1]);

    return;
}

// ===== 5. 评分选择最佳位置 =====

let bestScore = -1;

let bestMove = null;


for(let m of moves){


    let i=m[0];

    let j=m[1];


    let attack = evaluatePoint(i,j,2);

let defense = evaluatePoint(i,j,1);

let search = minimaxScore(i,j);


let score =
attack +
defense * 1.5 +
search * 0.3;


    score += Math.random()*5;


    if(score > bestScore){

        bestScore = score;

        bestMove=[i,j];

    }

}


if(bestMove){

    play(bestMove[0],bestMove[1]);

}

}

// ===== 判断附近有没有棋子 =====

function nearChess(x,y){


    for(let i=-1;i<=1;i++){

        for(let j=-1;j<=1;j++){


            let nx=x+i;

            let ny=y+j;


            if(

            nx>=0 &&

            nx<15 &&

            ny>=0 &&

            ny<15 &&

            board[nx][ny]!=0

            ){

                return true;

            }


        }

    }


    return false;

}

// ===== 最大连续棋子数量 =====

function maxLine(x,y,p){

    let dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    let max=0;


    for(let d of dirs){

        let count=1;


        count += countLine(
            x,
            y,
            d[0],
            d[1],
            p
        );


        count += countLine(
            x,
            y,
            -d[0],
            -d[1],
            p
        );


        if(count>max){

            max=count;

        }

    }


    return max;

}

// ===== 新版棋型评分 =====

function evaluatePoint(x,y,player){

    let score=0;

    let old=board[x][y];

    board[x][y]=player;


    let dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    for(let d of dirs){

        let count=1;

        let left=countLine(
            x,y,
            d[0],
            d[1],
            player
        );

        let right=countLine(
            x,y,
            -d[0],
            -d[1],
            player
        );


        count+=left+right;


        let open=0;


        // 判断两端是否为空

        let x1=x+d[0]*(left+1);
        let y1=y+d[1]*(left+1);


        let x2=x-d[0]*(right+1);
        let y2=y-d[1]*(right+1);


        if(
            x1>=0&&x1<15&&
            y1>=0&&y1<15&&
            board[x1][y1]==0
        ){

            open++;

        }


        if(
            x2>=0&&x2<15&&
            y2>=0&&y2<15&&
            board[x2][y2]==0
        ){

            open++;

        }



        // ===== 棋型判断 =====


        if(count>=5){

            score+=1000000;

        }

        else if(count==4 && open==2){

            score+=500000; // 活四

        }

        else if(count==4 && open==1){

            score+=100000; // 冲四

        }

        else if(count==3 && open==2){

            score+=10000; // 活三

        }

        else if(count==3 && open==1){

            score+=1000;

        }

        else if(count==2 && open==2){

            score+=500;

        }


    }


    board[x][y]=old;


    return score;

}

// ===== AI搜索未来一步 =====

function minimaxScore(x,y){


    // AI落子

    board[x][y]=2;


    // 如果AI直接赢

    if(checkWin(x,y,2)){

        board[x][y]=0;

        return 999999;

    }



    let worst=999999;



    // 搜索玩家可能的反击

    for(let i=x-2;i<=x+2;i++){

        for(let j=y-2;j<=y+2;j++){


            if(

            i>=0 &&

            i<15 &&

            j>=0 &&

            j<15 &&

            board[i][j]==0

            ){


                // 玩家落子

                board[i][j]=1;


                let score=evaluatePoint(i,j,1);



                // 玩家能赢，危险

                if(checkWin(i,j,1)){

                    score=999999;

                }



                if(score<worst){

                    worst=score;

                }


                board[i][j]=0;

            }


        }

    }



    // 恢复

    board[x][y]=0;



    // 自己进攻 - 对手威胁

    return evaluatePoint(x,y,2)-worst;

}

// ===== 寻找必胜位置 =====

function findBestMove(player){

    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){

            if(board[i][j]==0){

                board[i][j]=player;


                let win=checkWin(i,j,player);


                board[i][j]=0;


                if(win){

                    return [i,j];

                }

            }

        }

    }


    return null;

}

// ===== 判断活三 =====

function isOpenThree(x,y,player){

    let old=board[x][y];

    board[x][y]=player;


    let dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    let result=false;


    for(let d of dirs){

        let left=countLine(
            x,y,
            d[0],
            d[1],
            player
        );

        let right=countLine(
            x,y,
            -d[0],
            -d[1],
            player
        );


        let count=1+left+right;


        if(count==3){

            let open=0;


            let x1=x+d[0]*(left+1);
            let y1=y+d[1]*(left+1);


            let x2=x-d[0]*(right+1);
            let y2=y-d[1]*(right+1);


            if(
                x1>=0&&x1<15&&
                y1>=0&&y1<15&&
                board[x1][y1]==0
            ){
                open++;
            }


            if(
                x2>=0&&x2<15&&
                y2>=0&&y2<15&&
                board[x2][y2]==0
            ){
                open++;
            }


            if(open==2){

                result=true;

            }

        }

    }


    board[x][y]=0;


    return result;

}

// ===== 寻找双三威胁位置 =====

function findDoubleThreatMove(player){

    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){

            if(board[i][j]==0){

                board[i][j]=player;


                let threat=countOpenThree(i,j,player);


                board[i][j]=0;


                if(threat>=2){

                    return [i,j];

                }

            }

        }

    }


    return null;

}

// ===== 计算一个落子产生几个活三 =====

function countOpenThree(x,y,player){

    let count=0;

    // 保存原来的棋子
    let old=board[x][y];

    board[x][y]=player;


    let dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];


    for(let d of dirs){

        let left=countLine(
            x,y,
            d[0],
            d[1],
            player
        );

        let right=countLine(
            x,y,
            -d[0],
            -d[1],
            player
        );


        let total=1+left+right;


        if(total==3){

            let open=0;


            let x1=x+d[0]*(left+1);
            let y1=y+d[1]*(left+1);


            let x2=x-d[0]*(right+1);
            let y2=y-d[1]*(right+1);


            if(
                x1>=0&&x1<15&&
                y1>=0&&y1<15&&
                board[x1][y1]==0
            ){
                open++;
            }


            if(
                x2>=0&&x2<15&&
                y2>=0&&y2<15&&
                board[x2][y2]==0
            ){
                open++;
            }


            if(open==2){

                count++;

            }

        }

    }


        // 恢复原棋盘
    board[x][y]=old;


    return count;

}

// ===== 寻找玩家威胁位置 =====

function findThreatMove(player){


    for(let i=0;i<15;i++){

        for(let j=0;j<15;j++){


            if(board[i][j]==0){


                board[i][j]=player;


                let count=maxLine(i,j,player);


                board[i][j]=0;



                if(
    count>=4 ||
    isOpenThree(i,j,player)
){

    return [i,j];

}


            }


        }

    }


    return null;

}

// ===== 胜利判断 =====

function checkWin(x,y,p){


    let dirs=[

        [1,0],

        [0,1],

        [1,1],

        [1,-1]

    ];



    for(let d of dirs){


        let count=1;


        count+=countLine(x,y,d[0],d[1],p);


        count+=countLine(x,y,-d[0],-d[1],p);



        if(count>=5){

            return true;

        }


    }


    return false;


}




function countLine(x,y,dx,dy,p){


    let count=0;


    x+=dx;

    y+=dy;



    while(

        x>=0 &&

        x<15 &&

        y>=0 &&

        y<15 &&

        board[x][y]==p

    ){


        count++;


        x+=dx;

        y+=dy;


    }


    return count;


}

// ===== 切换AI先手 =====

function toggleAIFirst(){

    aiFirst = !aiFirst;


    event.target.innerHTML =
    aiFirst ?

    "AI先手：开启"

    :

    "AI先手：关闭";
  
    restart();

}

// ===== AI先手模式 =====
// 点击按钮后，让AI直接开始下第一步

function startAIFirst(){

    // 设置为普通AI模式
    mode="ai";


    // 修改顶部模式显示
    document.getElementById("mode").innerHTML =
    "当前模式：AI先手";


    // 重新开始棋局
    restart();


    // 设置回合为AI（白棋）
    turn=2;


    // 显示AI思考提示
    document.getElementById("info").innerHTML =
    "🤖 AI思考中...";


    // 延迟500毫秒，让玩家看到提示
    setTimeout(aiMove,500);

}

// ===== 模式 =====

function setMode(m){

    mode=m;


    let text="当前模式：双人";


    if(mode=="ai"){

        text="当前模式：普通AI";

    }


    if(mode=="pro"){

        text="当前模式：职业AI";

    }


    document.getElementById("mode").innerHTML=text;


    restart();

}



// ===== 重开 =====

function restart(){

    turn=1;

    gameEnd=false;


    createBoard();


    if(aiFirst && mode!="player"){

        turn=2;


        document.getElementById("info").innerHTML =
        "🤖 AI先手思考中...";


        if(mode=="ai"){

            setTimeout(aiMove,500);

        }


        if(mode=="pro"){

            setTimeout(proAIMove,500);

        }


    }
    else{

        document.getElementById("info").innerHTML =
        "黑棋先手";

    }

}



createBoard();


</script>


</body>

</html>
