<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>猜数字小游戏</title>


<style>

body {

    text-align: center;

    font-family: Arial;

}


.game-box {

    margin: 80px auto;

    width: 300px;

    padding: 30px;

    border-radius: 20px;

    background: #f2f2f2;

}


input {

    width: 100px;

    padding: 8px;

    border-radius: 10px;

    border: 1px solid #ccc;

}


button {

    margin-top: 15px;

    padding: 10px 20px;

    border-radius: 20px;

    border: none;

    cursor: pointer;

}

/* ===== 返回小游戏按钮 ===== */

.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}

/* ===== 深色模式 ===== */

body.dark-mode{

    background:#121212;

    color:white;

}


.dark-mode .game-box{

    background:#222;

}


.dark-mode input{

    background:#222;

    color:white;

    border:1px solid #555;

}


.dark-mode button{

    background:#333;

    color:white;

}

</style>


</head>


<body>

<script>

// ===== 读取深色模式 =====

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<a href="../games.html" class="back-home">
🎮 返回小游戏
</a>

<div class="game-box">


<h1>🎯 猜数字</h1>


<p>我已经想好了一个 1~100 的数字</p>


<input id="guess" type="number">


<br>


<button onclick="checkGuess()">

猜一下

</button>


<p id="result"></p>


</div>



<script>


// ===== 游戏核心 =====


let answer = Math.floor(Math.random() * 100) + 1;


let count = 0;



function checkGuess(){


    let num = Number(document.getElementById("guess").value);


    let result = document.getElementById("result");


    count++;


    if(num === answer){


    result.innerHTML =
    "🎉 猜中了！用了 " + count + " 次";


    fetch("https://maomao-server.onrender.com/win",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:localStorage.getItem("playerName") || "游客",

            game:"猜数字",

            score:count

        })

        })
    .then(res=>res.json())
    .then(data=>{
    alert("排行榜上传成功:\n" + JSON.stringify(data));
})
.catch(err=>{
    alert("上传失败:\n" + err);
});


}    

else if(num > answer){


        result.innerHTML = "⬇️ 太大了";


    }else{


        result.innerHTML = "⬆️ 太小了";


    }


}


</script>


</body>

</html>
