<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#7C5CBF">
<link rel="icon" type="image/png" href="../../icon.png">
<link rel="apple-touch-icon" href="../../icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>谢谢你玩到这里 · 共鸣之塔</title>
<style>
  :root{--gold:#e8c46a;--txt:#e2e7f2;--dim:#8f97ab;--line:rgba(255,255,255,.09)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:34px 20px 40px;display:flex;justify-content:center;color:var(--txt);
       background:radial-gradient(1100px 560px at 50% -14%,#1d2233,#0a0c11 64%);
       font:15px/1.95 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:520px}
  h1{font-size:23px;margin:0 0 7px;letter-spacing:.5px;
     background:linear-gradient(94deg,#f4f7ff 12%,var(--gold) 92%);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:12.5px;letter-spacing:1.6px;margin-bottom:26px}
  p{margin:0 0 15px}
  .hl{color:var(--gold)}
  .rule{height:1px;margin:26px 0 24px;background:linear-gradient(90deg,transparent,rgba(232,196,106,.32),transparent)}
  .box{margin-top:28px;padding:26px 22px;border-radius:18px;text-align:center;
       background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
       border:1px solid var(--line);box-shadow:0 18px 44px -30px rgba(0,0,0,.95)}
  .qr{width:min(292px,72vw);display:block;margin:14px auto 16px;border-radius:16px;background:#fff;
      padding:9px;box-shadow:0 0 0 1px rgba(232,196,106,.22),0 10px 34px -18px rgba(232,196,106,.45)}
  .lead{font-size:15px;letter-spacing:.4px}
  .lead b{color:var(--gold);font-weight:600}
  .tip{color:var(--dim);font-size:12.5px;margin-top:12px;line-height:1.8}
  .rest{font-size:16px;margin-bottom:10px;letter-spacing:.5px}
  .resttxt{color:var(--dim);font-size:13.5px;line-height:2}
  .back{display:block;text-align:center;color:var(--dim);font-size:12.5px;margin-top:30px;text-decoration:none;letter-spacing:.5px}
  .stat{text-align:center;color:#4e5666;font-size:11px;margin-top:14px;letter-spacing:.6px}
</style>
<!-- 性能：提前建立关键外部连接（省掉 DNS+TLS 往返） -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://ipwho.is">
</head>
<body>
<div class="card">
  <h1>谢谢你玩到这里</h1>
  <div class="sub">共鸣之塔 · 一份小小的礼物</div>

  <p>做这个游戏的时候我常常改到凌晨 —— 一个塔的数值、一句提示文案，反复调了不知道多少遍。</p>
  <p>它没有广告、没有内购、不锁任何内容，因为我想让它是一份<span class="hl">能被人拿去学习的礼物</span>。</p>
  <p>如果它给你带来了一点点快乐，可以请作者喝杯奶茶 ☕<br>一切随意，你开心最重要。</p>

  <div class="rule"></div>

  <div class="box"><div id="slot">正在推开小门…</div></div>

  <a class="back" href="/games.html">← 回到游戏页</a>
  <div class="stat" id="stat"></div>
</div>

<script>
/* ================== 配置（想调就改这一块）==================
   CLOSE_AT：今天来访超过这个数，就把赞赏码先收起来（人多了先躲清静）
   默认是"敞开"的 —— 只有超过上限才会收起，第二天自动重新敞开。 */
var CLOSE_AT = 30;
var NS  = 'maomao1ovo1';                       // 计数命名空间
var API = 'https://abacus.jasoncameron.dev/';  // 免费计数（无需 key）
var QR  = 'donate/reward_qrcode.png';          // 赞赏码
/* ========================================================== */

(function () {
  var slot = document.getElementById('slot'), stat = document.getElementById('stat');
  var d = new Date(), day = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  var KEY = 'td-visit-' + day, seen = 'td-seen-' + day, n = 0, ok = false;

  function render() {
    if (ok && n >= CLOSE_AT) {
      slot.innerHTML =
        '<div class="rest">🍵 小门先虚掩一会儿</div>' +
        '<div class="resttxt">今天来的人有点多，我先把这扇小门收起来躲个清静。<br><br>' +
        '如果你也喜欢这个游戏，把它分享给一个可能会喜欢它的朋友 ——<br>' +
        '对我来说，这就是最好的支持 ❤️</div>';
      stat.textContent = '今日来访 ' + n + ' · 上限 ' + CLOSE_AT;
    } else {
      slot.innerHTML =
        '<div class="lead">微信扫一扫 · 请作者喝杯奶茶 <b>☕</b></div>' +
        '<img class="qr" src="' + QR + '" alt="赞赏码" loading="lazy">' +
        '<div class="tip">全凭心意，不影响游戏任何内容 · 谢谢你看完这段话</div>';
      stat.textContent = ok ? '今日来访 ' + n + ' · 上限 ' + CLOSE_AT : '';
    }
  }

  try {
    var fresh = !localStorage.getItem(seen);          // 同一台设备一天只算一次，数字更真实
    fetch(API + (fresh ? 'hit/' : 'get/') + NS + '/' + KEY, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        n = (j && (j.value || j.count)) || 0; ok = true;
        if (fresh) localStorage.setItem(seen, '1');
        render();
      })
      .catch(function () { render(); });               // 数不到就不拦着，照常敞开
  } catch (e) { render(); }
})();
</script>
</body>
</html>
