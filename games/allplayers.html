<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩家汇总 · 毛毛</title>
<style>
body { text-align:center; font-family:Arial, sans-serif; background:#f5f5f5; margin:0; padding:15px; }
h1 { color:#7C5CBF; }
.gate { max-width:480px; margin:40px auto; background:#fff; padding:25px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); }
.box { max-width:900px; margin:10px auto; background:#fff; padding:15px 18px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); text-align:left; }
button { padding:9px 14px; border:none; border-radius:10px; font-size:15px; margin:4px; background:#7C5CBF; color:#fff; cursor:pointer; }
button:hover { background:#6543a5; }
.msg { color:#666; margin:6px 0; }
.msg.err { color:#c94f4f; }
table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
th, td { border:1px solid #e0e0e0; padding:6px 8px; text-align:center; }
th { background:#f3edff; color:#6543a5; }
th.pname, td.pname { text-align:left; font-weight:bold; }
.back-home { position:fixed; top:20px; right:20px; background:#e5dcff; color:#6543a5; padding:10px 15px; border-radius:20px; text-decoration:none; font-size:16px; z-index:9; }
.scroll { overflow-x:auto; }
body.dark-mode { background:#121212; color:#fff; }
.dark-mode .box, .dark-mode .gate { background:#1e1e1e; color:#eee; }
.dark-mode th { background:#2a2438; color:#bb9cff; }
.dark-mode th, .dark-mode td { border-color:#333; }
.dark-mode .back-home { background:#333; color:#bb9cff; }
</style>
</head>

<body>

<script>
// ===== 读取深色模式 =====
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-mode");
}
</script>

<h1>👥 玩家汇总（全部游戏）</h1>

<div id="gate" class="gate">
    <p>⚠️ 这个页面只有<b>站长（毛毛账号）</b>能用。</p>
    <p id="gateWhy">请先登录毛毛账号。</p>
    <a href="admin.html" class="back-home">⚙️ 回管理页</a>
</div>

<div id="panel" style="display:none;">
    <div class="box">
        <div class="msg" id="msg">加载中...</div>
        <div class="scroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </div>
    <a href="admin.html" class="back-home">⚙️ 回管理页</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
const FS_BASE = "https://firestore.googleapis.com/v1/projects/maomao-3c9ef/databases/(default)/documents";
const FS_KEY = "AIzaSyCa7M7dFqDlilAtniesykU97PWb--S_EX8";
const GAMES = {
    "2048":  { label: "2048",    best: "max", unit: "分" },
    "snake": { label: "贪吃蛇",  best: "max", unit: "分" },
    "typing":{ label: "打字",    best: "max", unit: "字/分" },
    "guess": { label: "猜数字",  best: "min", unit: "次" },
    "gomoku":{ label: "五子棋",  best: "max", unit: "连胜" },
    "chess": { label: "象棋",    best: "max", unit: "连胜" },
    "fish":  { label: "捕鱼",    best: "max", unit: "分" },
    "go":    { label: "围棋",    best: "max", unit: "目" }
};
const OWNER_EMAIL = (function(){ try { return atob("bW9jLmxpYW1nQDFvdm8xb2Ftb2Ft").split("").reverse().join("").toLowerCase(); } catch(e){ return ""; } })();

if (!firebase.apps.length) { firebase.initializeApp(window.FIREBASE_CONFIG); }
firebase.auth().onAuthStateChanged(function(user){
    if (user && String(user.email || "").toLowerCase() === OWNER_EMAIL) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("panel").style.display = "block";
        loadAll();
    } else {
        document.getElementById("gate").style.display = "block";
        document.getElementById("panel").style.display = "none";
        document.getElementById("gateWhy").textContent = user
            ? "当前登录：" + user.email + "（不是站长账号）"
            : "请先登录毛毛账号。";
    }
});

function decodeDocId(docId){
    var i = docId.indexOf("_");
    if (i < 0) return null;
    function h2s(h){ if (h.length % 2) return ""; var b=[]; for(var j=0;j<h.length;j+=2) b.push(parseInt(h.slice(j,j+2),16)); try{ return new TextDecoder().decode(new Uint8Array(b)); }catch(e){ return ""; } }
    var game = h2s(docId.slice(0,i)), name = h2s(docId.slice(i+1));
    if (!game || !name) return null;
    return { game: game, name: name };
}

function loadAll(){
    var tbl = document.getElementById("tbl");
    var msg = document.getElementById("msg");
    msg.textContent = "加载中..."; msg.className = "msg";

    fetch(FS_BASE + "/scores?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(data){
        var docs = data.documents || [];
        var players = {};   // name -> { gameId: score }
        var usedGames = {}; // gameId -> true
        docs.forEach(function(d){
            var id = decodeDocId(d.name.split("/").pop());
            if (!id) return;
            var f = d.fields || {};
            var score = f.score ? Number(f.score.integerValue || f.score.doubleValue) : NaN;
            var name = f.name ? f.name.stringValue : id.name;
            if (isNaN(score)) return;
            if (!players[name]) players[name] = {};
            players[name][id.game] = score;
            usedGames[id.game] = true;
        });

        var rows = Object.keys(players).map(function(name){
            return { name: name, games: players[name] };
        });
        // 有玩过的游戏数（降序）+ 名字
        rows.sort(function(a,b){
            var ca = Object.keys(a.games).length, cb = Object.keys(b.games).length;
            if (ca !== cb) return cb - ca;
            return a.name.localeCompare(b.name);
        });

        var gids = Object.keys(usedGames);
        // 表头
        var thead = "<tr><th class='pname'>玩家</th>";
        gids.forEach(function(g){ thead += "<th>" + GAMES[g].label + "<br><small>" + (GAMES[g].unit||"") + "</small></th>"; });
        thead += "<th>已玩</th></tr>";
        tbl.tHead.innerHTML = thead;

        var tbody = "";
        rows.forEach(function(p){
            tbody += "<tr><td class='pname'>" + esc(p.name) + "</td>";
            gids.forEach(function(g){
                var v = p.games[g];
                tbody += "<td>" + (v === undefined ? "—" : v) + "</td>";
            });
            tbody += "<td>" + Object.keys(p.games).length + "</td></tr>";
        });
        tbl.tBodies[0].innerHTML = tbody;

        msg.textContent = "共 " + rows.length + " 位玩家";
    })
    .catch(function(e){ msg.textContent = "加载失败:" + e.message; msg.className = "msg err"; });
}

function esc(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
</script>

</body>
</html>
