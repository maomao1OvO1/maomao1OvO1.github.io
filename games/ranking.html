<!DOCTYPE html>
<!--
    ============================================================
    文件名  ：games/ranking.html —— 毛毛小游戏排行榜
    用途    ：展示各小游戏（2048/贪吃蛇/打字/猜数字/五子棋/象棋/捕鱼/围棋）的历史成绩榜单。
    核心逻辑：
        1) 直连 Google Firestore REST API 拉取成绩数据（无需自建后端）；
        2) 用 Firestore 文档 ID 的编码规则（hex(游戏名) + "_" + hex(玩家名)）反解出「哪个游戏、哪个玩家」；
        3) 按游戏定义的 best 方向（max 越大越好 / min 越小越好）排序，取前 20 名渲染成卡片；
        4) 额外加载一份 "special/vips"（呼吸灯名单），名单内玩家（含站长）卡片带「呼吸灯+闪光」特效。
    引用资源：
        - 外部接口：Firestore REST API（FS_BASE，密钥以「密钥」占位）
        - 外部页面：../games.html（返回入口）、admin.html（管理模式）
        - 与本项目其他页共享的约定：report.js（成绩上报）、login.js（站长登录）、localStorage 键名
    关联约定：文档 ID = hex(游戏名) + "_" + hex(玩家名)，其余页面同样按此写入/读取。
    ============================================================
-->
<html>

<head>
<script src="/device-check.js?v=10"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛毛小游戏排行榜</title>
<style>
body { text-align:center; font-family:Arial, sans-serif; background:#f5f5f5; margin:0; padding:15px; }
h1 { color:#7C5CBF; }
.box { max-width:560px; margin:10px auto; background:#fff; padding:15px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); }
select, button { padding:9px 14px; border:none; border-radius:10px; font-size:15px; margin:4px; }
select { border:1px solid #ccc; background:#fff; }
button { background:#7C5CBF; color:#fff; cursor:pointer; }
button:hover { background:#6543a5; }
.msg { color:#999; margin-top:10px; }

/* 榜单卡片 */
#list { max-width:520px; margin:14px auto; }
.rank-card {
    background:#fff; margin:10px auto; padding:12px 18px; border-radius:14px;
    font-size:18px; box-shadow:0 2px 8px rgba(0,0,0,0.12);
    position:relative; overflow:hidden; display:flex; align-items:center; gap:12px;
}
.rank-card .rank { font-size:22px; flex:0 0 70px; text-align:center; }
.rank-card .name { flex:1; text-align:left; }
.rank-card .score { font-weight:bold; }

/* ===== 站长/授权玩家：呼吸灯 + 闪光 ===== */
.rank-card.owner {
    border:3px solid #7C5CBF;
    background:#f3edff;
    color:#7C5CBF;
    font-weight:bold;
    animation: glowBreath 2s ease-in-out infinite;
}
.rank-card.owner::after {
    content:"";
    position:absolute; top:0; left:-120%; width:55%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.75), transparent);
    animation: shineSweep 2.6s ease-in-out infinite;
}
@keyframes glowBreath {
    0%,100% { box-shadow: 0 0 10px #7C5CBF, 0 0 25px rgba(124,92,191,0.5); }
    50% { box-shadow: 0 0 22px #7C5CBF, 0 0 48px rgba(124,92,191,0.9); }
}
@keyframes shineSweep {
    0% { left:-120%; }
    55%,100% { left:135%; }
}

/* ===== 返回小游戏按钮 ===== */
.back-home {
    position: fixed; top: 20px; right: 20px;
    background: #e5dcff; color: #6543a5;
    padding: 10px 15px; border-radius: 20px;
    text-decoration: none; font-size: 16px; z-index: 9;
}
body.dark-mode{ background:#121212; color:white; }
.dark-mode .box, .dark-mode .rank-card { background:#1e1e1e; color:#eee; }
.dark-mode select { background:#333; color:#eee; border-color:#555; }
.dark-mode .back-home { background:#333; color:#bb9cff; }
</style>
</head>

<body>

<script>
// ===== 读取深色模式 =====
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-mode");
}
</script>

<h1>🏆 毛毛小游戏排行榜</h1>

<div class="box">
    <select id="gameSel"></select>
    <button onclick="refresh()">查看榜单</button>
    <div class="msg" id="msg">加载中...</div>
    <div id="list"></div>
</div>

<a href="../games.html" class="back-home">🎮 返回小游戏</a>
<button id="adminBtn" style="display:none;position:fixed;top:20px;left:20px;background:#7C5CBF;color:#fff;padding:10px 15px;border:none;border-radius:20px;font-size:16px;z-index:9;cursor:pointer;" onclick="location.href='admin.html'">⚙️ 管理</button>

<script>
// Firestore 直连配置(与 report.js 相同)
const FS_BASE = "https://firestore.googleapis.com/v1/projects/maomao-3c9ef/databases/(default)/documents";
const FS_KEY = "AIzaSyCa7M7dFqDlilAtniesykU97PWb--S_EX8";
const OWNER = "毛毛";   // 默认呼吸灯名字（兜底）

// 站长邮箱（混淆存储，防爬虫；与 login.js 一致）
const OWNER_EMAIL = (function(){ try { return atob("bW9jLmxpYW1nQDFvdm8xb2Ftb2Ft").split("").reverse().join("").toLowerCase(); } catch(e){ return ""; } })();

// 呼吸灯名单（默认先含毛毛；从 Firestore special/vips 读取，站长登录时自动加自己当前名字）
let VIP = new Set([OWNER]);

// 玩家名公开可写，展示时必须转义（防 XSS）
function escHtml(s){ return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

// ===== 站长专属：仅毛毛账号显示「管理」入口 =====
(function(){
    try {
        var a = JSON.parse(localStorage.getItem("authUser") || "null");
        if (a) {
            var em = String(a.email || "").toLowerCase();
            var nm = String(a.name || "");
            var isMao = /maomao1ovo1@(gmail|163)\.com$/.test(em) || /毛毛|maomao1ovo1/i.test(nm);
            if (isMao) document.getElementById("adminBtn").style.display = "block";
        }
    } catch (e) {}
})();

// 游戏定义(与服务器 GAMES 一致; best=min 越小越好如猜数字, max 越大越好)
const GAMES = {
    "2048":  { label: "2048",    best: "max", unit: "分" },
    "snake": { label: "贪吃蛇",  best: "max", unit: "分" },
    "typing":{ label: "打字",    best: "max", unit: "字/分" },
    "guess": { label: "猜数字",  best: "min", unit: "次" },
    "gomoku":{ label: "五子棋",  best: "max", unit: "连胜" },
    "chess": { label: "象棋",    best: "max", unit: "连胜" },
    "fish":  { label: "捕鱼",    best: "max", unit: "分" },
    "go":    { label: "围棋",    best: "max", unit: "目" }
};

// 游戏下拉框
let gameSel = document.getElementById("gameSel");
for (let id in GAMES) {
    let opt = document.createElement("option");
    opt.value = id; opt.textContent = GAMES[id].label;
    gameSel.appendChild(opt);
}
refresh();

// 先加载呼吸灯名单，再渲染榜单
function refresh(){
    loadVip().then(loadRank);
}

function loadVip(){
    return fetch(FS_BASE + "/special/vips?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){
        var arr = (d.fields && d.fields.names && d.fields.names.arrayValue && d.fields.names.arrayValue.values) || [];
        var names = arr.map(function(v){ return v.stringValue; }).filter(Boolean);
        VIP = new Set(names.length ? names : [OWNER]);
        // 站长登录时：把他正用着的名字也加进名单（不管改叫什么都亮）
        try {
            var a = JSON.parse(localStorage.getItem("authUser") || "null");
            if (a && String(a.email || "").toLowerCase() === OWNER_EMAIL) {
                var pn = localStorage.getItem("playerName");
                if (pn) VIP.add(pn);
            }
        } catch(e){}
    })
    .catch(function(){ /* 规则未生效/暂无名单 → 兜底只亮毛毛 */ });
}

// 文档 ID 格式: hex(游戏) + "_" + hex(名字) → 解码回 {game, name}
function decodeDocId(docId) {
    const i = docId.indexOf("_");
    if (i < 0) return null;
    const hexToStr = (h) => {
        if (h.length % 2) return "";
        const bytes = [];
        for (let j = 0; j < h.length; j += 2) bytes.push(parseInt(h.slice(j, j + 2), 16));
        try { return new TextDecoder().decode(new Uint8Array(bytes)); } catch (e) { return ""; }
    };
    const game = hexToStr(docId.slice(0, i));
    const name = hexToStr(docId.slice(i + 1));
    if (!game || !name) return null;
    return { game: game, name: name };
}

function loadRank() {
    const game = gameSel.value;
    const msg = document.getElementById("msg");
    const list = document.getElementById("list");

    msg.innerText = "加载中...";
    list.style.display = "none";

    fetch(FS_BASE + "/scores?key=" + FS_KEY)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => {
        const docs = data.documents || [];
        const entries = [];
        docs.forEach(d => {
            const id = decodeDocId(d.name.split("/").pop());
            if (!id || id.game !== game) return;
            const f = d.fields || {};
            const score = f.score ? Number(f.score.integerValue || f.score.doubleValue) : NaN;
            const name = f.name ? f.name.stringValue : id.name;
            if (isNaN(score)) return;
            entries.push({ name: name, score: score });
        });

        if (entries.length === 0) {
            msg.innerText = "这个游戏还没有成绩，快去玩一把吧！";
            return;
        }

        // 排序: max 大在前, min 小在前
        const dir = GAMES[game].best === "min" ? 1 : -1;
        entries.sort((a, b) => dir * (a.score - b.score));
        const top = entries.slice(0, 20);

        msg.innerText = "";
        let html = "";
        top.forEach((p, i) => {
            const medal = ["🥇","🥈","🥉"][i] || "🏅";
            const isOwner = VIP.has(p.name);
            html +=
                '<div class="rank-card' + (isOwner ? " owner" : "") + '">' +
                '<span class="rank">' + medal + '</span>' +
                '<span class="name">' + (isOwner ? "👑 " : "") + escHtml(p.name) + '</span>' +
                '<span class="score">' + p.score + ' ' + (GAMES[game].unit || "") + '</span>' +
                '</div>';
        });
        list.innerHTML = html;
        list.style.display = "block";
    })
    .catch(() => { msg.innerText = "加载失败，请稍后重试"; });
}
</script>

</body>
</html>
