<!DOCTYPE html>
<!-- ============================================================================
    admin.html —— 排行榜管理页（站长专用）
    这页是「排行榜后台」：站长登录后可以查看 / 修改 / 删除 / 添加排行榜记录，
    还能维护「呼吸灯名单」。普通玩家访问会被拦在登录门（gate）外，看不到管理面板。

    【站长专属逻辑】用 Firebase Auth 登录校验：只有邮箱匹配 OWNER_EMAIL（站长邮箱
    混淆存储，见下方）的账号才放行到管理面板；否则显示「请先登录毛毛账号」并禁用整个面板。
    删除等敏感操作还额外要求携带站长登录后的 ID token（Bearer 头），由 Firestore 安全
    规则判定「仅站长可删」。

    【数据来源】Firestore REST API（FS_BASE），集合 /scores（成绩）、/special/vips（呼吸灯名单）。
    新增/修改成绩走公开写（与 report.js 一致）；删除走需要站长 token 的 DELETE。

    【安全点】仅站长可见（gate 拦截 + Firestore 规则）；玩家名在浏览器用 textContent 写入
    （不做 innerHTML）以规避 XSS；删除按钮用事件委托 + dataset，避免把玩家名拼进内联 onclick。
    页面里的 FS_KEY 为 Web API 密钥（记为「密钥」，勿外泄）。
============================================================================ -->
<html>

<head>
<script src="/device-check.js?v=15"></script>
    <script src="/anti-bot.js?v=4"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜管理 · 毛毛</title>
<style>
body { text-align:center; font-family:Arial, sans-serif; background:#f5f5f5; margin:0; padding:15px; }
h1 { color:#7C5CBF; }
.box { max-width:620px; margin:10px auto; background:#fff; padding:15px 18px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); text-align:left; }
select, input, button { padding:9px 12px; border:none; border-radius:10px; font-size:15px; margin:4px; box-sizing:border-box; }
select, input { border:1px solid #ccc; background:#fff; }
button { background:#7C5CBF; color:#fff; cursor:pointer; }
button:hover { background:#6543a5; }
button.sec { background:#e5dcff; color:#6543a5; }
button.danger { background:#c94f4f; }
button.danger:hover { background:#a83838; }
.gate { max-width:480px; margin:40px auto; background:#fff; padding:25px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); }

#list { max-width:600px; }

body.dark-mode { background:#121212; color:#fff; }
.dark-mode .box, .dark-mode .gate { background:#1e1e1e; color:#eee; }
.dark-mode select, .dark-mode input { background:#333; color:#eee; border-color:#555; }
.dark-mode button.sec { background:#333; color:#bb9cff; }
.dark-mode .back-home { background:#333; color:#bb9cff; }
.dark-mode .rowsc { border-color:#333; }
</style>
</head>

<body>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
// ============================================================================
// 配置区（与 report.js / ranking.html 保持一致）
// FS_BASE：Firestore REST API 基础地址（项目 + 数据库路径）
// FS_KEY ：Web API 密钥（记为「密钥」，拼接在 query 上放行读写，勿外泄）
// OWNER_EMAIL：站长邮箱，用 atob + reverse + toLowerCase 混淆存储，防爬虫直接
//             读到明文；与 login.js 写法一致。
// GAMES：游戏 id → 展示名/最优方向/单位。best=min 表示分数越小越好（如猜数字），
//        max 表示越大越好；排序时用到。
// ============================================================================
// ===== 配置（与 report.js / ranking.html 一致）=====
const FS_BASE = "https://firestore.googleapis.com/v1/projects/maomao-3c9ef/databases/(default)/documents"; // Firestore REST 基础地址
const FS_KEY = "AIzaSyCa7M7dFqDlilAtniesykU97PWb--S_EX8"; // Web API 密钥（记为「密钥」，勿外泄）
// 站长邮箱（混淆存储，防爬虫；与 login.js 相同写法）
var OWNER_EMAIL = (function(){ try { return atob("bW9jLmxpYW1nQDFvdm8xb2Ftb2Ft").split("").reverse().join("").toLowerCase(); } catch(e){ return ""; } })();
var OWNER_EMAILS = [OWNER_EMAIL];   // 站长邮箱数组，方便扩展多个站长
const GAMES = {   // 游戏定义表：label=展示名；best=max 越大越好 / min 越小越好；unit=分数单位
    "2048":  { label: "2048",    best: "max", unit: "分" },
    "snake": { label: "贪吃蛇",  best: "max", unit: "分" },
    "typing":{ label: "打字",    best: "max", unit: "字/分" },
    "guess": { label: "猜数字",  best: "min", unit: "次" },
    "gomoku":{ label: "五子棋",  best: "max", unit: "连胜" },
    "chess": { label: "象棋",    best: "max", unit: "连胜" },
    "fish":  { label: "捕鱼",    best: "max", unit: "分" },
    "go":    { label: "围棋",    best: "max", unit: "目" }
};

// ============================================================================
// 站长校验（Firebase Auth）
// __idToken：站长登录后拿到的 ID token（用于删除等需要权限的操作）
// __owner  ：是否为站长站内标记
// firebase.initializeApp 只初始化一次，避免重复初始化报错。
// onAuthStateChanged 监听登录状态变化：是站长 → 显示面板、拉 ID token、初始化；
// 否则显示 gate 并提示「不是站长账号 / 请先登录」。
// ============================================================================

// ===== Firebase Auth：站长校验（删除凭据）=====
let __idToken = null;          // 站长登录后拿到的 ID token（用于删除操作鉴权）
let __owner = false;           // 是否为站长的布尔标记

if (!firebase.apps.length) { firebase.initializeApp(window.FIREBASE_CONFIG); } // 只初始化一次 Firebase

// 登录状态变化回调：决定放行还是拦截
firebase.auth().onAuthStateChanged(function(user){
    if (user && OWNER_EMAILS.indexOf(String(user.email || "").toLowerCase()) >= 0) {
        __owner = true;        // 是站长：解锁面板
        document.getElementById("gate").style.display = "none";   // 隐藏登录门
        document.getElementById("panel").style.display = "block"; // 显示管理面板
        user.getIdToken().then(function(t){ __idToken = t; });    // 取 ID token 供删除用
        init();                                                   // 初始化游戏下拉并加载数据
    } else {
        __owner = false;       // 非站长：保持锁定
        document.getElementById("gate").style.display = "block";   // 显示登录门
        document.getElementById("panel").style.display = "none";   // 隐藏面板
        var why = document.getElementById("gateWhy");
        why.textContent = user
            ? "当前登录：" + user.email + "（不是站长账号，无法进入）"  // 已登录但不是站长
            : "请先登录毛毛账号（邮箱/Google 登录均可）。";            // 完全未登录
    }
});

// ===== 初始化：游戏下拉 =====
function init(){
    var sel = document.getElementById("gameSel");
    sel.innerHTML = "";
    for (var id in GAMES){
        var opt = document.createElement("option");
        opt.value = id;
        opt.textContent = GAMES[id].label;
        sel.appendChild(opt);
    }
    loadAll();
    refreshVip();
}

// ===== 呼吸灯名单（special/vips）：读 / 加 / 删 / 存 =====
function refreshVip(){
    var box = document.getElementById("vipList");
    var msg = document.getElementById("vipMsg");
    if (!box) return;
    msg.textContent = "加载中..."; msg.className = "msg";
    fetch(FS_BASE + "/special/vips?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){
        var arr = (d.fields && d.fields.names && d.fields.names.arrayValue && d.fields.names.arrayValue.values) || [];
        renderVip(arr.map(function(v){ return v.stringValue; }).filter(Boolean));
    })
    .catch(function(){ renderVip([]); });
}
function renderVip(names){
    var box = document.getElementById("vipList");
    var msg = document.getElementById("vipMsg");
    box.innerHTML = "";
    msg.textContent = names.length ? ("当前名单：" + names.length + " 人") : "名单为空（默认只有「毛毛」会亮）";
    names.forEach(function(n){
        var row = document.createElement("div"); row.className = "rowsc"; row.style.borderBottom = "1px solid #eee";
        var span = document.createElement("span"); span.style.display = "inline-block"; span.style.minWidth = "120px"; span.textContent = n;
        var btn = document.createElement("button"); btn.className = "danger"; btn.textContent = "移除"; btn.style.marginLeft = "8px";
        btn.onclick = function(){ removeVip(n); };
        row.appendChild(span); row.appendChild(btn); box.appendChild(row);
    });
}
function readVipNames(){
    return fetch(FS_BASE + "/special/vips?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) return []; return r.json(); })
    .then(function(d){
        var arr = (d && d.fields && d.fields.names && d.fields.names.arrayValue && d.fields.names.arrayValue.values) || [];
        return arr.map(function(v){ return v.stringValue; }).filter(Boolean);
    })
    .catch(function(){ return []; });
}
function addVip(){
    var n = document.getElementById("vipName") ? document.getElementById("vipName").value.trim() : "";
    var msg = document.getElementById("vipMsg");
    if(!n){ msg.textContent = "请输入玩家名"; return; }
    readVipNames().then(function(names){
        if(names.indexOf(n) >= 0){ msg.textContent = "已在名单里"; return; }
        names.push(n);
        saveVip(names);
    });
}
function removeVip(n){
    readVipNames().then(function(names){
        var next = names.filter(function(x){ return x !== n; });
        saveVip(next);
    });
}
function saveVip(names){
    var msg = document.getElementById("vipMsg");
    if(!__owner){ msg.textContent = "仅站长可改"; return; }
    if(!__idToken){ msg.textContent = "获取登录令牌中，稍后再试"; return; }
    var body = { fields: { names: { arrayValue: { values: names.map(function(n){ return { stringValue: n }; }) } } } };
    // Firestore REST：PATCH = 更新或创建文档（无 PUT 方法）
    var url = FS_BASE + "/special/vips?updateMask.fieldPaths=names";
    fetch(url, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + __idToken },
        body: JSON.stringify(body)
    })
    .then(function(r){
        if(r.ok){ msg.textContent = "✅ 已保存"; refreshVip(); }
        else if(r.status === 401 || r.status === 403){ msg.textContent = "保存被拒：需先用站长账号登录，且 Firestore 规则已放行 special（见说明）"; }
        else { msg.textContent = "保存失败 HTTP " + r.status; }
    })
    .catch(function(e){ msg.textContent = "保存失败：" + (e.message || "网络错误"); });
}

// ===== 文档 ID 工具（与 report.js 一致：hex(游戏)+"_"+hex(名字)）=====
function hexStr(s){
    var bytes = new TextEncoder().encode(s);
    var h = "";
    for (var i = 0; i < bytes.length; i++) h += bytes[i].toString(16).padStart(2, "0");
    return h;
}
function docIdFor(game, name){ return hexStr(game) + "_" + hexStr(name); }

function decodeDocId(docId){
    var i = docId.indexOf("_");
    if (i < 0) return null;
    function h2s(h){
        if (h.length % 2) return "";
        var bytes = [];
        for (var j = 0; j < h.length; j += 2) bytes.push(parseInt(h.slice(j, j + 2), 16));
        try { return new TextDecoder().decode(new Uint8Array(bytes)); } catch(e){ return ""; }
    }
    var game = h2s(docId.slice(0, i));
    var name = h2s(docId.slice(i + 1));
    if (!game || !name) return null;
    return { game: game, name: name };
}

// ===== 小工具 =====
function setMsg(m, ok){
    var el = document.getElementById("msg");
    el.textContent = m;
    el.className = "msg " + (ok ? "ok" : "err");
}
function getSelGame(){ return document.getElementById("gameSel").value; }

// ===== 加载全部记录，按所选游戏渲染 =====
function loadAll(){
    var msg = document.getElementById("msg");
    var list = document.getElementById("list");
    msg.textContent = "加载中..."; msg.className = "msg";
    var game = getSelGame();

    fetch(FS_BASE + "/scores?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(data){
        var docs = data.documents || [];
        var entries = [];
        docs.forEach(function(d){
            var id = decodeDocId(d.name.split("/").pop());
            if (!id || id.game !== game) return;
            var f = d.fields || {};
            var score = f.score ? Number(f.score.integerValue || f.score.doubleValue) : NaN;
            var name = f.name ? f.name.stringValue : id.name;
            var ts = f.ts ? Number(f.ts.integerValue || 0) : 0;
            if (isNaN(score)) return;
            entries.push({ docId: d.name.split("/").pop(), name: name, score: score, ts: ts });
        });

        if (!entries.length){ msg.textContent = "该游戏暂无记录"; return; }

        var dir = GAMES[game].best === "min" ? 1 : -1;
        entries.sort(function(a,b){ return dir * (a.score - b.score); });

        list.innerHTML = "";
        entries.forEach(function(ent){
            var dt = ent.ts ? new Date(ent.ts) : null;
            var dtStr = dt ? (dt.getFullYear() + "-" + (dt.getMonth()+1) + "-" + dt.getDate()) : "";

            var row = document.createElement("div");
            row.className = "rowsc";

            var meta = document.createElement("span");
            meta.className = "rmeta";
            var b = document.createElement("b"); b.textContent = ent.name; meta.appendChild(b);
            meta.appendChild(document.createTextNode("　" + ent.score + " " + (GAMES[game].unit||"")));
            row.appendChild(meta);

            if (dtStr){ var sm = document.createElement("small"); sm.textContent = "(" + dtStr + ")"; row.appendChild(sm); }

            var btns = document.createElement("span");
            btns.className = "btns";
            var mb = document.createElement("button"); mb.className = "sec"; mb.textContent = "改";
            mb.dataset.act = "mod"; mb.dataset.name = ent.name; mb.dataset.score = ent.score;
            var db = document.createElement("button"); db.className = "danger"; db.textContent = "删";
            db.dataset.act = "del"; db.dataset.name = ent.name; db.dataset.docid = ent.docId;
            btns.appendChild(mb); btns.appendChild(db);
            row.appendChild(btns);

            list.appendChild(row);
        });
        msg.textContent = "共 " + entries.length + " 条";
    })
    .catch(function(e){ msg.textContent = "加载失败:" + e.message; msg.className = "msg err"; });
}

// 事件委托（改/删按钮），避免把玩家名拼进内联 onclick（XSS / 引号安全）
document.getElementById("list").addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    var act = b.dataset.act;
    if (act === "mod") modifyScore(b.dataset.name, Number(b.dataset.score));
    else if (act === "del") deleteOne(b.dataset.name, b.dataset.docid);
});

// ===== 添加 / 覆盖（公开写，与报告一致）=====
function addScore(){
    var name = document.getElementById("addName").value.trim();
    var score = parseInt(document.getElementById("addScore").value, 10);
    if (!name){ setMsg("请填玩家名", false); return; }
    if (isNaN(score)){ setMsg("请填有效分数", false); return; }
    var game = getSelGame();
    var id = docIdFor(game, name);
    var body = { fields: {
        game:  { stringValue: game },
        name:  { stringValue: name },
        score: { integerValue: String(score) },
        ts:    { integerValue: String(Date.now()) }
    }};
    var url = FS_BASE + "/scores?documentId=" + id + "&key=" + FS_KEY;
    fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
    .then(function(r){
        if (r.status === 200 || r.status === 201){ setMsg("✅ 已添加/覆盖：" + name + " = " + score, true); loadAll(); return; }
        if (r.status === 409){
            var patchUrl = FS_BASE + "/scores/" + id + "?key=" + FS_KEY +
                "&updateMask.fieldPaths=score&updateMask.fieldPaths=ts";
            return fetch(patchUrl, { method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fields: { score:{ integerValue:String(score) }, ts:{ integerValue:String(Date.now()) } } }) })
            .then(function(p){ if(p.ok){ setMsg("✅ 已覆盖：" + name + " = " + score, true); loadAll(); } else { setMsg("覆盖失败 HTTP " + p.status, false); } });
        }
        setMsg("添加失败 HTTP " + r.status, false);
    })
    .catch(function(e){ setMsg("添加失败:" + e.message, false); });
}

// ===== 修改分数（公开写）=====
function modifyScore(name, curScore){
    var now = prompt("修改「" + name + "」的分数（当前 " + curScore + "）：", curScore);
    if (now === null) return;
    now = parseInt(now, 10);
    if (isNaN(now)){ setMsg("分数无效", false); return; }
    var game = getSelGame();
    var id = docIdFor(game, name);
    var patchUrl = FS_BASE + "/scores/" + id + "?key=" + FS_KEY +
        "&updateMask.fieldPaths=score&updateMask.fieldPaths=ts";
    fetch(patchUrl, { method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fields: { score:{ integerValue:String(now) }, ts:{ integerValue:String(Date.now()) } } }) })
    .then(function(r){
        if (r.ok){ setMsg("✅ 已修改 " + name + " = " + now, true); loadAll(); }
        else { setMsg("修改失败 HTTP " + r.status, false); }
    })
    .catch(function(e){ setMsg("修改失败:" + e.message, false); });
}

// ===== 删除单条记录（需站长 token，规则里仅站长可删）=====
function deleteOne(name, docId){
    if (!__owner){ setMsg("仅站长可删", false); return; }
    if (!confirm("确定删除「" + name + "」的这条记录？")) return;
    if (!__idToken){ setMsg("正在获取登录令牌，请稍后再试", false); return; }
    var delUrl = FS_BASE + "/scores/" + docId;
    fetch(delUrl, { method:"DELETE", headers:{ "Authorization": "Bearer " + __idToken } })
    .then(function(r){
        if (r.ok){ setMsg("✅ 已删除：" + name, true); loadAll(); }
        else if (r.status === 403 || r.status === 401){ setMsg("删除被拒：需先在 Firestore 规则里放行站长删除（见说明），且用站长账号登录", false); }
        else { setMsg("删除失败 HTTP " + r.status, false); }
    })
    .catch(function(e){ setMsg("删除失败:" + e.message, false); });
}

// ===== 删除某玩家全部记录（跨所有游戏）=====
function deletePlayerAll(){
    var name = document.getElementById("delName").value.trim();
    if (!name){ setMsg("请填要删除的玩家名", false); return; }
    if (!__owner){ setMsg("仅站长可删", false); return; }
    if (!confirm("确定删除玩家「" + name + "」在所有游戏里的全部记录？此操作不可撤销！")) return;
    if (!__idToken){ setMsg("正在获取登录令牌，请稍后再试", false); return; }

    fetch(FS_BASE + "/scores?key=" + FS_KEY)
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(data){
        var docs = data.documents || [];
        var targets = [];
        docs.forEach(function(d){
            var f = d.fields || {};
            var pnm = f.name ? f.name.stringValue : (decodeDocId(d.name.split("/").pop()) || {}).name;
            if (pnm === name) targets.push(d.name.split("/").pop());
        });
        if (!targets.length){ setMsg("没有找到玩家「" + name + "」的记录", false); return; }

        var done = 0, failed = 0;
        function next(i){
            if (i >= targets.length){ setMsg("✅ 删除完成：成功 " + done + " 条" + (failed ? "，失败 " + failed + " 条" : ""), failed === 0); loadAll(); return; }
            var delUrl = FS_BASE + "/scores/" + targets[i].replace(/\//g, "_"); // docId 已 URL 安全
            fetch(delUrl, { method:"DELETE", headers:{ "Authorization": "Bearer " + __idToken } })
            .then(function(r){
                if (r.ok) done++; else failed++;
                next(i + 1);
            })
            .catch(function(){ failed++; next(i + 1); });
        }
        next(0);
    })
    .catch(function(e){ setMsg("读取失败:" + e.message, false); });
}
