<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>贪吃蛇小游戏</title>

<style>

body {

    text-align: center;

    font-family: Arial;

}

/* ===== 返回小游戏按钮 ===== */

.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}

/* ===== 游戏区域 ===== */

#game {

    width: 320px;

    height: 320px;

    margin: 20px auto;

    background: #222;

    display: grid;

    grid-template-columns: repeat(20, 1fr);

    border-radius: 20px;

    padding: 5px;

}

.cell {

    width: 100%;

    height: 100%;

    border: 1px solid #444;

    box-sizing: border-box;

}

.snake {

    background: #7bdc6c;

    border-radius: 5px;

}

/* 蛇头：用 outline 代替 border，不占格子空间，线就不会动 */

.snake-head {

    background: #5fdd3d;

    border-radius: 5px;

    outline: 2px solid #fff;

    outline-offset: -1px;

    box-shadow: 0 0 8px rgba(95, 221, 61, 0.8);

}

/* 蛇尾样式 */

.snake-tail {

    background: #5cb85c;

    border-radius: 5px;

}

.food {

    background: #ff6b6b;

    border-radius: 50%;

}

button {

    width: 60px;

    height: 60px;

    margin: 5px;

    border-radius: 20px;

    border: none;

    cursor: pointer;

    font-size: 25px;

}

.restart {

    width: 130px;

    font-size: 16px;

}

 /* ===== 深色模式 ===== */

body.dark-mode{

    background:#121212;

    color:white;

}

.dark-mode button{

    background:#333;

    color:white;

}

/* ===== 统计显示 ===== */
#stats{
    margin:15px auto;
    padding:10px;
    font-size:18px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    display:inline-block;
}
.dark-mode #stats{
    background:rgba(255,255,255,0.05);
}

</style>

</head>

<body>

<script>

// ===== 读取深色模式 =====

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<a href="../games.html" class="back-home">

🎮 返回小游戏

</a>

<h1>🐍 贪吃蛇</h1>

<p>

分数：<span id="score">0</span>

</p>

<!-- 统计显示区域（最高分） -->
<div id="stats"></div>
<!-- 重置统计按钮 -->
<button onclick="resetStats()" style="background:#ffcccb;color:#a00;width:auto;height:auto;padding:8px 16px;font-size:14px;">
🔄 重置最高分
</button>

<div id="game"></div>

<div>

<button onclick="changeDir('up')">⬆️</button>

<br>

<button onclick="changeDir('left')">⬅️</button>

<button onclick="changeDir('down')">⬇️</button>

<button onclick="changeDir('right')">➡️</button>

</div>

<button class="restart" onclick="restart()">

重新开始

</button>

<script src="report.js?v=2"></script>

<script>

// ============================================================
// 贪吃蛇游戏逻辑（速度 250ms + 最高分 + 头尾区分 + 撞身死亡）
// ============================================================

// ----- 全局变量 -----
let snake;          // 蛇身体坐标数组，索引0为头部
let food;           // 食物坐标 {x, y}
let direction;      // 当前移动方向
let score;          // 当前得分
let timer;          // 定时器句柄
const SPEED = 250;  // 移动间隔（毫秒）

// ----- 最高分统计（localStorage）-----
const HIGH_SCORE_KEY = 'snake_high_score';

function loadHighScore() {
    let val = localStorage.getItem(HIGH_SCORE_KEY);
    return val ? parseInt(val) : 0;
}

function saveHighScore(val) {
    localStorage.setItem(HIGH_SCORE_KEY, String(val));
}

function updateStatsDisplay() {
    let high = loadHighScore();
    document.getElementById('stats').innerHTML = `🏆 最高分：${high}`;
}

function resetStats() {
    if (confirm('确定要重置贪吃蛇的最高分吗？')) {
        saveHighScore(0);
        updateStatsDisplay();
        showToast('最高分已重置！');
    }
}

// ----- 开始游戏（初始化） -----
function startGame(){
    snake = [{x:10, y:10}];
    direction = "right";
    score = 0;
    createFood();
    update();
    updateStatsDisplay();
    clearInterval(timer);
    timer = setInterval(move, SPEED);
}

// ----- 绘制画面 -----
function update(){
    let game = document.getElementById("game");
    game.innerHTML = "";
    document.getElementById("score").innerHTML = score;

    for(let y=0; y<20; y++){
        for(let x=0; x<20; x++){
            let div = document.createElement("div");
            div.className = "cell";

            let isSnake = false;
            let isHead = false;
            let isTail = false;
            snake.forEach((part, index) => {
                if(part.x == x && part.y == y){
                    isSnake = true;
                    if(index === 0) isHead = true;
                    if(index === snake.length-1 && snake.length > 1) isTail = true;
                }
            });

            if(isSnake){
                if(isHead){
                    div.classList.add("snake-head");
                } else if(isTail){
                    div.classList.add("snake-tail");
                } else {
                    div.classList.add("snake");
                }
            }

            if(food.x == x && food.y == y){
                div.classList.add("food");
            }

            game.appendChild(div);
        }
    }
}

// ----- 蛇移动 -----
function move(){
    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if(direction == "up")    head.y--;
    if(direction == "down")  head.y++;
    if(direction == "left")  head.x--;
    if(direction == "right") head.x++;

    // 撞墙
    if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20){
        gameOver();
        return;
    }

    // 撞自身（除去尾部）
    let bodyWithoutTail = snake.slice(0, -1);
    for(let i=0; i<bodyWithoutTail.length; i++){
        let part = bodyWithoutTail[i];
        if(part.x == head.x && part.y == head.y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(head.x == food.x && head.y == food.y){
        score++;
        createFood();
    } else {
        snake.pop();
    }

    update();
}

// ----- 生成食物 -----
function createFood(){
    food = {
        x: Math.floor(Math.random() * 20),
        y: Math.floor(Math.random() * 20)
    };
}

// ----- 改变方向 -----
function changeDir(dir){
    if(
        (dir == "up"    && direction != "down")  ||
        (dir == "down"  && direction != "up")    ||
        (dir == "left"  && direction != "right") ||
        (dir == "right" && direction != "left")
    ){
        direction = dir;
    }
}

// ----- 键盘控制 -----
document.addEventListener("keydown", function(e){
    if(e.key == "ArrowUp")    changeDir("up");
    if(e.key == "ArrowDown")  changeDir("down");
    if(e.key == "ArrowLeft")  changeDir("left");
    if(e.key == "ArrowRight") changeDir("right");
});

// ----- 游戏结束 -----
function gameOver(){
    let high = loadHighScore();
    if (score > high) {
        saveHighScore(score);
        updateStatsDisplay();
        showToast(`🎉 新纪录！最高分：${score}`);
    } else {
        showToast(`🐍 游戏结束！分数：${score}`);
    }
    reportScore("snake", score);
    restart();
}

// ----- 重新开始 -----
function restart(){
    clearInterval(timer);
    startGame();
}

// ----- 启动 -----
startGame();

</script>

</body>

</html>
