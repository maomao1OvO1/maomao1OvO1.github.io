<!DOCTYPE html>
<html>

<!--
  文件：snake.html —— 贪吃蛇小游戏
  用途：经典的贪吃蛇玩法。20×20 的格子网格上，蛇按固定周期自动前进，
        玩家用方向键（或屏幕按钮）转向；吃到食物蛇身变长并加分，撞墙或撞到
        自己身体则游戏结束。带本地最高分统计（localStorage）与排行榜上报。
  核心逻辑（移动是核心）：
      - 蛇身用「坐标数组 snake 表示，索引 0 是蛇头」；每一帧基于当前方向
        推算新蛇头坐标，把新蛇头 unshift 到数组头。
      - 若新蛇头吃到食物：加分、重新生成食物、身体保留（相当于长一格）；
        否则把蛇尾 pop 掉，使整条蛇向前游动一格。
      - 死亡判定：新蛇头越出边界（撞墙），或与「除去蛇尾后」的任一身体坐标
        重合（撞自身）。撞尾不算死，因为尾巴此刻正在移走。
      - 方向防反转：changeDir 里禁止蛇直接掉头，防止穿身自杀。
  引用资源：
      - report.js?v=3：游戏结束调用 reportScore("snake", 分数) 上报排行榜。
  视觉特性：
      - 深色模式：读取 localStorage 的 theme，为 dark 时给 body 加 dark-mode 类；
      - 蛇头用 outline 高亮、蛇尾用稍深色区分，食物为圆形红点。
-->

<head>
<script src="/device-check.js?v=3"></script>

<meta charset="UTF-8">

<title>贪吃蛇小游戏</title>

<style>

/* 全局：页面内容居中，使用无衬线字体 */
body {

    text-align: center;

    font-family: Arial;

}

/* ===== 返回小游戏按钮 ===== */

/* 固定在右上角，链接回小游戏大厅 */
.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}

/* ===== 游戏区域 ===== */

/* 游戏画布：320px 见方，用 CSS Grid 切成 20×20 的格子（每列 1fr 均分 20 份） */
#game {

    width: 320px;

    height: 320px;

    margin: 20px auto;

    background: #222;

    display: grid;

    grid-template-columns: repeat(20, 1fr);

    border-radius: 20px;

    padding: 5px;

}

/* 单个格子：由 JS 动态创建，填满所在网格单元并描出细边框 */
.cell {

    width: 100%;

    height: 100%;

    border: 1px solid #444;

    box-sizing: border-box;

}

/* 蛇身主体：绿色圆角方块 */
.snake {

    background: #7bdc6c;

    border-radius: 5px;

}

/* 蛇头：用 outline 代替 border，不占格子空间，线就不会动 */

/* 蛇头样式：更亮的绿色 + 白色描边 + 发光，便于一眼认出方向 */
.snake-head {

    background: #5fdd3d;

    border-radius: 5px;

    outline: 2px solid #fff;

    outline-offset: -1px;

    box-shadow: 0 0 8px rgba(95, 221, 61, 0.8);

}

/* 蛇尾样式 */

/* 蛇尾用稍暗的绿色，与身体形成区分，观感更像一条蛇 */
.snake-tail {

    background: #5cb85c;

    border-radius: 5px;

}

/* 食物：红色圆点 */
.food {

    background: #ff6b6b;

    border-radius: 50%;

}

/* 方向控制按钮：方块大按钮，便于手机点按 */
button {

    width: 60px;

    height: 60px;

    margin: 5px;

    border-radius: 20px;

    border: none;

    cursor: pointer;

    font-size: 25px;

}

/* 「重新开始」按钮：更宽、字号较小 */
.restart {

    width: 130px;

    font-size: 16px;

}

 /* ===== 深色模式 ===== */

/* 深色模式：整页背景变深、文字变白 */
body.dark-mode{

    background:#121212;

    color:white;

}

/* 深色模式下：按钮深灰底白字 */
.dark-mode button{

    background:#333;

    color:white;

}

/* ===== 统计显示 ===== */

/* 统计条：居中、半透明背景，用来显示最高分 */
#stats{
    margin:15px auto;
    padding:10px;
    font-size:18px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    display:inline-block;
}

/* 深色模式下统计条背景更透明，弱化对比 */
.dark-mode #stats{
    background:rgba(255,255,255,0.05);
}

</style>

</head>

<body>

<script>

// ===== 读取深色模式 =====

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<a href="../games.html" class="back-home">

🎮 返回小游戏

</a>

<h1>🐍 贪吃蛇</h1>

<p>

分数：<span id="score">0</span>

</p>

<!-- 统计显示区域（最高分） -->
<div id="stats"></div>
<!-- 重置统计按钮 -->
<button onclick="resetStats()" style="background:#ffcccb;color:#a00;width:auto;height:auto;padding:8px 16px;font-size:14px;">
🔄 重置最高分
</button>

<div id="game"></div>

<div>

<button onclick="changeDir('up')">⬆️</button>

<br>

<button onclick="changeDir('left')">⬅️</button>

<button onclick="changeDir('down')">⬇️</button>

<button onclick="changeDir('right')">➡️</button>

</div>

<button class="restart" onclick="restart()">

重新开始

</button>

<script src="report.js?v=3"></script>

<script>

// ============================================================
// 贪吃蛇游戏逻辑（速度 250ms + 最高分 + 头尾区分 + 撞身死亡）
// ============================================================

// ----- 全局变量 -----
let snake;          // 蛇身体坐标数组，索引0为头部
let food;           // 食物坐标 {x, y}
let direction;      // 当前移动方向
let score;          // 当前得分
let timer;          // 定时器句柄
const SPEED = 250;  // 移动间隔（毫秒）

// ----- 最高分统计（localStorage）-----
const HIGH_SCORE_KEY = 'snake_high_score';

function loadHighScore() {
    let val = localStorage.getItem(HIGH_SCORE_KEY);
    return val ? parseInt(val) : 0;
}

function saveHighScore(val) {
    localStorage.setItem(HIGH_SCORE_KEY, String(val));
}

function updateStatsDisplay() {
    let high = loadHighScore();
    document.getElementById('stats').innerHTML = `🏆 最高分：${high}`;
}

function resetStats() {
    if (confirm('确定要重置贪吃蛇的最高分吗？')) {
        saveHighScore(0);
        updateStatsDisplay();
        alert('最高分已重置！');
    }
}

// ----- 开始游戏（初始化） -----
function startGame(){
    snake = [{x:10, y:10}];
    direction = "right";
    score = 0;
    createFood();
    update();
    updateStatsDisplay();
    clearInterval(timer);
    timer = setInterval(move, SPEED);
}

// ----- 绘制画面 -----
function update(){
    let game = document.getElementById("game");
    game.innerHTML = "";
    document.getElementById("score").innerHTML = score;

    for(let y=0; y<20; y++){
        for(let x=0; x<20; x++){
            let div = document.createElement("div");
            div.className = "cell";

            let isSnake = false;
            let isHead = false;
            let isTail = false;
            snake.forEach((part, index) => {
                if(part.x == x && part.y == y){
                    isSnake = true;
                    if(index === 0) isHead = true;
                    if(index === snake.length-1 && snake.length > 1) isTail = true;
                }
            });

            if(isSnake){
                if(isHead){
                    div.classList.add("snake-head");
                } else if(isTail){
                    div.classList.add("snake-tail");
                } else {
                    div.classList.add("snake");
                }
            }

            if(food.x == x && food.y == y){
                div.classList.add("food");
            }

            game.appendChild(div);
        }
    }
}

// ----- 蛇移动 -----
function move(){
    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if(direction == "up")    head.y--;
    if(direction == "down")  head.y++;
    if(direction == "left")  head.x--;
    if(direction == "right") head.x++;

    // 撞墙
    if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20){
        gameOver();
        return;
    }

    // 撞自身（除去尾部）
    let bodyWithoutTail = snake.slice(0, -1);
    for(let i=0; i<bodyWithoutTail.length; i++){
        let part = bodyWithoutTail[i];
        if(part.x == head.x && part.y == head.y){
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if(head.x == food.x && head.y == food.y){
        score++;
        createFood();
    } else {
        snake.pop();
    }

    update();
}

// ----- 生成食物 -----
function createFood(){
    food = {
        x: Math.floor(Math.random() * 20),
        y: Math.floor(Math.random() * 20)
    };
}

// ----- 改变方向 -----
function changeDir(dir){
    if(
        (dir == "up"    && direction != "down")  ||
        (dir == "down"  && direction != "up")    ||
        (dir == "left"  && direction != "right") ||
        (dir == "right" && direction != "left")
    ){
        direction = dir;
    }
}

// ----- 键盘控制 -----
document.addEventListener("keydown", function(e){
    if(e.key == "ArrowUp")    changeDir("up");
    if(e.key == "ArrowDown")  changeDir("down");
    if(e.key == "ArrowLeft")  changeDir("left");
    if(e.key == "ArrowRight") changeDir("right");
});

// ----- 游戏结束 -----
function gameOver(){
    let high = loadHighScore();
    if (score > high) {
        saveHighScore(score);
        updateStatsDisplay();
        alert(`🎉 新纪录！最高分：${score}`);
    } else {
        alert(`🐍 游戏结束！分数：${score}`);
    }
    reportScore("snake", score);
    restart();
}

// ----- 重新开始 -----
function restart(){
    clearInterval(timer);
    startGame();
}

// ----- 启动 -----
startGame();

</script>

</body>

</html>
