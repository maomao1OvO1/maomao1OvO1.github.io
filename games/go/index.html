<!DOCTYPE html>
<html>

<head>
<script src="/device-check.js?v=14"></script>

<meta charset="UTF-8">

<title>围棋</title>


<style>

body {

    text-align: center;

    font-family: Arial;

    user-select: none;

}


/* ===== 返回小游戏按钮 ===== */

.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

    z-index: 10;

}



/* ===== 棋盘 ===== */

.board {

    margin:40px auto;

    width:360px;

    height:360px;

    background:#dca85d;

    display:grid;

    grid-template-columns:repeat(19,1fr);

    grid-template-rows:repeat(19,1fr);

    padding:10px;

    box-sizing: border-box;

}



.cell {

    border:1px solid #333;

    position:relative;

}



/* ===== 棋子 ===== */

.stone {

    width:18px;

    height:18px;

    border-radius:50%;

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

}



.black {

    background:black;

}



.white {

    background:white;

    border:1px solid #555;

}



/* ===== 按钮 ===== */

button {

    margin-top:15px;

    padding:10px 20px;

    border-radius:20px;

    border:none;

    cursor:pointer;

}



.mode-buttons button{

    margin:10px 5px;

}



/* ===== 统计显示（透明） ===== */

#stats{

    display: block;

    width: 100%;

    text-align: center;

    clear: both;

    margin: 15px auto;

    padding: 10px;

    font-size: 18px;

    background: transparent;

    border-radius: 10px;

    box-sizing: border-box;

}



/* ===== 深色模式 ===== */

body.dark-mode{

    background:#121212;

    color:white;

}



.dark-mode button{

    background:#333;

    color:white;

}


</style>


</head>


<body>

<h1>⚫⚪ 围棋</h1>


<p>
黑白棋子对战
</p>



<!-- 模式选择按钮 -->

<div class="mode-buttons">

<button onclick="startGame('双人模式')">
👥 双人模式
</button>


<button onclick="startGame('普通AI')">
🤖 普通AI
</button>


<button onclick="startGame('最强AI')">
🔥 最强AI
</button>

AI先手：关闭
</button>

</div>

<p id="status">等待开始</p>


<!-- 统计显示区域 -->

<div id="stats"></div>

<!-- 重置统计按钮 -->

<button onclick="resetStats()" style="background:#ffcccb;color:#a00;width:auto;height:auto;padding:8px 16px;font-size:14px;">

🔄 重置统计

</button>


<div class="board"></div>



<button onclick="restartGame()">
🔄 重新开始
</button>

<button onclick="endGame()">
🏳️ 结束棋局
</button>

<script>


let board=document.querySelector(".board");

let kataWorker = null;

let aiThinking = false;


// ============================================================

// 统计功能（按模式独立）

// ============================================================

const STATS_KEY = 'go_stats_v2';

function defaultStats() {

    return {

        player: { blackWins: 0, whiteWins: 0 }, // 双人

        ai:     { blackWins: 0, whiteWins: 0 }, // 普通AI

        pro:    { blackWins: 0, whiteWins: 0 }  // 最强AI

    };

}

function loadStats() {

    let data = localStorage.getItem(STATS_KEY);

    if (data) {

        try {

            let parsed = JSON.parse(data);

            let def = defaultStats();

            for (let m in def) {

                if (!parsed[m]) parsed[m] = def[m];

                if (typeof parsed[m].blackWins !== 'number') parsed[m].blackWins = 0;

                if (typeof parsed[m].whiteWins !== 'number') parsed[m].whiteWins = 0;

            }

            return parsed;

        } catch(e) {

            return defaultStats();

        }

    }

    return defaultStats();

}

function saveStats(stats) {

    localStorage.setItem(STATS_KEY, JSON.stringify(stats));

}

function updateStatsDisplay() {

    let stats = loadStats();

    let modeKey = modeMap(mode);

    let m = stats[modeKey] || { blackWins: 0, whiteWins: 0 };

    let modeName = { '双人模式':'双人', '普通AI':'普通AI', '最强AI':'最强AI' }[mode] || mode;

    document.getElementById('stats').innerHTML =

        `${modeName}模式：⚫黑胜 ${m.blackWins} &nbsp;|&nbsp; ⚪白胜 ${m.whiteWins}`;

}

function modeMap(m) {

    if (m === '双人模式') return 'player';

    if (m === '普通AI') return 'ai';

    if (m === '最强AI') return 'pro';

    return 'player';

}

function resetStats() {

    if (confirm('确定重置围棋所有模式的胜场统计吗？')) {

        saveStats(defaultStats());

        updateStatsDisplay();

        alert('统计已重置！');

    }

}

function recordWin(color) {

    // color: 1=黑胜, 2=白胜

    let stats = loadStats();

    let modeKey = modeMap(mode);

    if (!stats[modeKey]) stats[modeKey] = { blackWins: 0, whiteWins: 0 };

    if (color === 1) stats[modeKey].blackWins++;

    else if (color === 2) stats[modeKey].whiteWins++;

    saveStats(stats);

updateStatsDisplay();


fetch("https://maomao-server.onrender.com/win",{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({

        name:localStorage.getItem("playerName") || "游客",

        game:"围棋"

    })

});


}

// ============================================================

// 围棋核心数据

// ============================================================

let boardData=[];

let backupBoard=[];

let previousBoard=[];

let boardHistory=[];

let koPosition=null;

let moveHistory=[];

// 创建19×19空棋盘

for(let i=0;i<19;i++){

    boardData[i]=[];

    for(let j=0;j<19;j++){

        boardData[i][j]=0;

    }

}



let cells=[];

let turn="black";

let playerColor = "black"; // 玩家执黑或白（非双人模式）

let index=0;



for(let i=0;i<19*19;i++){

    let x=Math.floor(i/19);

    let y=i%19;


    let cell=document.createElement("div");

    cell.className="cell";

    cell.onclick=function(){

    // ---- 新增：非双人模式下，只有玩家回合才能点击 ----
    if (mode !== "双人模式" && turn !== playerColor) {
        return;
    }

    if(mode=="双人模式"){

        playMove(x,y);

    }

    else if(mode=="普通AI"){

    let before=copyBoard();

    playMove(x,y);


    // 检查玩家是否真的落子成功
    if(sameBoard(before,boardData)){

        return;

    }


    aiThinking=true;

     document.getElementById("status").innerHTML =
"🤖 普通AI思考中...";

    setTimeout(()=>{

        simpleAI();

        aiThinking=false;

    },500);

}

    else if(mode=="最强AI"){

    if(aiThinking){
        return;
    }

    playMove(x,y);

    aiThinking=true;

    setTimeout(()=>{

        askKataGo();

    },500);


    setTimeout(()=>{

        if(aiThinking){

            aiThinking=false;

            document.getElementById("status").innerHTML=
            "⚠️ KataGo超时";

        }

    },8000);

}

};


    cells.push(cell);

    board.appendChild(cell);

}

function askKataGo(){

    if(!kataWorker){

        document.getElementById("status").innerHTML =
        "KataGo还未加载";

        return;

    }

    document.getElementById("status").innerHTML =
    "🤖 KataGo AI思考中...";

    kataWorker.postMessage({

        type:"katago:analyze",

        id:Date.now(),

        board:boardData.map(row=>
            row.map(v=>{
                if(v==1) return "black";
                if(v==2) return "white";
                return null;
            })
        ),

        currentPlayer:"black",

        moveHistory:moveHistory,

        komi:7.5,

        rules:{
            koRule:"simple",
            scoringRule:"area",
            taxRule:"none",
            multiStoneSuicideLegal:false
        },

        modelUrl:
        "/games/go/katago-test/models/katago-small.bin.gz",

        visits:1000,
        maxTimeMs:5000

    });

}

// 模式选择

let mode="双人模式"; // 默认

// AI先手
let aiFirst=false;

let gameOver=false;

let passCount=0;

let confirmScore=false;

function aiPlayMove(x,y){

    console.log("AI准备落子",x,y);

    if(boardData[x][y]!=0){

        document.getElementById("status").innerHTML =
        "AI位置被占";

        aiThinking=false;

        return;

    }


    playMove(x,y);


    aiThinking=false;


    document.getElementById("status").innerHTML =
    "白棋回合";

}

function loadKataGo(){

    if(kataWorker){

        document.getElementById("status").innerHTML =
        "🔥 KataGo已加载";

        return;

    }


    kataWorker = new Worker(
        "/games/go/katago-test/assets/worker-DzsLrmAN.js",
        {type:"module"}
    );


    kataWorker.onmessage = function(e){



document.getElementById("status").innerHTML =
        "收到消息：" + e.data.type;



        // AI初始化完成

        if(e.data.type=="katago:init_result"){


            if(e.data.ok){

                document.getElementById("status").innerHTML =
                "🔥 KataGo就绪";

            }
            else{

                document.getElementById("status").innerHTML =
                "KataGo加载失败";

            }

        }



        // AI返回棋步

        if(e.data.type=="katago:analyze_result"){


            if(e.data.analysis){


                let move=e.data.analysis.moves[0];


                if(move){


                    aiThinking=false;


                    document.getElementById("status").innerHTML =
                    "AI落子："+move.x+","+move.y;


                    aiPlayMove(
                        move.y,
                        move.x
                    );


                }

            }


        }


    };



    kataWorker.postMessage({

        type:"katago:init",

        modelUrl:
        "/games/go/katago-test/models/katago-small.bin.gz"

    });


}

function toggleAIFirst(btn){

    aiFirst = !aiFirst;

    btn.innerHTML = aiFirst ? "AI先手：开启" : "AI先手：关闭";

    restartGame();

}

function startGame(selectMode){

    mode=selectMode;


    if(mode=="双人模式"){

        document.getElementById("status").innerHTML =
        "当前模式：双人模式，黑棋回合";

    }


    else if(mode=="普通AI"){

        document.getElementById("status").innerHTML =
        "当前模式：普通AI";

    }


    else if(mode=="最强AI"){

        document.getElementById("status").innerHTML =
        "🔥 KataGo准备中...";

        loadKataGo();

    }


    updateStatsDisplay();

    restartGame(); // 重置棋局

}

function endGame(){


    passCount++;


    if(passCount<2){

        document.getElementById("status").innerHTML=
        "🏳️ 一方停手，等待另一方确认";

        return;

    }

    gameOver=true;

    // 清除死棋

let deadGroups=findDeadGroups();


for(let group of deadGroups){

    removeGroup(group);

}

    let score=calculateScore();


    let result="";

    let winner = null; // 1=黑, 2=白


    if(score.black>score.white){

        result=
        "⚫ 黑胜 " +
        (score.black-score.white).toFixed(1) +
        " 目";

        winner = 1;

    }

    else if(score.white>score.black){

        result=
        "⚪ 白胜 " +
        (score.white-score.black).toFixed(1) +
        " 目";

        winner = 2;

    }

    else{

        result="和棋";

    }



    reportScore("go", score.black);

    document.getElementById("status").innerHTML=
    "🏳️ 棋局结束<br>" +
    "黑：" + score.black +
    " 白：" + score.white +
    "<br>" +
    result;


    if (winner) {

        recordWin(winner);

    }

}

function restartGame(){

    for(let i=0;i<19;i++){

        for(let j=0;j<19;j++){

            boardData[i][j]=0;

        }

    }


    turn="black";

    passCount=0;

    gameOver=false;

    confirmScore=false;

    koPosition=null;

    previousBoard=[];

    backupBoard=[];

    boardHistory=[];

    moveHistory=[];

    drawBoard();


    // ---- 新增：设置玩家颜色 ----
    if (mode !== "双人模式") {
        if (aiFirst) {
            playerColor = "white";  // AI先手黑，玩家白
        } else {
            playerColor = "black";  // 玩家先手黑
        }
    } else {
        playerColor = null; // 双人模式不限
    }

    document.getElementById("status").innerHTML=
    "等待开始";


    updateStatsDisplay();


    // ===== AI先手 =====

    if(aiFirst && mode!="双人模式"){

        document.getElementById("status").innerHTML =
        "🤖 AI先手思考中...";


        setTimeout(()=>{

            if(mode=="普通AI"){

                simpleAI();

            }


            if(mode=="最强AI"){

                if(kataWorker){

                    askKataGo();

                }

                else{

                    loadKataGo();

                    setTimeout(()=>{

                        askKataGo();

                    },1500);

                }

            }

        },500);

    }

}

function hasLiberty(x,y){

    let color=boardData[x][y];


    if(color==0){

        return false;

    }



    let directions=[

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];



    for(let d of directions){

        let nx=x+d[0];

        let ny=y+d[1];


        if(nx>=0 && nx<19 && ny>=0 && ny<19){

            if(boardData[nx][ny]==0){

                return true;

            }

        }

    }


    return false;

}

function copyBoard(){

    let copy=[];


    for(let i=0;i<19;i++){

        copy[i]=[];

        for(let j=0;j<19;j++){

            copy[i][j]=boardData[i][j];

        }

    }


    return copy;

}

function sameBoard(a,b){

    for(let i=0;i<19;i++){

        for(let j=0;j<19;j++){

            if(a[i][j]!=b[i][j]){

                return false;

            }

        }

    }


    return true;

}

function getGroup(x,y){

    let color=boardData[x][y];

    let group=[];

    let visited={};


    function dfs(a,b){

        let key=a+","+b;


        if(visited[key]) return;


        visited[key]=true;



        if(boardData[a][b]!=color) return;


        group.push([a,b]);



        let directions=[

            [1,0],
            [-1,0],
            [0,1],
            [0,-1]

        ];



        for(let d of directions){

            let nx=a+d[0];

            let ny=b+d[1];


            if(nx>=0 && nx<19 && ny>=0 && ny<19){

                dfs(nx,ny);

            }

        }

    }



    dfs(x,y);


    return group;

}

function getAllGroups(){

    let groups=[];

    let visited=[];


    for(let i=0;i<19;i++){

        visited[i]=[];

        for(let j=0;j<19;j++){

            visited[i][j]=false;

        }

    }



    for(let x=0;x<19;x++){

        for(let y=0;y<19;y++){


            if(boardData[x][y]!=0 && !visited[x][y]){


                let group=getGroup(x,y);


                for(let stone of group){

                    visited[stone[0]][stone[1]]=true;

                }


                groups.push(group);


            }


        }

    }


    return groups;

}

function countLiberties(group){

    let liberties={};


    let directions=[

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];



    for(let stone of group){

        let x=stone[0];

        let y=stone[1];


        for(let d of directions){

            let nx=x+d[0];

            let ny=y+d[1];


            if(nx>=0 && nx<19 && ny>=0 && ny<19){


                if(boardData[nx][ny]==0){

                    liberties[nx+","+ny]=true;

                }

            }

        }

    }


    return Object.keys(liberties).length;

}

function hasSharedLiberty(group){

    let liberties={};


    let directions=[

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];


    for(let stone of group){

        let x=stone[0];

        let y=stone[1];


        for(let d of directions){

            let nx=x+d[0];

            let ny=y+d[1];


            if(nx>=0 && nx<19 && ny>=0 && ny<19){

                if(boardData[nx][ny]==0){

                    liberties[nx+","+ny]=true;

                }

            }

        }

    }


    return Object.keys(liberties).length;

}

function isSekiGroup(group){

    let liberties=countLiberties(group);


    // 有气才可能双活

    if(liberties==0){

        return false;

    }


    // 有两个真眼直接算活

    if(countEyes(group)>=2){

        return false;

    }


    return true;

}

function countEyes(group){

    let eyes=0;

    let checked={};


    let color=groupColor(group);


    for(let stone of group){

        let x=stone[0];

        let y=stone[1];


        let directions=[

            [1,0],
            [-1,0],
            [0,1],
            [0,-1]

        ];


        for(let d of directions){

            let nx=x+d[0];

            let ny=y+d[1];


            if(nx>=0 && nx<19 && ny>=0 && ny<19){


                if(boardData[nx][ny]==0){


                    let key=nx+","+ny;


                    if(!checked[key]){


                        checked[key]=true;


                        if(isRealEye(nx,ny,color)){

                            eyes++;

                        }


                    }

                }

            }

        }

    }


    return eyes;

}

function isRealEye(x,y,color){

    if(boardData[x][y]!=0){

        return false;

    }


    let directions=[
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];


    for(let d of directions){

        let nx=x+d[0];

        let ny=y+d[1];


        if(nx>=0 && nx<19 && ny>=0 && ny<19){

            if(boardData[nx][ny]!=color){

                return false;

            }

        }

    }


    return true;

}

function groupColor(group){

    return boardData[group[0][0]][group[0][1]];

}

function getTerritory(){

    let territory=[];

    let visited=[];


    for(let i=0;i<19;i++){

        visited[i]=[];

        for(let j=0;j<19;j++){

            visited[i][j]=false;

        }

    }



    for(let x=0;x<19;x++){

        for(let y=0;y<19;y++){


            if(boardData[x][y]==0 && !visited[x][y]){


                let area=[];

                let borders={};


                let queue=[[x,y]];


                visited[x][y]=true;



                while(queue.length){


                    let p=queue.shift();


                    area.push(p);


                    let directions=[

                        [1,0],
                        [-1,0],
                        [0,1],
                        [0,-1]

                    ];



                    for(let d of directions){


                        let nx=p[0]+d[0];

                        let ny=p[1]+d[1];



                        if(nx>=0 && nx<19 && ny>=0 && ny<19){


                            if(boardData[nx][ny]==0 && !visited[nx][ny]){


                                visited[nx][ny]=true;

                                queue.push([nx,ny]);


                            }


                            else if(boardData[nx][ny]!=0){


                                borders[boardData[nx][ny]]=true;


                            }


                        }


                    }


                }



                territory.push({

                    area:area,

                    borders:borders

                });


            }

        }

    }


    return territory;

}

function calculateScore(){

    let blackScore=0;

    let whiteScore=7.5;   // 白贴目



    // 计算棋子数量

    for(let x=0;x<19;x++){

        for(let y=0;y<19;y++){


            if(boardData[x][y]==1){

                blackScore++;

            }


            if(boardData[x][y]==2){

                whiteScore++;

            }

        }

    }



    // 计算地盘

    let territories=getTerritory();



    for(let area of territories){


        let keys=Object.keys(area.borders);



        if(keys.length==1){


            if(keys[0]=="1"){

                blackScore+=area.area.length;

            }


            if(keys[0]=="2"){

                whiteScore+=area.area.length;

            }


        }


    }



    return {

        black:blackScore,

        white:whiteScore

    };


}

function findDeadGroups(){

    let dead=[];


    let groups=getAllGroups();


    for(let group of groups){


        let liberties=countLiberties(group);

        let eyes=countEyes(group);



        // 完全无气，直接死

        if(liberties==0){

            dead.push(group);

            continue;

        }



        // 没有两个真眼

if(eyes<2){

    // 双活棋块不删除

    if(!isSekiGroup(group)){

        dead.push(group);

    }

}


    }


    return dead;

}

function simpleAI(){

    let empty=[];


    for(let x=0;x<19;x++){

        for(let y=0;y<19;y++){

            if(boardData[x][y]==0){

                empty.push([x,y]);

            }

        }

    }


    if(empty.length==0) return;


    // 靠近中心

    empty.sort((a,b)=>{

        let da=Math.abs(a[0]-9)+Math.abs(a[1]-9);
        let db=Math.abs(b[0]-9)+Math.abs(b[1]-9);

        return da-db;

    });


    let move=empty[
        Math.floor(
            Math.random()*Math.min(10,empty.length)
        )
    ];


    playMove(move[0],move[1]);

}


// ===== 核心修复：无气落子严格检查 =====

function playMove(x, y) {

    // 游戏已结束或落子位置已有棋子
    if (gameOver) return;
    if (boardData[x][y] !== 0) return;

    // 打劫检查
    if (koPosition && koPosition[0] === x && koPosition[1] === y) {
        document.getElementById("status").innerHTML = "❌ 打劫，不能立即回吃";
        return;
    }

    // 备份棋盘
    let backup = copyBoard();
    let color = turn === "black" ? 1 : 2;

    // 落子
    boardData[x][y] = color;

    // 提掉对方无气棋子
    let enemy = color === 1 ? 2 : 1;
    let dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    let captured = false;

    for (let d of dirs) {
        let nx = x + d[0];
        let ny = y + d[1];
        if (nx >= 0 && nx < 19 && ny >= 0 && ny < 19) {
            if (boardData[nx][ny] === enemy) {
                let group = getGroup(nx, ny);
                let alive = false;
                for (let stone of group) {
                    if (hasLiberty(stone[0], stone[1])) {
                        alive = true;
                        break;
                    }
                }
                if (!alive) {
                    removeGroup(group);
                    captured = true;
                }
            }
        }
    }

    // 检查自己是否有气（重点）
    let selfGroup = getGroup(x, y);
    let selfHasLiberty = false;
    for (let stone of selfGroup) {
        if (hasLiberty(stone[0], stone[1])) {
            selfHasLiberty = true;
            break;
        }
    }

    // 如果自己无气，非法落子，恢复棋盘并返回（不切换回合）
    if (!selfHasLiberty) {
        boardData = backup;
        drawBoard();
        document.getElementById("status").innerHTML = "❌ 无气，不能落子";
        return;
    }

    // 合法落子，更新棋盘（已经放置）
    drawBoard();

    // 切换回合
    if (turn === "black") {
        turn = "white";
        document.getElementById("status").innerHTML = "白棋回合";
    } else {
        turn = "black";
        document.getElementById("status").innerHTML = "黑棋回合";
    }

    // 记录历史（用于劫和全局同形，这里省略完整劫检查）
    boardHistory.push(copyBoard());
    moveHistory.push({ x: x, y: y, color: color });

    // 如果提子产生了劫点（单颗提子），记录
    // 但劫点已经在 removeGroup 中设置，但我们的 removeGroup 可能在提子时设置，这里不再额外处理
}

function removeGroup(group) {
    for (let stone of group) {
        let x = stone[0];
        let y = stone[1];
        boardData[x][y] = 0;
    }
    if (group.length === 1) {
        koPosition = [group[0][0], group[0][1]];
    }
}


function drawBoard(){

    for(let i=0;i<19;i++){

        for(let j=0;j<19;j++){

            let index=i*19+j;

            cells[index].innerHTML="";


            if(boardData[i][j]==1){

                let stone=document.createElement("div");

                stone.className="stone black";

                cells[index].appendChild(stone);

            }


            if(boardData[i][j]==2){

                let stone=document.createElement("div");

                stone.className="stone white";

                cells[index].appendChild(stone);

            }

        }

    }

}

// ===== 启动时默认双人模式并显示统计 =====

startGame('双人模式');

</script>
