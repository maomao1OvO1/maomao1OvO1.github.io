<!--
文件：games/tts.html
用途：毛毛站点「声库实验室」页——本地女声合成（仅站长可用）。
核心逻辑：
  1) Firebase Auth 判断当前登录者邮箱是否等于站长邮箱（混淆存储的 OWNER_EMAIL，与 users.html 一致）；
  2) 匹配则显示面板；否则显示引导层；
  3) 面板文字/语速/音量提交到「手机本机」的本地合成服务 http://127.0.0.1:3081/api/synth
     （云端合成 + 服务端验证站长账号 = 账号绑定，换设备登录同一账号同样可用）；合成 mp3 点下载保存。
安全注意：站长邮箱混淆处理；本地服务端口仅本机可达。
-->
<!DOCTYPE html>
<html>

<head>
<script src="/device-check.js?v=18"></script>
<script src="/anti-bot.js?v=4"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声库实验室 · 毛毛</title>
<style>
body { text-align:center; font-family:Arial, sans-serif; background:#f5f5f5; margin:0; padding:15px; }
h1 { color:#7C5CBF; }
.gate { max-width:480px; margin:40px auto; background:#fff; padding:25px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); }
.box { max-width:700px; margin:10px auto; background:#fff; padding:15px 18px; border-radius:15px; box-shadow:0 3px 12px rgba(0,0,0,0.12); text-align:left; }
button { padding:11px 16px; border:none; border-radius:10px; font-size:16px; margin:6px 4px; background:#7C5CBF; color:#fff; cursor:pointer; }
button:hover { background:#6543a5; }
button:disabled { background:#b9a7e0; cursor:wait; }
.msg { color:#666; margin:6px 0; font-size:14px; }
.msg.ok { color:#2e8b57; }
.msg.err { color:#c94f4f; }
textarea { width:100%; box-sizing:border-box; min-height:110px; font-size:16px; border:1px solid #d9d0ee; border-radius:10px; padding:10px; background:#faf8ff; color:#333; resize:vertical; }
.ctl { display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap; }
.ctl label { font-size:14px; color:#555; min-width:52px; }
.ctl input[type=range] { flex:1; min-width:150px; accent-color:#7C5CBF; }
.ctl b { min-width:44px; text-align:right; font-size:14px; color:#6543a5; }
audio { width:100%; margin-top:8px; }
.fileinfo { font-size:13px; color:#777; word-break:break-all; }
.back-home { position:fixed; top:20px; right:20px; background:#e5dcff; color:#6543a5; padding:10px 15px; border-radius:20px; text-decoration:none; font-size:16px; z-index:9; }
.note { font-size:12px; color:#999; margin-top:6px; }
body.dark-mode { background:#121212; color:#fff; }
.dark-mode .box, .dark-mode .gate { background:#1e1e1e; color:#eee; }
.dark-mode textarea { background:#2a2a2a; color:#eee; border-color:#444; }
.dark-mode .ctl label { color:#bbb; }
.dark-mode .fileinfo { color:#999; }
.dark-mode .note { color:#888; }
.dark-mode .back-home { background:#333; color:#bb9cff; }
#progWrap .msgi, #progTxt { margin-top:4px; }
.dark-mode #progWrap > div > div { background:#333 !important; }
</style>
</head>

<body>

<script>
if(localStorage.getItem("theme") === "dark"){ document.body.classList.add("dark-mode"); }
</script>

<h1>🎙️ 声库实验室</h1>

<div id="gate" class="gate">
    <p>⚠️ 这个页面只有<b>站长（毛毛账号）</b>能用。</p>
    <p id="gateWhy">请先登录毛毛账号。</p>
    <a href="../index.html" class="back-home">🏠 回主页</a>
</div>

<div id="panel" style="display:none;">
    <div class="box">
        <div class="msg" id="hint">✏️ 输入文字（不限字数，长文自动分段合成），调好语速/音量/音色，点「合成」——先试听，满意再下载。</div>

        <textarea id="text" placeholder="例如：大家好，我是毛毛的声音，欢迎来到我的声库实验室。"></textarea>

        <div class="ctl">
            <label>语速</label>
            <input type="range" id="speed" min="0.6" max="1.6" step="0.05" value="1.0">
            <b id="speedV">1.00×</b>
        </div>
        <div class="ctl">
            <label>音量</label>
            <input type="range" id="volume" min="1" max="8" step="0.5" value="4">
            <b id="volumeV">4.0×</b>
        </div>
        <div class="ctl">
            <label>🎚️ 音色</label>
            <input type="range" id="pitch" min="0.75" max="1.35" step="0.05" value="1.0">
            <b id="pitchV">原声</b>
            <button id="pLow" style="padding:5px 8px;font-size:12px;">低沉</button>
            <button id="pNor" style="padding:5px 8px;font-size:12px;">原声</button>
            <button id="pHigh" style="padding:5px 8px;font-size:12px;">清脆</button>
        </div>
        <div class="msg" id="eta">预计生成时间：—</div>

        <button id="go">⚡ 合成并试听</button>
        <div id="progWrap" style="display:none;margin-top:8px;">
            <div style="background:#efe9ff;border-radius:8px;height:14px;overflow:hidden;">
                <div id="progBar" style="height:100%;width:0%;background:#7C5CBF;transition:width .4s;"></div>
            </div>
            <div class="msg" id="progTxt"></div>
        </div>
        <div class="msg" id="status"></div>
        <div id="playerWrap" style="display:none;">
            <audio id="player" controls></audio>
            <div class="fileinfo" id="fileinfo"></div>
            <button id="dl" style="margin-top:10px;">⬇️ 满意，下载到 Download</button>
            <div class="msg" id="dlStatus"></div>
        </div>
        <div class="note">云端合成（MeloTTS · MIT 可商用）· 必须站长账号登录（账号绑定）· 首次合成需云端预热 1~3 分钟 · 音色调节：音调越低越低沉，越高越清脆</div>
    </div>
    <a href="../index.html" class="back-home">🏠 回主页</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
// ===== 站长判定（与 users.html 一致）=====
const OWNER_EMAIL = (function(){ try { return atob("bW9jLmxpYW1nQDFvdm8xb2Ftb2Ft").split("").reverse().join("").toLowerCase(); } catch(e){ return ""; } })();
if (!firebase.apps.length) { firebase.initializeApp(window.FIREBASE_CONFIG); }
// 账号绑死：只有站长邮箱登录后才能使用（本地/线上一致，别的账号一律拒绝）
firebase.auth().onAuthStateChanged(function(user){
    var ok = user && String(user.email || "").toLowerCase() === OWNER_EMAIL;
    document.getElementById("gate").style.display = ok ? "none" : "block";
    document.getElementById("panel").style.display = ok ? "block" : "none";
    if (!ok) {
        document.getElementById("gateWhy").textContent = user
            ? "当前登录：" + user.email + "（不是站长账号）"
            : "请先登录毛毛账号。";
    }
});

// ===== 滑块显示 =====
var speedEl = document.getElementById("speed"), volumeEl = document.getElementById("volume"), pitchEl = document.getElementById("pitch");
speedEl.addEventListener("input", updateEta);
volumeEl.addEventListener("input", function(){ document.getElementById("volumeV").textContent = parseFloat(volumeEl.value).toFixed(1) + "×"; });
pitchEl.addEventListener("input", function(){ document.getElementById("pitchV").textContent = pitchLabel(pitchEl.value); });
document.getElementById("pLow").addEventListener("click", function(){ pitchEl.value = 0.85; pitchEl.dispatchEvent(new Event("input")); });
document.getElementById("pNor").addEventListener("click", function(){ pitchEl.value = 1.0; pitchEl.dispatchEvent(new Event("input")); });
document.getElementById("pHigh").addEventListener("click", function(){ pitchEl.value = 1.2; pitchEl.dispatchEvent(new Event("input")); });
function pitchLabel(v){ v = parseFloat(v); if (Math.abs(v-1.0) < 0.03) return "原声"; return v < 1 ? "低沉" + v.toFixed(2) + "×" : "清脆" + v.toFixed(2) + "×"; }
var T0 = 0;
function updateEta(){
    document.getElementById("speedV").textContent = parseFloat(speedEl.value).toFixed(2) + "×";
    var n = document.getElementById("text").value.trim().length;
    var el = document.getElementById("eta");
    if (!n) { el.textContent = "预计生成时间：—"; return; }
    var sec = Math.round(n * 0.08 / parseFloat(speedEl.value));
    var m = Math.floor(sec/60), s = sec % 60;
    el.textContent = "预计生成时间：" + (m ? m + " 分 " : "") + s + " 秒（" + n + " 字）";
}
document.getElementById("text").addEventListener("input", updateEta);
updateEta();

// ===== 合成（云端异步任务 + 进度条 + 账号绑定）=====
var API = "https://maomao-admin-api.onrender.com";
var POLL = null, ANIM = null;
var dispW = 0, progTarget = 0;
function stopPoll(){ if(POLL){ clearInterval(POLL); POLL = null; } if(ANIM){ clearInterval(ANIM); ANIM = null; } }
function startAnim(){
    if(ANIM) clearInterval(ANIM);
    dispW = 0;
    ANIM = setInterval(function(){
        // 平滑逼近目标；至少有 0.6% 的推进量 = 永远在动（假动到 90% 封顶，完成后即刻 100%）
        var step = Math.max((progTarget - dispW) * 0.15, 0.6);
        dispW = Math.min(progTarget < 95 ? progTarget : (dispW + step > 90 ? 90 : dispW + step), dispW + step);
        if (progTarget >= 100) dispW = 100;
        document.getElementById("progBar").style.width = dispW + "%";
    }, 450);
}
function fmtSec(s){ return s >= 60 ? Math.floor(s/60) + " 分 " + (s%60) + " 秒" : s + " 秒"; }
function getToken(){
    var u = firebase.auth().currentUser;
    if (!u || !u.getIdToken) return Promise.resolve("");
    return u.getIdToken().catch(function(){ return ""; });
}
document.getElementById("go").addEventListener("click", function(ev){
    ev.preventDefault();
    var text = document.getElementById("text").value.trim();
    var st = document.getElementById("status");
    if (!text) { st.textContent = "⚠️ 先输入文字"; st.className = "msg err"; return; }
    var btn = document.getElementById("go");
    btn.disabled = true;
    var n0 = text.length;
    var est = Math.max(5, Math.round(n0 * 0.08 / parseFloat(speedEl.value)));
    st.textContent = "⏳ 正在提交云端任务（预计整体约 " + (est >= 60 ? Math.floor(est/60) + " 分 " + (est%60) + " 秒" : est + " 秒") + "）...";
    st.className = "msg";
    T0 = Date.now();
    getToken().then(function(tok){
        return fetch(API + "/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok },
            body: JSON.stringify({ text: text, speed: parseFloat(speedEl.value), volume: parseFloat(volumeEl.value), pitch: parseFloat(pitchEl.value) })
        });
    })
    .then(function(r){
        return r.json().then(function(j){ return { status: r.status, body: j }; });
    })
    .then(function(res){
        if (res.body && res.body.ok && res.status === 200) return res.body;
        var msg = (res.body && res.body.error) || "服务器未返回错误说明";
        st.textContent = "❌ 真实报错：HTTP " + res.status + " — " + msg;
        st.className = "msg err"; btn.disabled = false; return null;
    })
    .then(function(res){
        if (!res) return;
        var pw = document.getElementById("progWrap");
        pw.style.display = "block";
        progTarget = 3; startAnim();
        document.getElementById("progTxt").textContent = "⏳ 任务已提交云端，等待接收（若还在休眠正在唤醒）...";
        stopPoll();
        POLL = setInterval(function(){
            getToken().then(function(tok){
                return fetch(API + "/api/tts/progress?task=" + encodeURIComponent(res.task), { headers: { "Authorization": "Bearer " + tok } });
            }).then(function(r2){ return r2.json(); })
            .then(function(p){
                if (!p || !p.status) return;
                var bar = document.getElementById("progBar");
                var txt = document.getElementById("progTxt");
                if (p.status === "done") {
                    stopPoll();
                    progTarget = 100; dispW = 100;
                    bar.style.width = "100%";
                    var secUsed = Math.round((Date.now() - T0) / 1000);
                    txt.textContent = "✅ 完成，正在取回音频...（实际生成 " + fmtSec(secUsed) + "）";
                    getToken().then(function(tok){
                        return fetch(API + "/api/tts/audio?task=" + encodeURIComponent(res.task), { headers: { "Authorization": "Bearer " + tok } });
                    }).then(function(r3){
                        if (!r3.ok) throw new Error("取回失败");
                        return r3.blob();
                    }).then(function(blob){
                        var url = URL.createObjectURL(blob);
                        var a = document.getElementById("player");
                        a.src = url;
                        document.getElementById("dl").dataset.url = url;
                        document.getElementById("dl").dataset.file = "maomao_tts_" + Date.now().toString(36) + ".mp3";
                        document.getElementById("dl").disabled = false;
                        document.getElementById("dlStatus").textContent = "";
                        document.getElementById("playerWrap").style.display = "block";
                        document.getElementById("fileinfo").textContent = "本次音频（" + Math.round(blob.size/1024) + " KB）";
                        pw.style.display = "none";
                        st.textContent = "✅ 合成完成，先试听，满意再下载"; st.className = "msg ok";
                        btn.disabled = false;
                        a.play();
                    }).catch(function(e){
                        btn.disabled = false;
                        st.textContent = "❌ " + e.message; st.className = "msg err";
                    });
                } else if (p.status === "error") {
                    stopPoll();
                    pw.style.display = "none";
                    btn.disabled = false;
                    st.textContent = "❌ 云端任务失败（真实原因）：" + (p.error || "未返回错误信息"); st.className = "msg err";
                } else {
                    var pct = p.total ? Math.round(p.done / p.total * 100) : 0;
                    if (p.phase === "warmup") {
                        // 预热：真进度没数据 -> 按预计时间拟真爬升（假动到 90% 封顶）
                        var est = Math.max(60, Math.round((Date.now() - T0) * 1.2));
                        progTarget = Math.min(90, Math.round((Date.now() - T0) / est * 90));
                        txt.textContent = "🔥 云端正在下载/加载 167MB 模型（首次，约 1~3 分钟，进度按时间拟真）...";
                    } else if (p.phase === "convert") {
                        progTarget = Math.max(progTarget, 93);
                        txt.textContent = "🎧 全部段落合成完毕，正在转码 mp3...";
                    } else if (p.total > 0 && p.done >= 1) {
                        progTarget = Math.round(p.done / p.total * 100);
                        var el = Math.max(2, Math.round((Date.now() - T0) / p.done * (p.total - p.done)));
                        txt.textContent = "📝 正在合成第 " + p.done + "/" + p.total + " 段（" + pct + "%），预计剩余 " + fmtSec(el);
                    } else if (p.total > 0) {
                        progTarget = Math.max(progTarget, Math.min(20, progTarget + 2));
                        txt.textContent = "📝 正在合成第 1 段（已开始）...";
                    }
                }
            }).catch(function(){});
        }, 1500);
    })
    .catch(function(e){
        btn.disabled = false;
        st.textContent = "❌ 网络请求失败（" + (e && e.message ? e.message : e) + "）\n可能原因：云端免费实例休眠中（等 30~60 秒唤醒后重试）、或域名不可达";
        st.className = "msg err";
    });
});

// ===== 下载（试听满意后，浏览器存到手机 Download）=====
document.getElementById("dl").addEventListener("click", function(){
    var btn = this, st = document.getElementById("dlStatus");
    var url = btn.dataset.url, file = btn.dataset.file;
    if (!url) { st.textContent = "⚠️ 请先合成一次"; st.className = "msg err"; return; }
    var a = document.createElement("a");
    a.href = url; a.download = file || "maomao_tts.mp3";
    document.body.appendChild(a); a.click(); a.remove();
    st.textContent = "⬇️ 已触发下载（手机浏览器保存到 Download）"; st.className = "msg ok";
});
</script>
</body>
</html>
