<!DOCTYPE html>
<html>

<!-- ════════════════════════════════════════════════════════════
  文件：games.html —— 毛毛的自制小游戏（小游戏大厅）
  定位：主页「🎮 自制小游戏」入口点击后进入的大厅页，集中列出所有自制小游戏入口卡片。
  核心功能：以卡片形式展示 8 个小游戏（排行榜 / 猜数字 / 打字测试 / 2048 /
            贪吃蛇 / 大鱼吃小鱼 / 五子棋 / 国际象棋 / 围棋），每张卡片可点击跳转到对应游戏子页。
  引用的资源：
    - 内联 <style>   —— 本页专属样式（卡片、按钮、深色模式、返回主页）
    - games/ 子目录  —— ranking.html、guess.html、typing.html、2048.html、
                        snake.html、fish.html、gomoku.html、chess.html、go/index.html
  说明：本注释为教学文档，仅插入注释，未改动任何代码行为。
════════════════════════════════════════════════════════════════ -->

<head>
<script src="/device-check.js?v=18"></script>
    <script src="/anti-bot.js?v=4"></script>
<meta charset="UTF-8">
<title>毛毛的自制小游戏</title>

<!-- 本页内联样式：只影响这个小游戏大厅，不污染其他页面 -->
<style>

/* 全局基础样式：文字居中、默认字体 Arial */
body {
    text-align: center;
    font-family: Arial;
}

/* 游戏卡片里的标题：去掉默认上边距、固定下方 12px 间距、字号 20px */
.game-card h2{
    margin: 0 0 12px;
    font-size:20px;
}

/* 游戏卡片里的描述文字：去下边距、灰色、字号 14px */
.game-card p{
    margin: 0 0 16px;
    color:#666;
    font-size:14px;
}

/* 游戏卡片里的按钮：顶部留 2px，让按钮不紧贴文字 */
.game-card button{
    margin-top: 2px;
}

/* 游戏卡片容器：居中、内边距、宽度自适应(最小280px)、圆角、浅灰背景、柔和阴影 */
.game-card {
    margin: 20px auto;
    padding: 26px 18px;
    width: min(280px, 84vw);
    border-radius: 20px;
    background: #f2f2f2;
    box-shadow: 0 4px 14px #0002;
    text-align: center;
}

/* 通用按钮样式：内边距、圆角、去边框、手型光标 */
button {
    padding: 10px 26px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* ===== 返回主页按钮 ===== */

/* 固定在页面右上角的返回主页链接（视觉上做成按钮样式） */
.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}

/* 深色模式下的 body：深色背景 + 白字 */
body.dark-mode{

    background:#121212;

    color:white;

}

/* 深色模式下卡片背景变深 */
.dark-mode .game-card{

    background:#222;

}

/* 深色模式下按钮背景变深、文字变白 */
.dark-mode button{

    background:#333;

    color:white;

}

</style>

</head>

<body>

<!-- 内联脚本：读取本地存储的主题设置。若用户在主站选了「深色」，
     就给 body 加上 dark-mode 类，让本页也进入深色模式 -->
<script>

// ===== 读取深色模式 =====
// 从 localStorage 取 theme，值为 "dark" 时给 body 添加 dark-mode 类
if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<!-- 页面主标题 -->
<h1>🎮 毛毛的自制小游戏</h1>

<!-- 游戏卡片 1：排行榜 → 跳转 games/ranking.html -->
<div class="game-card">

<a href="games/ranking.html">
<button>
查看排行榜
</button>
</a>

</div>

<!-- 固定右上角的返回主页链接（跳回 index.html） -->
<a href="index.html" class="back-home">
🏠 返回主页
</a>

</body>

</html>
