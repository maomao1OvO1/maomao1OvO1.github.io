<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>毛毛的自制小游戏</title>

<style>

body {
    text-align: center;
    font-family: Arial;
}

.game-card h2{
    margin: 0 0 12px;
    font-size:20px;
}

.game-card p{
    margin: 0 0 16px;
    color:#666;
    font-size:14px;
}

.game-card button{
    margin-top: 2px;
}

.game-card {
    margin: 20px auto;
    padding: 26px 18px;
    width: min(280px, 84vw);
    border-radius: 20px;
    background: #f2f2f2;
    box-shadow: 0 4px 14px #0002;
    text-align: center;
}

button {
    padding: 10px 26px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* ===== 返回主页按钮 ===== */

.back-home {

    position: fixed;

    top: 20px;

    right: 20px;

    background: #e5dcff;

    color: #6543a5;

    padding: 10px 15px;

    border-radius: 20px;

    text-decoration: none;

    font-size: 16px;

}

body.dark-mode{

    background:#121212;

    color:white;

}

.dark-mode .game-card{

    background:#222;

}

.dark-mode button{

    background:#333;

    color:white;

}

</style>

</head>

<body>

<script>

// ===== 读取深色模式 =====

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

}

</script>

<h1>🎮 毛毛的自制小游戏</h1>

<div class="game-card">

<h2>🏆 排行榜</h2>

<p>查看所有玩家游戏排名</p>

<a href="games/ranking.html">
<button>
查看排行榜
</button>
</a>

</div>

<a href="index.html" class="back-home">
🏠 返回主页
</a>

<div class="game-card">

<h2>猜数字</h2>

<p>猜一个1~100之间的数字</p>

<a href="games/guess.html">
<button>
开始游戏
</button>
</a>

</div>

<div class="game-card">

<h2>打字测试</h2>

<p>测试你的打字速度</p>

<a href="games/typing.html">
<button>
开始游戏
</button>
</a>

</div>

<div class="game-card">

<h2>🧩 2048</h2>

<p>经典数字合并游戏</p>

<a href="games/2048.html">
<button>

</a>

</div>

开始游戏
</button>
</a>

<a href="games/go/index.html">
<button>
开始游戏
</button>
</a>

</div>

<script>
(function(){
  try{
    if(/MicroMessenger/i.test(navigator.userAgent||"") || /[?&]wx=1/.test(location.search||"")){
      document.querySelectorAll(".game-card").forEach(function(el){ el.style.display="none"; });
      var d=document.createElement("div");
      d.style.cssText="text-align:center;padding:36px 16px;color:#888;font-size:14px;line-height:1.7;";
      d.textContent="💡 微信内不展示游戏内容，请点击右上角，用浏览器（Chrome）打开即可游玩。";
      document.body.insertBefore(d, document.body.firstChild);
    }
  }catch(e){}
})();
</script>

</body>

</html>
