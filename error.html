<!DOCTYPE html>
<html lang="zh-CN">

<!-- ════════════════════════════════════════════════════════════════════
  文件：error.html —— 黑底红字「报错现场」特效页（纯原生 · 零依赖 · 单文件）
  用途：毛毛要的效果 —— 照《黑客帝国》那种**字符流雨**的标准来做，但：
        ① 颜色换成**红色**（不是绿的）；② 整片雨是**斜着下的**（右上 → 左下）。
        另外：中央红色大字**常亮不闪**，闪的是飘动的那片雨。
  说明：与 404.html（跟主站风格一致的中文兜底页）**刻意分开** ——
        本页不引 style.css / bg.css，独立黑底，就是要"报错"那股劲儿。
  ═══════════════════════════════════════════════════════════════════
  字符流是怎么画的（Matrix 的正统做法 + 斜向改造）：
    1. 把屏幕切成若干条**流**（column），每条有自己的起点、速度、尾巴长度；
    2. 一条流 = 一串字符，**头在最前**（最亮，白偏红），越往尾巴越暗越透，
       所以"拖尾"是靠**逐字递减的透明度**画出来的，不是靠残影糊出来的；
    3. 每条流每帧往前走一步：**x 往左、y 往下** ⇒ 整体右上 → 左下（≈30°）；
    4. 尾巴上第 k 个字符的位置 = 头部沿"反方向"退 k 个字距；
    5. 字符会**随帧随机变脸**（像电影里字在滚动），不是一成不变。
  每帧清屏一次（纯黑重画）：因为尾巴已经由透明度表达，不需要靠半透明覆盖
  去糊残影 —— 这样画面最干净、最接近电影里的观感。
  ═══════════════════════════════════════════════════════════════════
  注意：① 不引任何库、不发任何网络请求；
        ② 太暗的尾巴字符直接跳过不画（省一半绘制量）+ 列数封顶 ⇒ 保手机帧率；
        ③ 绝不给每个字设 shadowBlur（逐字模糊必掉帧），光感靠亮度分层；
        ④ 字号：手机 19 / 平板 22 / 桌面 26（毛毛要求"字大点"）。
  改动记录：2026-10-06 创建 → 同日 ①字加大 ②大字停闪改飘字闪 ③去掉
        「小游戏」按钮、返回只指 GitHub 主页 → 再按毛毛要求**重写成
        Matrix 式字符流**（红色 · 斜向）。
  创建：2026-10-06（小鲸）
════════════════════════════════════════════════════════════════════ -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="description" content="报错现场 —— 这里不是首页哟">
<title>这里不是首页哟 · 报错现场</title>

<style>
/* ── 配色：全页只用红与黑，靠亮度层次做区分 ───────────────────── */
:root{
    --red:      #ff2b2b;   /* 主红：大字 */
    --red-deep: #8b0000;   /* 暗红：光晕 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    font-family: "Courier New", Consolas, monospace,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--red);
    /* 手机端：别让长按选中破相 */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
}

/* ① 字符流画布 —— 最底层，铺满全屏 */
#rain { position: fixed; inset: 0; display: block; z-index: 1; }

/* ② 中央文字层 —— pointer-events:none 让点击穿透到画布（点哪炸哪） */
.stage {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 26px;
    pointer-events: none;
}

/* 大字：红色 + 三层红色光晕 —— **常亮不闪**（闪的交给飘动的雨） */
.big {
    font-size: clamp(27px, 7.6vw, 66px);
    font-weight: 900;
    letter-spacing: .075em;
    line-height: 1.32;
    color: var(--red);
    text-shadow: 0 0 10px #ff0000b3,
                 0 0 32px var(--red-deep),
                 0 0 66px #ff000066;
}
.big .line2 {
    display: block;
    margin-top: .16em;
    font-size: .84em;
    color: #ff5a5a;
}

/* ③ 上下两条 HUD 小字（终端味） */
.hud {
    position: fixed; left: 0; right: 0; z-index: 4;
    text-align: center;
    font-size: clamp(10px, 2.9vw, 14px);
    letter-spacing: .24em;
    color: #ff4d4d;
    opacity: .8;
}
.hud.top { top: 16px;  animation: blink 2.1s infinite; }
.hud.bot { bottom: 16px; opacity: .5; }
@keyframes blink { 50% { opacity: .2; } }

/* ④ 全屏偶尔红闪一下（营造"报错"的抽搐感，但很克制） */
.flash {
    position: fixed; inset: 0; z-index: 3;
    background: #ff0000; opacity: 0;
    pointer-events: none; mix-blend-mode: screen;
    animation: screenflash 6.5s infinite;
}
@keyframes screenflash {
    0%, 91%, 100% { opacity: 0; }
    92%           { opacity: .17; }
    93%           { opacity: 0; }
    94.5%         { opacity: .10; }
    95.5%         { opacity: 0; }
}

/* ⑤ 唯一出口：只指向毛毛的 GitHub 主页（README），不去别的地方 */
.exit {
    position: fixed; left: 0; right: 0; bottom: 54px; z-index: 5;
    display: flex; justify-content: center;
}
.exit a {
    pointer-events: auto;
    padding: 9px 20px;
    border: 1px solid #ff2b2b80;
    border-radius: 10px;
    background: #ff000014;
    color: #ff8a8a;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .09em;
    transition: background .18s, color .18s, box-shadow .18s;
}
.exit a:hover,
.exit a:active {
    background: #ff2b2b26;
    color: #fff;
    box-shadow: 0 0 20px #ff000055;
}
</style>
</head>

<body>

<!-- 字符流雨（JS 画） -->
<canvas id="rain"></canvas>

<!-- 偶尔的全屏红闪 -->
<div class="flash"></div>

<!-- 上下 HUD -->
<div class="hud top">ERROR&nbsp;404&nbsp;·&nbsp;PAGE_NOT_FOUND</div>

<!-- 中央大字：常亮，不闪 -->
<div class="stage">
    <div class="big">
        这里不是首页哟
        <span class="line2">这里是报错</span>
    </div>
</div>

<div class="hud bot">SYSTEM&nbsp;ALERT&nbsp;·&nbsp;RED&nbsp;ALERT&nbsp;·&nbsp;SYSTEM&nbsp;ALERT</div>

<!-- 出口：只回毛毛的 GitHub 主页 -->
<div class="exit">
    <a href="https://github.com/maomao1OvO1">← 回首页</a>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   红色字符流雨（Matrix 式 · 斜向）

   ── 几何：整片雨往「左下」走 ≈30° ─────────────────────────────
      流向单位向量 (SLX, SLY) = (0.5, 0.866) —— 水平退 0.5、竖直落 0.866，
      正好是 30°。所以头部每帧就是：x -= speed*SLX，y += speed*SLY。
      尾巴上第 k 个字符 = 头部**沿反方向**退 k 个字距：
          cx = hx + k*FS*SLX ,  cy = hy - k*FS*SLY
      （把"字距 FS"分解到两个轴上，字符就自然沿斜线排成一串，不会散。）

   ── 亮度：Matrix 的招牌是「头白尾绿」────────────────────────
      按毛毛要求改成**全红 + 前后一样密**：
        整条流  ⇒ 同一亮度、同一间距（不会"越往后越稀"）
        头部（k=0）⇒ 稍微再亮一档的红 (255,74,74)，做出"头"的感觉
        收尾    ⇒ 只在最后 15% 淡出，免得尾巴硬生生断掉
      他的话：「为什么开头是白色的？都是红色的」「别越到后面那个符号雨越少，一样多」
      透明度太低（≤0.07）的直接不画 —— 既省性能，观感也没差别。

   ── 变化：字会"变脸"──────────────────────────────────────
      每帧以 45% 的概率随机换掉这条流里的某个字符 ⇒ 像电影里字在滚动。

   ── 性能：每帧清屏重画（纯黑），尾巴靠透明度表达、不靠残影 ─────
      列数按屏宽算并封顶 46 条；字符少画；dpr 上限 2 —— 手机也能跑满。
   ════════════════════════════════════════════════════════════════════ */
(function () {
    var cv  = document.getElementById('rain');
    var ctx = cv.getContext('2d');

    // 字符池：大小写字母 + 数字 + 少量符号（Matrix 用的也是拉丁字母为主）
    var CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789#$%&@*<>/+=';

    // 流向：左下 30°（单位向量）
    var SLX = 0.5, SLY = 0.866;

    var dpr = 1;         // 设备像素比（上限 2，省性能）
    var W = 0, H = 0;    // 画布实际像素尺寸
    var FS = 22;         // 当前字号（画布像素）
    var cols = [];       // 全部字符流
    var lastT = 0, slowN = 0;   // 帧率自适应：上次时间戳 / 连续偏慢计数

    function rndChar() { return CHARS.charAt((Math.random() * CHARS.length) | 0); }

    // 字号：手机小一点、桌面大一点（毛毛要求"字大点"，所以整体调大了）
    function pxFont() {
        var w = window.innerWidth;
        return w < 520 ? 19 : (w < 900 ? 22 : 26);
    }

    // 造一条流：长度随机 8~21 个字；起点默认在屏幕上方之外
    function makeCol(initial) {
        var len = 20 + ((Math.random() * 20) | 0);   // 尾巴 20~39 个字（拉长 ⇒ 纵向连成一片）
        var chars = [];
        for (var i = 0; i < len; i++) chars.push(rndChar());

        // 起始 y：首屏直接撒开；之后从屏幕上方之外进场
        var y0 = initial ? (Math.random() * H * 1.4 - H * 0.35)
                         : (-FS * len - Math.random() * H * 0.6);

        // ══ 起点 x 必须「反推」，不能随便撒 ═══════════════════════════
        // 这是「越往下越稀」的真凶（2026-10-06 修）：
        //   整片雨往左下走，一条流从屏幕上方飘到中部时，水平方向已经漂了
        //     drift = 走过的垂直距离 × (SLX / SLY)
        //   以手机为例，一条流从顶飘到底会横向漂掉两个屏宽 —— 起点要是还按
        //   屏宽随机撒，那它飘到下半屏时早跑出屏幕左边了 ⇒ 右下角永远空的，
        //   看着就是「越到后面越少」。跟亮度、间距都没关系。
        // 解法：先定「这条流走到屏幕中部时应该落在哪」（均匀铺满 0~W），
        //       再把起点按 drift 往右推 —— 这样每个高度上都有字。
        // ── 斜度：两种混着来（这是"填满右下角"的关键）──────────────
        // 全用同一个斜度的话，几何上必然「上偏右、下偏左」（雨往左下走，
        // 到了下半屏整体已经左移一个多屏宽），右下角永远空着 —— 看着就是
        // 「越到后面越少」。所以混进一部分近乎竖直的流：它们从上到下都盖住
        // 同一个 x，负责把四角铺满；其余保持明显的斜，负责"风"的感觉。
        // ── 斜率「统一」（2026-10-06 修）─────────────────────────────
        // 上一版为了补四角把每条流的斜率做成随机（3°~37°），方向不一致，
        // 毛毛一眼看出「乱飘」。node 模拟扫参数证明：各高度均匀**主要靠
        // 起点横向外扩**，斜率统一之后均匀度照样 ~60% ⇒ 没必要让它们各飘各的。
        // 所以定成同一个角度：明显是斜的，又不会太吃横宽。
        var slope = 0.30;   // ≈ 17°

        // 方向单位向量（slope = 水平分量 / 竖直分量，所以要归一化）
        var inv = 1 / Math.sqrt(1 + slope * slope);
        var sx  = slope * inv, sy = inv;

        // 起点 x 反推：先定「这条流走到屏幕中部时落在哪」（均匀铺满屏宽），
        // 再按它自己的 slope 把起点右移漂移量。
        // ── 起点 x：撒到「这条流一生会覆盖到的横向范围」上 ────────────
        // 也就是屏宽再往右扩出 1.6 倍的漂移量。
        // 为什么要外扩：所有流都往左下走，不外扩的话流飘到下半屏时全挤到
        // 左边去了，右下角永远空着（模拟实测：各高度带均匀度只有 6~20%，
        // 就是毛毛说的"越到后面越少"）。外扩之后，一部分流是从屏幕右侧
        // 外面进场，走到下半屏正好补上右下角（模拟实测均匀度 55~62%）。
        var drift = (H * 0.5 - y0) * slope;
        var hx0   = Math.random() * (W + drift * 1.6);

        return {
            hx:    hx0,
            hy:    y0,
            sx:    sx, sy: sy,
            speed: (1.6 + Math.random() * 3.2) * Math.min(dpr, 1.6),   // 流速：比第一版快约 1.7 倍
            len:   len,
            chars: chars,
            alpha: 0.40 + Math.random() * 0.60            // 基准亮度（做出前景/后景层次）
        };
    }

    // 循环复用：把一条流送回右上方之外
    function recycle(c) {
        var n = makeCol(false);
        c.hx = n.hx;   // makeCol 已经把起点算好了（含斜向补偿），别再额外偏移
        c.hy = n.hy;
        c.speed = n.speed;
        c.len = n.len;
        c.chars = n.chars;
        c.alpha = n.alpha;
    }

    // 尺寸变化 / 首次进入：重排画布与字符流
    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.width  = Math.floor(window.innerWidth  * dpr);
        H = cv.height = Math.floor(window.innerHeight * dpr);
        cv.style.width  = window.innerWidth  + 'px';
        cv.style.height = window.innerHeight + 'px';

        FS = pxFont() * dpr;
        ctx.font = 'bold ' + FS + 'px "Courier New", monospace';
        ctx.textBaseline = 'top';

        // 列数：按屏宽排，封顶 46 条（斜向要铺满，多补几条）
        // 列数：间距压到 0.5 个字宽（横向近乎铺满），上限按屏分档封顶
        var n = Math.min(window.innerWidth < 520 ? 90 : 150, Math.ceil(W / (FS * 0.5)) + 16);
        cols = [];
        for (var i = 0; i < n; i++) {
            // 直接交给 makeCol 反推起点（见那里的注释），这里不要再覆盖 hx ——
            // 一覆盖就等于把"补偿斜向漂移"给抹了，右下角立刻变空。
            cols.push(makeCol(true));
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);   // 清一次底
    }

    // 逐帧绘制
    function tick(now) {
        // 帧率自适应：单帧超过 ~38ms（低于 26fps）且连续偏慢 ⇒ 自动砍掉约 1/8 的列
        // （只减不增，避免忽密忽疏；这样「满屏」和「不卡」能同时保住）
        if (now) {
            if (lastT && now - lastT > 38) {
                if (++slowN > 36 && cols.length > 20) {
                    cols.length = Math.floor(cols.length * 0.875);
                    slowN = 0;
                }
            } else { slowN = 0; }
            lastT = now;
        }

        // 纯黑清屏：尾巴由"逐字降透明度"表达，不需要半透明覆盖留残影
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < cols.length; i++) {
            var c = cols[i];

            // 字会变脸：随机换掉这条流里的一个字符
            if (Math.random() < 0.45) {
                c.chars[(Math.random() * c.len) | 0] = rndChar();
            }

            // 从头部往后画：头最亮、尾最暗
            for (var k = 0; k < c.len; k++) {
                // 亮度：整条流**前后一样**（毛毛要求「别越到后面越少，一样多」）——
                // 原来按「离头部多远」递减，尾巴慢慢隐没，看着就"越往后越稀"。
                var tail = k / c.len;
                var base = c.alpha * (tail < 0.85 ? 1 : (1 - (tail - 0.85) / 0.15));
                if (base <= 0.07) break;   // 收到尾巴尖了 ⇒ 后面没字，直接收工

                // ── 闪烁：每帧给这个字掷骰子，决定它这一帧亮还是灭 ──
                //    （注意：上面 break 判的是 base，不能拿闪过的 a 去判，
                //      否则会把后面还亮着的字一起掐掉 —— 这个坑记一下）
                var a = base;
                var roll = Math.random();
                if (roll < 0.18)      a = base * 0.10;                // 18%：这一帧「灭」一下
                else if (roll > 0.94) a = Math.min(1, base + 0.5);    // 6%：这一帧「爆」一下

                var cx = c.hx + k * FS * c.sx;   // 沿这条流自己的方向退 k 个字距
                var cy = c.hy - k * FS * c.sy;
                if (cy < -FS || cy > H + FS || cx < -FS || cx > W + FS) continue;

                if (k === 0) {
                    // 头部：最亮的红（毛毛要求**全红**，不要白脑袋）
                    ctx.fillStyle = 'rgba(255, 74, 74, ' + Math.min(1, a + 0.50).toFixed(3) + ')';
                } else {
                    // 身体：纯红，越靠尾越暗（绿蓝分量压低 ⇒ 红得正）
                    var g = 18 + ((Math.random() * 34) | 0);
                    ctx.fillStyle = 'rgba(255, ' + g + ', ' + g + ', ' + a.toFixed(3) + ')';
                }
                ctx.fillText(c.chars[k], cx, cy);
            }

            // 前进：往左 + 往下 ⇒ 整片雨右上 → 左下
            c.hx -= c.speed * c.sx;
            c.hy += c.speed * c.sy;

            // 整条流都离开屏幕（尾巴也出去了）→ 回收去右上角重来
            if (c.hy - c.len * FS * c.sy > H || c.hx + c.len * FS * c.sx < -FS) recycle(c);
        }
        requestAnimationFrame(tick);
    }

    // ── 点哪儿炸哪儿：在手指位置炸开一小圈红字（轻量互动） ──────────
    function burst(cx, cy) {
        ctx.font = 'bold ' + FS + 'px "Courier New", monospace';
        for (var i = 0; i < 16; i++) {
            var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
            var len = FS * (2 + Math.random() * 3);
            ctx.fillStyle = 'rgba(255, ' + (40 + (Math.random() * 60 | 0)) + ', 40, ' + (0.55 + Math.random() * 0.45) + ')';
            ctx.fillText(rndChar(), cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        }
    }
    window.addEventListener('pointerdown', function (ev) {
        burst(ev.clientX * dpr, ev.clientY * dpr);
    }, { passive: true });

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(tick);
})();
</script>

</body>
</html>
