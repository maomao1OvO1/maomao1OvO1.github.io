<!DOCTYPE html>
<html lang="zh-CN">

<!-- ════════════════════════════════════════════════════════════════════
  文件：error.html —— 黑底红字「报错现场」特效页（纯原生 · 零依赖 · 单文件）
  用途：毛毛要的氛围页 —— ① 黑色背景；② 中央红色大字（**常亮，不闪**）；
        ③ 随机英文字母从**右上角斜飘向左下角**（字符雨，**字会闪**）；
        ④ 返回入口只指向他的 GitHub 主页（README），不去别的地方。
  说明：与 404.html（跟主站风格一致的中文兜底页）**刻意分开** ——
        本页不引 style.css / bg.css，独立黑底，就是要"报错"那股劲儿。
  实现：Canvas 逐帧画字符 + 半透明黑覆盖造拖尾（矩阵雨的经典做法），
        方向靠速度矢量控制（x 往左、y 往下 ⇒ 右上 → 左下）；
        闪烁靠**每帧随机决定这个字这一帧是"暗下去"还是"爆亮"**。
  注意：① 不引任何库、不发任何网络请求；
        ② 字符数量有上限、字号按屏宽自适应，保手机帧率；
        ③ 不给每个字设 shadowBlur（逐字模糊必掉帧），光感靠颜色 + 拖尾。
  改动记录：2026-10-06 创建；同日按毛毛要求改 —— 字号加大、大字停闪、
        改为飘动的字闪烁、去掉「小游戏」按钮、返回入口改指 GitHub 主页。
  创建：2026-10-06（小鲸）
════════════════════════════════════════════════════════════════════ -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="description" content="报错现场 —— 这里不是首页哟">
<title>这里不是首页哟 · 报错现场</title>

<style>
/* ── 配色：全页只用红与黑，靠亮度层次做区分 ───────────────────── */
:root{
    --red:      #ff2b2b;   /* 主红：大字 */
    --red-soft: #ff6b6b;   /* 亮红：小字、按钮描边 */
    --red-deep: #8b0000;   /* 暗红：光晕 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    font-family: "Courier New", Consolas, monospace,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--red);
    /* 手机端：别让长按选中破相 */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
}

/* ① 字符雨画布 —— 最底层，铺满全屏 */
#rain { position: fixed; inset: 0; display: block; z-index: 1; }

/* ② 中央文字层 —— pointer-events:none 让点击穿透到画布（点哪炸哪） */
.stage {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 26px;
    pointer-events: none;
}

/* 大字：红色 + 三层红色光晕 —— **常亮不闪**（毛毛要求：闪的交给飘动的字） */
.big {
    font-size: clamp(27px, 7.6vw, 66px);
    font-weight: 900;
    letter-spacing: .075em;
    line-height: 1.32;
    color: var(--red);
    text-shadow: 0 0 10px #ff0000b3,
                 0 0 32px var(--red-deep),
                 0 0 66px #ff000066;
}
.big .line2 {
    display: block;
    margin-top: .16em;
    font-size: .84em;
    color: #ff5a5a;
}

/* ③ 上下两条 HUD 小字（终端味） */
.hud {
    position: fixed; left: 0; right: 0; z-index: 4;
    text-align: center;
    font-size: clamp(10px, 2.9vw, 14px);
    letter-spacing: .24em;
    color: #ff4d4d;
    opacity: .8;
}
.hud.top { top: 16px;  animation: blink 2.1s infinite; }
.hud.bot { bottom: 16px; opacity: .5; }
@keyframes blink { 50% { opacity: .2; } }

/* ④ 全屏偶尔红闪一下（营造"报错"的抽搐感，但很克制） */
.flash {
    position: fixed; inset: 0; z-index: 3;
    background: #ff0000; opacity: 0;
    pointer-events: none; mix-blend-mode: screen;
    animation: screenflash 6.5s infinite;
}
@keyframes screenflash {
    0%, 91%, 100% { opacity: 0; }
    92%           { opacity: .17; }
    93%           { opacity: 0; }
    94.5%         { opacity: .10; }
    95.5%         { opacity: 0; }
}

/* ⑤ 唯一出口：只指向毛毛的 GitHub 主页（README），不去别的地方 */
.exit {
    position: fixed; left: 0; right: 0; bottom: 54px; z-index: 5;
    display: flex; justify-content: center;
}
.exit a {
    pointer-events: auto;
    padding: 9px 20px;
    border: 1px solid #ff2b2b80;
    border-radius: 10px;
    background: #ff000014;
    color: #ff8a8a;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .09em;
    transition: background .18s, color .18s, box-shadow .18s;
}
.exit a:hover,
.exit a:active {
    background: #ff2b2b26;
    color: #fff;
    box-shadow: 0 0 20px #ff000055;
}
</style>
</head>

<body>

<!-- 字符雨（JS 画） -->
<canvas id="rain"></canvas>

<!-- 偶尔的全屏红闪 -->
<div class="flash"></div>

<!-- 上下 HUD -->
<div class="hud top">ERROR&nbsp;404&nbsp;·&nbsp;PAGE_NOT_FOUND</div>

<!-- 中央大字：常亮，不闪 -->
<div class="stage">
    <div class="big">
        这里不是首页哟
        <span class="line2">这里是报错</span>
    </div>
</div>

<div class="hud bot">SYSTEM&nbsp;ALERT&nbsp;·&nbsp;RED&nbsp;ALERT&nbsp;·&nbsp;SYSTEM&nbsp;ALERT</div>

<!-- 出口：只回毛毛的 GitHub 主页 -->
<div class="exit">
    <a href="https://github.com/maomao1OvO1">← 回首页</a>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   字符雨：随机英文字母 + 数字，从**右上角**斜飘向**左下角**，且**会闪**
   ── 做法（经典矩阵雨 + 斜向改造 + 闪烁）：
      每一帧先用「半透明黑」盖住整个画布（rgba(0,0,0,.13)），
      旧字符就被压暗一点点 ⇒ 自然拖出尾巴；
      然后给每个"雨滴"随机挑一个字画上去；
      再让它 x 往左、y 往下走 ⇒ 整体方向就是右上 → 左下。
   ── 闪烁怎么做的：
      画每个字之前**掷一次骰子** ——
        小概率 ⇒ 这一帧几乎画成黑的（字"灭"一下）；
        更小概率 ⇒ 这一帧拉满亮度（字"爆"一下）；
        其余  ⇒ 按它自己的基准亮度画。
      合起来就是"整片雨在抖"的感觉，而不是整齐地一起亮灭。
   注意：① 字大了 ⇒ 数量自动变少（按屏幕面积算），保持密度不吓人；
        ② 每个字都设 shadowBlur 会卡 —— 光感靠颜色 + 拖尾。
   ════════════════════════════════════════════════════════════════════ */
(function () {
    var cv  = document.getElementById('rain');
    var ctx = cv.getContext('2d');

    // 字符池：大小写字母 + 数字 + 少量符号（随机取）
    var CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789#$%&@*<>/';

    var dpr = 1;          // 设备像素比（上限 2，省性能）
    var W = 0, H = 0;     // 画布实际像素尺寸
    var FS = 22;          // 当前字号（画布像素）
    var drops = [];       // 全部雨滴

    // 字号：手机小一点、桌面大一点（2026-10-06 按毛毛要求整体加大了）
    function pxFont() {
        var w = window.innerWidth;
        return w < 520 ? 19 : (w < 900 ? 22 : 26);
    }

    // 造一滴雨：scatter=true 时撒在屏幕内（首屏立刻满），否则从右上角外飘进来
    function makeDrop(scatter) {
        var base = FS;
        return {
            x:     scatter ? Math.random() * W * 1.5 : W + Math.random() * W * 0.4,
            y:     scatter ? Math.random() * H - H * 0.25 : -base - Math.random() * H * 0.5,
            speed: (1.0 + Math.random() * 2.0) * Math.min(dpr, 1.6),   // 速度：每帧 1.0~3.0 像素
            alpha: 0.22 + Math.random() * 0.6                          // 基准亮度（深浅有层次）
        };
    }

    // 尺寸变化 / 首次进入：重排画布与雨滴
    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.width  = Math.floor(window.innerWidth  * dpr);
        H = cv.height = Math.floor(window.innerHeight * dpr);
        cv.style.width  = window.innerWidth  + 'px';
        cv.style.height = window.innerHeight + 'px';

        FS = pxFont() * dpr;
        ctx.font = 'bold ' + FS + 'px "Courier New", monospace';
        ctx.textBaseline = 'top';

        // 数量 = 屏幕斜向能排多少字，但封顶 140 滴（字变大了，数量相应减少）
        var count = Math.min(140, Math.ceil((W + H) / (FS * 1.35)));
        drops = [];
        for (var i = 0; i < count; i++) drops.push(makeDrop(true));

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);   // 清一次底，避免残影
    }

    // 逐帧绘制
    function tick() {
        // 拖尾：半透明黑覆盖（数值越小尾巴越长；0.13 比较"雨"）
        ctx.fillStyle = 'rgba(0, 0, 0, 0.13)';
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < drops.length; i++) {
            var d  = drops[i];
            var ch = CHARS.charAt((Math.random() * CHARS.length) | 0);

            // ── 闪烁：每帧掷骰子决定这一个字的亮度 ──────────────
            var roll  = Math.random();
            var alpha = d.alpha;              // 默认：按基准亮度画
            var g     = 18 + ((Math.random() * 46) | 0);   // 红里的绿蓝分量（越小越纯红）

            if (roll < 0.16) {                // 16%：这一帧"灭"一下
                alpha = d.alpha * 0.10;
            } else if (roll > 0.93) {         // 7%：这一帧"爆"一下（更亮更纯）
                alpha = 1;
                g     = 60;
            }

            ctx.fillStyle = 'rgba(255,' + g + ',' + g + ',' + alpha + ')';
            ctx.fillText(ch, d.x, d.y);

            d.x -= d.speed * 0.62;   // 往左
            d.y += d.speed;          // 往下   ⇒ 合起来就是「右上 → 左下」

            // 飘出左下角就回到右上角外，循环使用
            if (d.y > H + FS * 2 || d.x < -FS * 2) {
                var nd = makeDrop(false);
                d.x = nd.x; d.y = nd.y; d.speed = nd.speed; d.alpha = nd.alpha;
            }
        }
        requestAnimationFrame(tick);
    }

    // ── 点哪儿炸哪儿：在手指位置炸开一小圈红字（轻量互动） ──────────
    function burst(cx, cy) {
        ctx.font = 'bold ' + FS + 'px "Courier New", monospace';
        for (var i = 0; i < 16; i++) {
            var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
            var len = FS * (2 + Math.random() * 3);
            ctx.fillStyle = 'rgba(255, ' + (40 + (Math.random() * 60 | 0)) + ', 40, ' + (0.5 + Math.random() * 0.5) + ')';
            ctx.fillText(CHARS.charAt((Math.random() * CHARS.length) | 0),
                         cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        }
    }
    window.addEventListener('pointerdown', function (ev) {
        burst(ev.clientX * dpr, ev.clientY * dpr);
    }, { passive: true });

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(tick);
})();
</script>

</body>
</html>
