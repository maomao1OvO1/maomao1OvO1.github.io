<!DOCTYPE html>
<html lang="zh-CN">

<!-- ════════════════════════════════════════════════════════════
  文件：music.html —— 音乐收藏页（“媒体作品”分支之一）
  定位：从主页「🎵 音乐收藏」进入的二级页面。
  核心功能：展示音乐收藏标题；当前为占位内容「持续更新中」。
  引用的资源：
    - style.css（外部全局样式）
    - body 使用 sub-page 类（二级页面特定样式，如去除顶部大标题样式）
    - 内联 <script>——读取本地主题，跟随主页的深色模式设置
  说明：本注释为教学文档，仅插入注释，未改动任何代码行为。
════════════════════════════════════════════════════════════════ -->

<head>
<meta charset="UTF-8">
<script defer src="/gate.js?v=1"></script>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="毛毛的音乐作品 —— 原创与翻唱，在线试听">
<meta name="theme-color" content="#7C5CBF">
<title>音乐作品</title>

<!-- 引入全局样式表（与其它页面共用，统一外观） -->
<link rel="stylesheet" href="style.css?v=40">

<!-- 性能：提前建立关键外部连接（省掉 DNS+TLS 往返） -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://ipwho.is">
<link rel="stylesheet" href="bg.css?v=8">  <!-- 全站视觉统一层：光场背景 + 卡片玻璃质感，见仓库根 bg.css -->
<link rel="stylesheet" href="/responsive.css?v=1">  <!-- 全站响应式适配补丁：手机/平板/桌面三档，见仓库根 responsive.css -->
</head>

<!-- body 带 sub-page 类：表示这是二级子页面（区别于主页，样式更简洁） -->
<body class="sub-page">

<!-- 右上角固定返回主页链接（跳回 index.html） -->
<a href="index.html" class="back-home">
🏠 返回主页
</a>


<!-- 页面主标题 -->
<h1>🎵 音乐收藏</h1>


<!-- 占位说明：内容尚未完成，提示访客等待 -->
<p>
持续更新中，敬请期待
</p>

<!-- 我的音乐站入口（2026-09-19 毛毛要求加在这一页）
     指向 nfc-tap 那个独立站。用 target="_blank"：它是完整独立的界面，
     进去就在里面听歌，不需要「返回主站」这一层，本页也保持开着。
     样式写在本页专属 <style> 里（配深色模式），不去动全站 style.css。 -->
<style>
.music-link{
    display:block; width:fit-content; margin:20px auto 0; padding:13px 26px;
    border-radius:14px; background:rgba(255,255,255,.62); color:#5c46a0;
    text-decoration:none; font-size:15px; font-weight:600;
    box-shadow:0 6px 18px rgba(100,80,150,.15);
    transition:transform .12s, box-shadow .15s;
}
.music-link:active{ transform:scale(.985); }
body.dark-mode .music-link{
    background:rgba(30,30,42,.72); color:#d8c7ff; box-shadow:0 6px 18px rgba(0,0,0,.35);
}
</style>
<a class="music-link" href="https://maomao1ovo1.github.io/nfc-tap-9f3a/" target="_blank" rel="noopener">
🎧 我的音乐站 · Mutown Grooove
</a>

<script>
// 深色模式跟随主页设置
// 从 localStorage 读取主题；若主站选了「深色」，就给当前页 body 加 dark-mode 类，保持风格一致
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-mode");
}
</script>

</body>

</html>
